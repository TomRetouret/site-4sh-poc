                        name: texte
                        widget: string
                        required: false
                        i18n: true
                      - label: 'Destination (adresse ou #ancre)'
                        name: lien
                        widget: string
                        required: false
                        default: /references/
                        i18n: true
                    i18n: true
                  - label: Note sous les boutons
                    name: note
                    widget: string
                    required: false
                    i18n: true
                  - label: Étiquettes
                    name: etiquettes
                    widget: list
                    required: false
                    label_singular: Étiquette
