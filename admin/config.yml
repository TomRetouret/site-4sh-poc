                        name: cadrage
                        widget: select
                        required: true
                        default: centre
                        hint: Partie de l'image conservée quand elle est recadrée.
                        options:
                          - { label: Centre, value: centre }
                          - { label: Haut, value: haut }
                          - { label: Bas, value: bas }
                          - { label: Gauche, value: gauche }
                          - { label: Droite, value: droite }
                        i18n: true
                    i18n: true
                  - label: Bouton
                    name: bouton
                    widget: object
                    required: false
                    collapsed: false
                    summary: "{{fields.texte}} ({{fields.lien}})"
                    fields:
                      - { label: Texte du bouton, name: texte, widget: string, required: false, default: Notre entreprise, i18n: true }
                      - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: false, default: /notre-entreprise/, i18n: true }
                    i18n: true
            i18n: true
  # -----------------------------------------------------------------------
  # 6 bis) TÉMOIGNAGES  (contenu partagé, relié depuis les projets de l'accueil)
  #    Un fichier JSON par témoignage et par langue : src/_data/temoignages/<langue>/<slug>.json
  # -----------------------------------------------------------------------
  - name: temoignages
    label: Témoignages
    label_singular: Témoignage
    folder: src/_data/temoignages/{{locale}}
    i18n: true
    create: true
    extension: json
    format: json
    identifier_field: auteur
    slug: "{{auteur}}"
    summary: "{{auteur}}, {{entreprise}}"
    sortable_fields: [auteur, entreprise]
    fields:
      - { label: Citation, name: citation, widget: text, required: true, i18n: true }
      - { label: Nom, name: auteur, widget: string, required: true, i18n: duplicate }
      - { label: Fonction, name: fonction, widget: string, required: false, i18n: true }
      - { label: Entreprise, name: entreprise, widget: string, required: false, i18n: duplicate }

  # -----------------------------------------------------------------------
  # 6 ter) PAGES DE DÉMONSTRATION  (scénario « créer une page », français seulement)
  #    Un fichier Markdown par page dans src/demo/, contenu en front matter :
  #    mêmes blocs que l'accueil. Adresse /demo/<nom>/, jamais indexée.
  # -----------------------------------------------------------------------
  - name: demo
    label: Pages de démonstration
    label_singular: Page de démonstration
    folder: src/demo
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    preview_path: demo/{{slug}}/
    identifier_field: titre
    summary: "{{titre}}"
    fields:
      - { label: Titre de la page, name: titre, widget: string, required: true }
      - label: Référencement
        name: seo
        widget: object
        required: false
        collapsed: true
        summary: "{{fields.meta_title}}"
        hint: Ce qui s'affiche dans les résultats de Google et l'onglet du navigateur.
        fields:
          - { label: Titre SEO (onglet du navigateur), name: meta_title, widget: string, required: false, hint: 60 caractères maximum. }
          - { label: Description SEO, name: meta_description, widget: text, required: false, hint: 155 caractères maximum. }
      - label: Blocs de la page
        name: blocs
        widget: list
        required: false
        label_singular: Bloc
        hint: Les blocs s'affichent dans cet ordre. Faites-les glisser pour les déplacer. Le formulaire de contact reste toujours en bas de page.
        collapsed: true
        typeKey: type
        types:
          - label: Hero (haut de page)
            name: hero
            widget: object
            summary: "Hero : {{fields.accroche}}{{fields.masquer | ternary(' (masqué)', '')}}"
            fields:
              - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé." }
              - { label: Titre de la page (H1), name: titre_page, widget: string, required: true, hint: Affiché en petit au-dessus de l'accroche. Lu par Google et les lecteurs d'écran. 60 caractères maximum. }
              - { label: Accroche, name: accroche, widget: string, required: true, hint: Mettez un mot entre *astérisques* pour l'afficher en rouge. Environ 40 caractères. }
              - { label: Chapô, name: chapo, widget: text, required: false, hint: 40 mots maximum. }
              - label: Bouton principal
                name: bouton_principal
                widget: object
                required: true
                collapsed: false
                summary: "{{fields.texte}} ({{fields.lien}})"
                fields:
                  - { label: Texte du bouton, name: texte, widget: string, required: true }
                  - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: true, default: "#contact" }
              - label: Bouton secondaire
                name: bouton_secondaire
                widget: object
                required: false
                collapsed: false
                summary: "{{fields.texte}} ({{fields.lien}})"
                fields:
                  - { label: Texte du bouton, name: texte, widget: string, required: false }
                  - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: false, default: /references/ }
              - { label: Note sous les boutons, name: note, widget: string, required: false }
              - label: Encart visuel
                name: encart
                widget: object
                required: false
                collapsed: true
                summary: "{{fields.titre}}"
                fields:
                  - { label: Afficher l'encart, name: afficher, widget: boolean, required: false, default: true }
                  - { label: Titre de l'encart, name: titre, widget: string, required: false }
                  - label: Lignes
                    name: lignes
                    widget: list
                    required: false
                    label_singular: Ligne
                    collapsed: true
                    summary: "{{fields.cle}} : {{fields.valeur}}"
                    fields:
                      - { label: Mot-clé, name: cle, widget: string, required: false }
                      - { label: Texte, name: valeur, widget: string, required: false }
                  - { label: Badge, name: badge, widget: string, required: false }
                  - { label: Note du badge, name: badge_note, widget: string, required: false }
          - label: Logos clients (Ils nous confient leur métier)
            name: logos_clients
            widget: object
            summary: Logos clients{{fields.masquer | ternary(' (masqué)', '')}}
            fields:
              - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé." }
              - { label: Titre, name: titre, widget: string, required: false, hint: Laisser vide pour reprendre l'intitulé des réglages du site. Les noms des clients se modifient dans les réglages du site. }
          - label: Cartes d'offres (Build, Run, Learning)
            name: cartes_offres
            widget: object
            summary: "Cartes d'offres : {{fields.titre}}{{fields.masquer | ternary(' (masqué)', '')}}"
            fields:
              - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé." }
              - { label: Surtitre, name: surtitre, widget: string, required: false }
              - { label: Titre, name: titre, widget: string, required: true, hint: Mettez un mot entre *astérisques* pour l'afficher en rouge. }
              - { label: Sous-titre, name: sous_titre, widget: text, required: false }
              - label: Cartes
                name: cartes
                widget: list
                required: false
                label_singular: Carte
                collapsed: true
                min: 1
                max: 3
                summary: "{{fields.titre}}"
                hint: De 1 à 3 cartes.
                fields:
                  - label: Couleur d'offre
                    name: offre
                    widget: select
                    required: true
                    default: build
                    hint: Donne la couleur, le picto et l'étiquette de la carte.
                    options:
                      - { label: 4SH Build, value: build }
                      - { label: 4SH Run, value: run }
                      - { label: 4SH Learning, value: learning }
                      - { label: 4SH institutionnel, value: institutionnel }
                  - { label: Titre, name: titre, widget: string, required: true }
                  - { label: Texte, name: texte, widget: text, required: true }
                  - label: Liens
                    name: liens
                    widget: list
                    required: false
                    label_singular: Lien
                    collapsed: true
                    summary: "{{fields.texte}}"
                    fields:
                      - { label: Texte du bouton, name: texte, widget: string, required: false }
                      - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: false }
                  - label: Lien de bas de carte
                    name: lien_bas
                    widget: object
                    required: false
                    collapsed: false
                    summary: "{{fields.texte}} ({{fields.lien}})"
                    fields:
                      - { label: Texte du bouton, name: texte, widget: string, required: false }
                      - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: false }
          - label: Chiffres clés
            name: chiffres_cles
            widget: object
            summary: Chiffres clés{{fields.masquer | ternary(' (masqué)', '')}}
            fields:
              - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé." }
              - label: Chiffres
                name: chiffres
                widget: list
                required: false
                label_singular: Chiffre
                collapsed: true
                min: 2
                max: 4
                summary: "{{fields.valeur}} {{fields.texte}}"
                hint: De 2 à 4 chiffres.
                fields:
                  - { label: Chiffre, name: valeur, widget: string, required: true }
                  - { label: Libellé, name: texte, widget: string, required: true }
                  - { label: Note (petit texte), name: note, widget: string, required: false }
          - label: Cartes secteurs (carrousel)
            name: cartes_secteurs
            widget: object
            summary: "Cartes secteurs : {{fields.titre}}{{fields.masquer | ternary(' (masqué)', '')}}"
            fields:
              - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé." }
              - { label: Surtitre, name: surtitre, widget: string, required: false }
              - { label: Titre, name: titre, widget: string, required: true, hint: Mettez un mot entre *astérisques* pour l'afficher en rouge. }
              - { label: Sous-titre, name: sous_titre, widget: text, required: false }
              - label: Cartes
                name: cartes
                widget: list
                required: false
                label_singular: Carte
                collapsed: true
                summary: "{{fields.titre}}"
                fields:
                  - { label: Titre, name: titre, widget: string, required: true }
                  - { label: Texte, name: texte, widget: text, required: false }
                  - label: Lien de la carte
                    name: lien
                    widget: object
                    required: false
                    collapsed: false
                    summary: "{{fields.texte}} ({{fields.lien}})"
                    fields:
                      - { label: Texte du bouton, name: texte, widget: string, required: false }
                      - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: false }
          - label: Méthode 4D
            name: methode_4d
            widget: object
            summary: "Méthode 4D : {{fields.titre}}{{fields.masquer | ternary(' (masqué)', '')}}"
            fields:
              - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé." }
              - { label: Surtitre, name: surtitre, widget: string, required: false }
              - { label: Titre, name: titre, widget: string, required: true, hint: Mettez un mot entre *astérisques* pour l'afficher en rouge. }
              - { label: Sous-titre, name: sous_titre, widget: text, required: false }
              - label: Étapes
                name: etapes
                widget: list
                required: false
                label_singular: Étape
                collapsed: true
                min: 4
                max: 4
                summary: "{{fields.numero}} {{fields.phase}}"
                hint: Exactement 4 étapes. Elles sont aussi reprises dans le haut de page.
                fields:
                  - { label: Numéro, name: numero, widget: string, required: false }
                  - { label: Phase, name: phase, widget: string, required: false }
                  - { label: Titre, name: titre, widget: string, required: false }
                  - { label: Texte, name: texte, widget: text, required: false }
          - label: Projets (carrousel de réalisations)
            name: projets
            widget: object
            summary: "Projets : {{fields.titre}}{{fields.masquer | ternary(' (masqué)', '')}}"
            fields:
              - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé." }
              - { label: Surtitre, name: surtitre, widget: string, required: false }
              - { label: Titre, name: titre, widget: string, required: true, hint: Mettez un mot entre *astérisques* pour l'afficher en rouge. }
              - { label: Sous-titre, name: sous_titre, widget: text, required: false }
              - label: Projets
                name: projets
                widget: list
                required: false
                label_singular: Projet
                collapsed: true
                summary: "{{fields.client}} ({{fields.secteur}})"
                fields:
                  - { label: Secteur, name: secteur, widget: string, required: false }
                  - { label: Client, name: client, widget: string, required: true }
                  - label: Visuel du projet
                    name: image
                    widget: object
                    required: false
                    collapsed: true
                    summary: "{{fields.fichier}}"
                    fields:
                      - { label: Image, name: fichier, widget: image, required: false }
                      - { label: Texte alternatif, name: alt, widget: string, required: false, hint: Obligatoire sauf si l'image est décorative. Décrivez ce que montre l'image. }
                      - { label: Image décorative (aucune information à transmettre), name: decorative, widget: boolean, required: false, default: false }
                      - { label: Crédit photo, name: credit, widget: string, required: false }
                      - label: Cadrage
                        name: cadrage
                        widget: select
                        required: true
                        default: centre
                        hint: Partie de l'image conservée quand elle est recadrée.
                        options:
                          - { label: Centre, value: centre }
                          - { label: Haut, value: haut }
                          - { label: Bas, value: bas }
                          - { label: Gauche, value: gauche }
                          - { label: Droite, value: droite }
                  - { label: Description, name: description, widget: text, required: false }
                  - { label: Témoignage, name: temoignage, widget: relation, required: false, hint: "Choisissez un témoignage de la collection Témoignages. Pour en créer un, passez par cette collection.", collection: temoignages, value_field: "{{slug}}", display_fields: ["{{auteur}}, {{entreprise}}"], search_fields: [auteur, entreprise, citation] }
                  - label: Chiffres du projet
                    name: chiffres
                    widget: list
                    required: false
                    label_singular: Chiffre
                    collapsed: true
                    summary: "{{fields.valeur}} {{fields.libelle}}"
                    fields:
                      - { label: Chiffre, name: valeur, widget: string, required: false, hint: Mettez un mot entre *astérisques* pour l'afficher en rouge. }
                      - { label: Libellé, name: libelle, widget: string, required: false }
                  - label: Bouton du projet
                    name: bouton
                    widget: object
                    required: false
                    collapsed: false
                    summary: "{{fields.texte}} ({{fields.lien}})"
                    fields:
                      - { label: Texte du bouton, name: texte, widget: string, required: false }
                      - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: false }
              - label: Bouton sous le carrousel
                name: bouton_bas
                widget: object
                required: false
                collapsed: false
                summary: "{{fields.texte}} ({{fields.lien}})"
                fields:
                  - { label: Texte du bouton, name: texte, widget: string, required: false }
                  - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: false, default: /references/ }
          - label: Technologies (mur)
            name: technologies
            widget: object
            summary: "Technologies : {{fields.titre}}{{fields.masquer | ternary(' (masqué)', '')}}"
            fields:
              - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé." }
              - { label: Surtitre, name: surtitre, widget: string, required: false }
              - { label: Titre, name: titre, widget: string, required: true, hint: Mettez un mot entre *astérisques* pour l'afficher en rouge. }
              - { label: Sous-titre, name: sous_titre, widget: text, required: false }
              - label: Technologies
                name: technos
                widget: list
                required: false
                label_singular: Technologie
                collapsed: true
                summary: "{{fields.nom}}"
                fields:
                  - { label: Nom, name: nom, widget: string, required: true }
                  - { label: Destination, name: lien, widget: string, required: false }
          - label: Questions fréquentes
            name: faq
            widget: object
            summary: "Questions fréquentes : {{fields.titre}}{{fields.masquer | ternary(' (masqué)', '')}}"
            fields:
              - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé." }
              - { label: Titre, name: titre, widget: string, required: true }
              - { label: Sous-titre, name: sous_titre, widget: text, required: false }
              - label: Questions
                name: questions
                widget: list
                required: false
                label_singular: Question
                collapsed: true
                summary: "{{fields.question}}"
                fields:
                  - { label: Question, name: question, widget: string, required: true }
                  - { label: Réponse, name: reponse, widget: text, required: true }
          - label: Derniers articles du blog
            name: derniers_articles
            widget: object
            summary: "Derniers articles : {{fields.titre}}{{fields.masquer | ternary(' (masqué)', '')}}"
            fields:
              - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé." }
              - { label: Titre, name: titre, widget: string, required: false, hint: Mettez un mot entre *astérisques* pour l'afficher en rouge. Les articles sont repris automatiquement du blog., default: Nos derniers *articles* }
              - label: Lien vers le blog
                name: lien_tout
                widget: object
                required: false
                collapsed: false
                summary: "{{fields.texte}} ({{fields.lien}})"
                fields:
                  - { label: Texte du bouton, name: texte, widget: string, required: false, default: Tout le blog }
                  - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: false, default: https://blog.4sh.fr/ }
          - label: Équipe (photo et texte)
            name: equipe
            widget: object
            summary: "Équipe : {{fields.titre}}{{fields.masquer | ternary(' (masqué)', '')}}"
            fields:
              - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé." }
              - { label: Surtitre, name: surtitre, widget: string, required: false }
              - { label: Titre, name: titre, widget: string, required: true, hint: Mettez un mot entre *astérisques* pour l'afficher en rouge. }
              - { label: Texte, name: texte, widget: text, required: false }
              - label: Photo de l'équipe
                name: photo
                widget: object
                required: false
                collapsed: true
                summary: "{{fields.fichier}}"
                fields:
                  - { label: Image, name: fichier, widget: image, required: false }
                  - { label: Texte alternatif, name: alt, widget: string, required: false, hint: "Obligatoire sauf si l'image est décorative. Décrivez ce que montre l'image. À défaut, le titre est utilisé." }
                  - { label: Image décorative (aucune information à transmettre), name: decorative, widget: boolean, required: false, default: false }
                  - { label: Crédit photo, name: credit, widget: string, required: false }
                  - label: Cadrage
                    name: cadrage
                    widget: select
                    required: true
                    default: centre
                    hint: Partie de l'image conservée quand elle est recadrée.
                    options:
                      - { label: Centre, value: centre }
                      - { label: Haut, value: haut }
                      - { label: Bas, value: bas }
                      - { label: Gauche, value: gauche }
                      - { label: Droite, value: droite }
              - label: Bouton
                name: bouton
                widget: object
                required: false
                collapsed: false
                summary: "{{fields.texte}} ({{fields.lien}})"
                fields:
                  - { label: Texte du bouton, name: texte, widget: string, required: false, default: Notre entreprise }
                  - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: false, default: /notre-entreprise/ }

  # -----------------------------------------------------------------------
  # 7) PAGES  (contenus éditables des pages existantes)
  # -----------------------------------------------------------------------
  - name: "pages"
    label: "Pages"
    files:
      - name: "page_formations"
        label: "Formations (page mère)"
        file: "src/_data/page_formations.json"
        preview_path: "formations/"
        fields: &f_page_formations
          - { label: "Titre SEO", name: "meta_title", widget: "string", required: false }
          - { label: "Description SEO", name: "meta_description", widget: "text", required: false }
          - { label: "Sur-titre", name: "eyebrow", widget: "string", required: false }
          - { label: "Titre principal de la page (grand titre visible)", name: "h1", widget: "string", hint: "Pour mettre un mot en avant (rouge, italique), encadrez-le d'astérisques. Ex. : votre *projet*", required: true }
          - { label: "Paragraphe d'introduction", name: "chapo", widget: "text", required: false }
          - { label: "Note", name: "note", widget: "string", hint: "Ex. : 4,71 / 5", required: false }
          - { label: "Détail de la note", name: "note_detail", widget: "string", hint: "Ex. : 324 participant·e·s", required: false }
          - { label: "Hero · bouton principal (libellé)", name: "hero_cta_principal_label", widget: "string", required: false }
          - { label: "Hero · bouton principal (lien)", name: "hero_cta_principal_url", widget: "string", required: false }
          - { label: "Hero · bouton secondaire (libellé)", name: "hero_cta_secondaire_label", widget: "string", required: false }
          - { label: "Hero · bouton secondaire (lien)", name: "hero_cta_secondaire_url", widget: "string", required: false }
          - label: "Hero · étiquettes (petits mots-clés)"
            name: "hero_chips"
            widget: "list"
            field: { label: "Puce", name: "item", widget: "string", required: false }
          - { label: "Catalogue · titre", name: "catalogue_titre", widget: "string", hint: "Pour mettre un mot en avant (rouge, italique), encadrez-le d'astérisques. Ex. : votre *projet*", required: false }
          - { label: "Catalogue · sous-titre", name: "catalogue_sous", widget: "text", required: false }
          - { label: "Agenda · titre", name: "agenda_titre", widget: "string", hint: "Pour mettre un mot en avant (rouge, italique), encadrez-le d'astérisques. Ex. : votre *projet*", required: false }
          - { label: "Agenda · sous-titre", name: "agenda_sous", widget: "text", required: false }
          - { label: "Agenda · libellé du bouton", name: "agenda_cta_label", widget: "string", required: false }
          - { label: "Agenda · lien du bouton", name: "agenda_cta_url", widget: "string", required: false }
          - label: "Agenda (sessions par mois)"
            name: "agenda"
            widget: "list"
            fields:
              - { label: "Mois", name: "mois", widget: "string", hint: "Ex. : Septembre 2026", required: false }
              - label: "Sessions"
                name: "sessions"
                widget: "list"
                fields:
                  - { label: "Jour", name: "jour", widget: "string", required: false }
                  - { label: "Mois (court)", name: "mois_court", widget: "string", hint: "Ex. : Sept.", required: false }
                  - { label: "Durée", name: "duree", widget: "string", required: false }
                  - { label: "Logo techno (URL ou image)", name: "logo", widget: "image", required: false, choose_url: true }
                  - { label: "Titre de la formation", name: "titre", widget: "string", required: false }
                  - { label: "Catégorie (pastille)", name: "categorie", widget: "string", required: false }
                  - { label: "Lieu", name: "lieu", widget: "string", required: false }
                  - { label: "Modalité", name: "modalite", widget: "string", required: false }
                  - { label: "Lien d'inscription", name: "url", widget: "string", required: false }
          - { label: "Témoignages · titre", name: "temoignages_titre", widget: "string", hint: "Pour mettre un mot en avant (rouge, italique), encadrez-le d'astérisques. Ex. : votre *projet*", required: false }
          - label: "Témoignages"
            name: "temoignages"
            widget: "list"
            fields:
              - { label: "Citation", name: "citation", widget: "text", required: false }
              - { label: "Initiales (pastille)", name: "initiales", widget: "string", required: false }
              - { label: "Nom", name: "nom", widget: "string", required: false }
              - { label: "Détail (société, formation)", name: "detail", widget: "string", required: false }
          - { label: "Titre section Pourquoi", name: "pourquoi_titre", widget: "string", hint: "Pour mettre un mot en avant (rouge, italique), encadrez-le d'astérisques. Ex. : votre *projet*", required: false }
          - label: "Pourquoi choisir 4SH Learning"
            name: "pourquoi"
            widget: "list"
            fields:
              - { label: "Titre", name: "titre", widget: "string", required: false }
              - { label: "Texte", name: "texte", widget: "text", required: false }
          - { label: "Titre bloc Qualiopi", name: "qualiopi_titre", widget: "string", hint: "Pour mettre un mot en avant (rouge, italique), encadrez-le d'astérisques. Ex. : votre *projet*", required: false }
          - { label: "Texte bloc Qualiopi", name: "qualiopi_texte", widget: "text", required: false }

      - name: "page_references"
        label: "Références (page mère)"
        file: "src/_data/page_references.json"
        preview_path: "references/"
        fields:
