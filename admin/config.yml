                            name: lien
                            widget: string
                            required: false
                            i18n: true
                        i18n: true
                    i18n: true
              - label: Chiffres clés
                name: chiffres_cles
                widget: object
                summary: Chiffres clés{{fields.masquer | ternary(' (masqué)', '')}}
                fields:
                  - label: Masquer ce bloc (il reste enregistré)
