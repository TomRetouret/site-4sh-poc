# Bloc « texte_image » : Texte et image
# Composant du site : src/_includes/composants/blocs/texte_image.njk
# Aperçu du back-office : admin-shared/apercus-bloc-texte_image.js
# Mode d'emploi : docs/back-office/schema-blocs.md (« Ajouter un bloc »).
# Après modification : node scripts/generer-blocs.js puis node scripts/assembler-config.js

# Profils où le bloc est proposé, avec son rang dans le menu « Ajouter un bloc » (10, 20, 30...).
profils:
  demo: 170
  offre: 33
  institutionnel: 55
  institutionnel_bilingue: 55

# Définition du type de bloc pour le CMS (sans i18n : le générateur l'ajoute pour l'accueil).
type:
  label: Texte et image
  name: texte_image
  widget: object
  summary: 'Texte et image : {{fields.titre}}{{fields.masquer | ternary('' (masqué)'', '''')}}'
  fields:
    - label: Masquer ce bloc (il reste enregistré)
      name: masquer
      widget: boolean
      required: false
      default: false
      hint: Le bloc n'apparaît plus sur le site, mais son contenu est conservé.
    - label: Surtitre
      name: surtitre
      widget: string
      required: false
      hint: Petit texte au-dessus du titre. 30 caractères maximum.
    - label: Titre
      name: titre
      widget: string
      required: true
      hint: 60 caractères maximum. Mettez un mot entre *astérisques* pour l'afficher en rouge.
    - label: Texte
      name: texte
      widget: markdown
      required: true
      hint: Gras, liens et listes uniquement. Laissez une ligne vide entre deux paragraphes. 150 mots maximum.
      buttons:
        - bold
        - link
        - bulleted-list
        - numbered-list
      editor_components: []
      modes:
        - rich_text
    - label: Image
      name: image
      widget: object
      required: true
      collapsed: false
      summary: '{{fields.fichier}}'
      fields:
        - label: Image
          name: fichier
          widget: image
          required: true
          hint: Format paysage, 1600 px de large minimum. Affichée en 4:3 à côté du texte.
        - label: Texte alternatif
          name: alt
          widget: string
          required: false
          hint: 'Obligatoire sauf si l''image est décorative. Décrivez ce que montre l''image en une phrase, 120 caractères maximum. Par exemple : Deux développeurs devant un tableau blanc couvert de maquettes.'
        - label: Image décorative (aucune information à transmettre)
          name: decorative
          widget: boolean
          required: false
          default: false
          hint: Cochez seulement si l'image n'apporte rien au texte (ambiance, texture). Le texte alternatif est alors ignoré.
        - label: Crédit photo
          name: credit
          widget: string
          required: false
          hint: 'Affiché en petit sous l''image. Par exemple : Photo Studio Nantes. Vide : pas de crédit.'
        - label: Cadrage
          name: cadrage
          widget: select
          required: true
          default: centre
          hint: Partie de l'image conservée quand elle est recadrée.
          options:
            - label: Centre
              value: centre
            - label: Haut
              value: haut
            - label: Bas
              value: bas
            - label: Gauche
              value: gauche
            - label: Droite
              value: droite
    - label: Position de l'image
      name: position_image
      widget: select
      required: true
      default: gauche
      hint: Sur ordinateur. Sur téléphone, l'image passe toujours au-dessus du texte.
      options:
        - label: À gauche du texte
          value: gauche
        - label: À droite du texte
          value: droite
    - label: Bouton
      name: bouton
      widget: object
      required: false
      collapsed: false
      summary: '{{fields.texte}} ({{fields.lien}})'
      fields:
        - label: Texte du bouton
          name: texte
          widget: string
          required: false
          hint: '25 caractères maximum, commence par un verbe. Vide : pas de bouton.'
        - label: 'Destination (adresse ou #ancre)'
          name: lien
          widget: string
          required: false
          hint: Adresse commençant par / pour une page du site, https:// pour un site externe.
