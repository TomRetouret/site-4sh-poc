            name: derniers_articles
            widget: object
            summary: 'Derniers articles : {{fields.titre}}{{fields.masquer | ternary('' (masqué)'', '''')}}'
            fields:
              - label: Masquer ce bloc (il reste enregistré)
                name: masquer
                widget: boolean
                required: false
                default: false
                hint: Le bloc n'apparaît plus sur le site, mais son contenu est conservé.
              - label: Titre
                name: titre
                widget: string
                required: false
                hint: Mettez un mot entre *astérisques* pour l'afficher en rouge. Les articles sont repris automatiquement du blog.
                default: Nos derniers *articles*
              - label: Lien vers le blog
                name: lien_tout
                widget: object
                required: false
                collapsed: false
                summary: '{{fields.texte}} ({{fields.lien}})'
                fields:
                  - label: Texte du bouton
                    name: texte
                    widget: string
                    required: false
                    default: Tout le blog
                  - label: 'Destination (adresse ou #ancre)'
                    name: lien
                    widget: string
                    required: false
                    default: https://blog.4sh.fr/
        # <<< BLOCS
      - label: Références en bas de page
        name: references
        widget: relation
        required: false
        multiple: true
        collection: references
        value_field: "{{slug}}"
        search_fields: [titre, client]
        display_fields: [titre]
        hint: "Facultatif. Fiches références affichées en cartes avant les questions fréquentes. Une fiche déjà reliée dans une section Projets n'est pas répétée."
      - { label: Titre des questions fréquentes, name: faq_titre, widget: string, required: false, hint: "Facultatif. Vide : « Questions fréquentes »." }
      - label: Questions fréquentes
        name: faq
        widget: list
        required: false
        label_singular: Question
        collapsed: true
        summary: "{{fields.question}}"
        hint: Facultatif. Affichées en accordéon avant le formulaire de contact, et signalées à Google.
        fields:
          - { label: Question, name: question, widget: string, required: true, hint: "Formulée comme le visiteur la poserait. 100 caractères maximum." }
          - { label: Réponse, name: reponse, widget: text, required: true, hint: "Texte simple, 80 mots maximum." }
      - label: Référencement
        name: referencement
        widget: object
        required: false
        collapsed: true
        summary: "{{fields.meta_title}}"
        hint: "Ce qui s'affiche dans les résultats de Google et l'onglet du navigateur. N'apparaît pas dans la page."
        fields:
          - { label: Titre SEO, name: meta_title, widget: string, required: false, hint: "50 à 60 caractères conseillés. Vide : « Nom court de la prestation - 4SH »." }
          - { label: Description SEO, name: meta_description, widget: text, required: false, hint: "150 à 160 caractères conseillés. Vide : le chapô est utilisé." }
          - { label: Afficher dans les moteurs de recherche, name: indexation, widget: boolean, required: false, default: true, hint: "Laisser coché en temps normal. Décocher masque la page dans Google et la retire du plan du site." }
          - *f_donnees_structurees
      - { label: "Mémo : adresse sur l'ancien site (non affiché)", name: source_url, widget: string, required: false }
      - { label: "Mémo : page Confluence de rédaction (non affiché)", name: source_confluence, widget: string, required: false }
      - { label: "Mémo : requête Google visée (non affiché)", name: requete_cible, widget: string, required: false }
      - { label: "Mémo : adresse prévue (non affiché)", name: slug_prevu, widget: string, required: false }
