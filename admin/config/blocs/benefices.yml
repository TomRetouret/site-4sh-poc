# Bloc « benefices » : Liste de bénéfices
# Composant du site : src/_includes/composants/blocs/benefices.njk
# Mode d'emploi : docs/back-office/schema-blocs.md (« Ajouter un bloc »).
# Après modification : node scripts/generer-blocs.js puis node scripts/assembler-config.js

# Profils où le bloc est proposé, avec son rang dans le menu « Ajouter un bloc » (10, 20, 30...).
profils:
  demo: 140
  offre: 50
  institutionnel: 42
  institutionnel_bilingue: 42

# Définition du type de bloc pour le CMS (sans i18n : le générateur l'ajoute pour l'accueil).
type:
  label: Liste de bénéfices
  name: benefices
  widget: object
  summary: 'Bénéfices : {{fields.titre}}{{fields.masquer | ternary('' (masqué)'', '''')}}'
  fields:
    - label: Masquer ce bloc (il reste enregistré)
      name: masquer
      widget: boolean
      required: false
      default: false
      hint: Le bloc n'apparaît plus sur le site, mais son contenu est conservé.
    - label: Surtitre
      name: surtitre
      widget: string
      required: false
      hint: Petit texte au-dessus du titre. 30 caractères maximum.
    - label: Titre
      name: titre
      widget: string
      required: true
      hint: 60 caractères maximum. Mettez un mot entre *astérisques* pour l'afficher en rouge.
    - label: Sous-titre
      name: sous_titre
      widget: text
      required: false
      hint: 25 mots maximum.
    - label: Bénéfices
      name: benefices
      widget: list
      required: true
      label_singular: Bénéfice
      collapsed: true
      min: 3
      max: 6
      summary: '{{fields.titre}}'
      hint: De 3 à 6 bénéfices, numérotés automatiquement dans l'ordre de la liste.
      fields:
        - label: Titre
          name: titre
          widget: string
          required: true
          hint: 40 caractères maximum.
        - label: Texte
          name: texte
          widget: string
          required: false
          hint: 20 mots maximum.
