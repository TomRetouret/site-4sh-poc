                fields:
                  - label: Masquer ce bloc (il reste enregistré)
                    name: masquer
                    widget: boolean
                    required: false
                    default: false
                    hint: Le bloc n'apparaît plus sur le site, mais son contenu est conservé.
                  - label: Surtitre
                    name: surtitre
                    widget: string
                    required: false
                    hint: Petit texte au-dessus du titre. 30 caractères maximum.
                  - label: Titre
                    name: titre
                    widget: string
                    required: true
                    hint: 60 caractères maximum. Mettez un mot entre *astérisques* pour l'afficher en rouge.
                  - label: Texte
                    name: texte
                    widget: markdown
                    required: true
                    hint: Gras, liens et listes uniquement. Laissez une ligne vide entre deux paragraphes. 300 mots maximum.
                    buttons:
