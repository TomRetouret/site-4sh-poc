  # -----------------------------------------------------------------------
  # 6 bis) TÉMOIGNAGES  (contenu partagé, relié depuis les projets de l'accueil et le projet vedette des pages d'offre)
  #    Un fichier JSON par témoignage et par langue : src/_data/temoignages/<langue>/<slug>.json
  # -----------------------------------------------------------------------
  - name: temoignages
    label: Témoignages
    label_singular: Témoignage
    folder: src/_data/temoignages/{{locale}}
    i18n: true
    create: true
    extension: json
    format: json
    identifier_field: entreprise
    slug: "{{entreprise}} {{auteur}}"
    summary: "{{entreprise}} {{auteur}}"
    sortable_fields: [entreprise, auteur]
    fields:
      - { label: Citation, name: citation, widget: text, required: true, i18n: true }
      - { label: Nom, name: auteur, widget: string, required: false, hint: "Facultatif : laissez vide si la personne n'a pas donné son accord pour être nommée. N'inventez jamais un nom.", i18n: duplicate }
      - { label: Fonction, name: fonction, widget: string, required: false, i18n: true }
      - { label: Entreprise, name: entreprise, widget: string, required: true, hint: Affichée sous la citation, seule si le nom est vide., i18n: duplicate }

  # -----------------------------------------------------------------------
  # 6 quater) APPELS À L'ACTION  (contenu partagé : texte et destination d'un bouton)
  #    Un fichier JSON par appel à l'action : src/_data/appels_action/<slug>.json
  #    Relié depuis le bouton flottant des pages d'offre et le bloc « Appel à l'action final ».
  #    Spécification : docs/back-office/schema-logiciel-metier.md
  # -----------------------------------------------------------------------
  - name: appels_action
    label: Appels à l'action
    label_singular: Appel à l'action
    description: Boutons réutilisés sur plusieurs pages. Modifier un appel à l'action le change partout où il est relié.
    folder: src/_data/appels_action
    create: true
    extension: json
    format: json
    identifier_field: intitule
    slug: "{{intitule}}"
    summary: "{{intitule}} : {{texte}}"
    sortable_fields: [intitule, texte]
    fields:
      - { label: Intitulé interne, name: intitule, widget: string, required: true, hint: "Sert à retrouver l'appel à l'action dans les listes. N'apparaît pas sur le site. Par exemple : Parlons de votre projet (formulaire de contact)." }
      - { label: Texte du bouton, name: texte, widget: string, required: true, hint: 25 caractères maximum, commence par un verbe. }
      - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: true, default: "#contact", hint: "#contact pour le formulaire en bas de page, une adresse commençant par / pour une page du site, https:// pour un site externe." }

  # -----------------------------------------------------------------------
  # 6 ter) PAGES DE DÉMONSTRATION  (scénario « créer une page », français seulement)
