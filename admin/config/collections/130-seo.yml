      - name: seo
        label: Référencement et indexation (SEO)
        file: src/_data/seo.json
        format: json
        description: "Réglages de référencement communs à tout le site français."
        fields: &f_seo
          - { label: Adresse du site en production, name: url, widget: string, required: true, pattern: ['^https?://[^/]+$', "Adresse complète sans barre oblique finale, par exemple https://www.4sh.fr."], hint: "Sans barre oblique finale. Sert aux liens canoniques, au plan du site et au robots.txt. Par exemple : https://www.4sh.fr." }
          - { label: Autoriser l'indexation par les moteurs de recherche, name: indexation, widget: boolean, required: false, default: false, hint: "Décoché : tout le site est masqué aux moteurs (préproduction). À cocher à la mise en production." }
          - { label: Titre par défaut, name: titre_defaut, widget: string, required: true, hint: "Onglet du navigateur et résultats Google, pour une page sans titre SEO propre. 60 caractères maximum." }
          - { label: Description par défaut, name: description_defaut, widget: text, required: true, hint: "Pour une page sans description SEO propre. 155 caractères maximum." }
          - { label: Image de partage sur les réseaux sociaux, name: og_image, widget: image, required: false, choose_url: true, hint: "Image affichée quand une page est partagée (LinkedIn, X...). 1200 x 630 px conseillés." }
          - { label: Contenu du robots.txt, name: robots_txt, widget: text, required: true, hint: "Règles pour les robots des moteurs. La ligne Sitemap est ajoutée automatiquement." }
