# Bloc « methode_4d » : Méthode 4D
# Composant du site : src/_includes/composants/blocs/methode_4d.njk
# Mode d'emploi : docs/back-office/schema-blocs.md (« Ajouter un bloc »).
# Après modification : node scripts/generer-blocs.js puis node scripts/assembler-config.js

# Profils où le bloc est proposé, avec son rang dans le menu « Ajouter un bloc » (10, 20, 30...).
profils:
  accueil: 60
  demo: 60

# Définition du type de bloc pour le CMS (sans i18n : le générateur l'ajoute pour l'accueil).
type:
  label: Méthode 4D
  name: methode_4d
  widget: object
  summary: 'Méthode 4D : {{fields.titre}}{{fields.masquer | ternary('' (masqué)'', '''')}}'
  fields:
    - label: Masquer ce bloc (il reste enregistré)
      name: masquer
      widget: boolean
      required: false
      default: false
      hint: Le bloc n'apparaît plus sur le site, mais son contenu est conservé.
    - label: Surtitre
      name: surtitre
      widget: string
      required: false
    - label: Titre
      name: titre
      widget: string
      required: true
      hint: Mettez un mot entre *astérisques* pour l'afficher en rouge.
    - label: Sous-titre
      name: sous_titre
      widget: text
      required: false
    - label: Étapes
      name: etapes
      widget: list
      required: false
      label_singular: Étape
      collapsed: true
      min: 4
      max: 4
      summary: '{{fields.numero}} {{fields.phase}}'
      hint: Exactement 4 étapes. Elles sont aussi reprises dans le haut de page.
      fields:
        - label: Numéro
          name: numero
          widget: string
          required: false
        - label: Phase
          name: phase
          widget: string
          required: false
        - label: Titre
          name: titre
          widget: string
          required: false
        - label: Texte
          name: texte
          widget: text
          required: false
