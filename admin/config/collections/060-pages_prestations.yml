  # -----------------------------------------------------------------------
  # 5ter) PRESTATIONS  (une page de prestation = un fichier ; sous /prestations/)
  #    Contenu entièrement en front matter : en-tête, chiffres, sections (blocs « section_* »),
  #    références, questions fréquentes, référencement. Le formulaire de contact est automatique.
  #    Spécification : docs/back-office/schema-prestations.md
  #    Les types de sections viennent de admin/config/blocs/section_*.yml (profil « prestation ») :
  #    après modification, node scripts/generer-blocs.js puis node scripts/assembler-config.js.
  # -----------------------------------------------------------------------
  - name: pages_prestations
    label: Prestations
    label_singular: Prestation
    description: "Pages de prestation (/prestations/...). Ordre fixe : en-tête, chiffres, sections, références, questions fréquentes, formulaire de contact."
    folder: src/content/prestations
    preview_path: "prestations/{{slug}}/"
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    identifier_field: titre
    summary: "{{titre}}"
    sortable_fields: [ordre, titre]
    fields:
      - { label: Nom court de la prestation, name: titre, widget: string, required: true, hint: "Affiché dans le fil d'Ariane et dans l'onglet du navigateur si le titre SEO est vide. 40 caractères maximum. Par exemple : UX Design." }
      - { label: Ordre d'affichage, name: ordre, widget: number, required: false, value_type: int, min: 1, hint: "Nombre entier : le plus petit passe en premier dans la liste des prestations." }
      - label: En-tête de page
        name: entete
        widget: object
        required: true
        collapsed: false
        summary: "{{fields.titre_h1}}"
        fields:
          - label: Couleur d'offre
            name: offre
            widget: select
            required: true
            default: build
            options:
              - { label: "4SH Build · Concevoir & développer", value: build }
              - { label: "4SH Run · Faire vivre & auditer", value: run }
            hint: Donne le surtitre coloré au-dessus du grand titre et la couleur de la page.
          - { label: Grand titre de la page (H1), name: titre_h1, widget: string, required: true, hint: "Lu par Google et les lecteurs d'écran. 70 caractères maximum. Mettez un mot entre *astérisques* pour l'afficher en rouge." }
          - { label: Chapô, name: chapo, widget: text, required: false, hint: "Deux ou trois phrases sous le grand titre. 50 mots maximum. Sert aussi de description dans Google si la description SEO est vide." }
          - label: Bouton
            name: bouton
            widget: object
            required: true
            summary: "{{fields.texte}}"
            fields:
              - { label: Texte du bouton, name: texte, widget: string, required: true, default: Parlons de votre projet, hint: "30 caractères maximum." }
              - { label: Destination, name: lien, widget: string, required: true, default: /contact/, hint: "Adresse d'une page du site, par exemple /contact/." }
          - label: Page parente (fil d'Ariane)
            name: parent
            widget: object
            required: false
            collapsed: true
            summary: "{{fields.texte}}"
            hint: "Pour une page par ville seulement : la page générale, affichée entre « Accueil » et cette page. Laissez vide sinon."
            fields:
              - { label: Nom de la page parente, name: texte, widget: string, required: false, hint: "Par exemple : Application mobile." }
              - { label: Adresse de la page parente, name: lien, widget: string, required: false, hint: "Par exemple : /prestations/application-mobile/." }
          - label: Illustration de l'en-tête
            name: illustration
            widget: object
            required: false
            collapsed: true
            summary: "{{fields.fichier}}"
            hint: "Facultatif. Affichée à droite du grand titre sur ordinateur, masquée sur téléphone. Illustration au format SVG ou PNG."
            fields:
              - { label: Image, name: fichier, widget: image, required: false, hint: "Illustration de l'offre, par exemple /uploads/ancien-site/assets/img/svg/offers/illu-build.svg." }
              - { label: Texte alternatif, name: alt, widget: string, required: false, hint: "Obligatoire sauf si l'illustration est décorative. Une phrase, 120 caractères maximum." }
              - { label: Image décorative (aucune information à transmettre), name: decorative, widget: boolean, required: false, default: true, hint: "Cochée par défaut : une illustration d'ambiance n'est pas lue par les lecteurs d'écran." }
      - label: Chiffres clés
        name: chiffres
        widget: list
        required: false
        label_singular: Chiffre
        collapsed: true
        max: 4
        summary: "{{fields.chiffre}} {{fields.label}}"
        hint: Facultatif. Bandeau sous l'en-tête, 4 chiffres au maximum. Sans chiffre, pas de bandeau.
        fields:
          - { label: Chiffre, name: chiffre, widget: string, required: true, hint: "Court, par exemple : +15 ans. Mettez une partie entre *astérisques* pour l'afficher en rouge." }
          - { label: Libellé, name: label, widget: string, required: true, hint: "Quelques mots, par exemple : d'expertise." }
      - label: Sections de la page
        name: blocs
        widget: list
        required: true
        label_singular: Section
        collapsed: true
        min: 1
        typeKey: type
        hint: "Les sections s'affichent dans cet ordre ; faites-les glisser pour les déplacer. Le fond (blanc, gris clair une section sur deux, sombre pour la première section en étapes) et le numéro des sections sont calculés automatiquement."
        # >>> BLOCS:prestation (généré par scripts/generer-blocs.js : ne pas modifier à la main)
        types:
          - label: Section de texte
            name: section_texte
            widget: object
            summary: 'Texte : {{fields.titre}}{{fields.masquer | ternary('' (masqué)'', '''')}}'
            fields:
