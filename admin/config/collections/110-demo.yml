                        widget: string
                        required: false
              - label: Bouton sous le carrousel
                name: bouton_bas
                widget: object
                required: false
                collapsed: false
                summary: '{{fields.texte}} ({{fields.lien}})'
                fields:
                  - label: Texte du bouton
                    name: texte
                    widget: string
                    required: false
                  - label: 'Destination (adresse ou #ancre)'
                    name: lien
                    widget: string
                    required: false
