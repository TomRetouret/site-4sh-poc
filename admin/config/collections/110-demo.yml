          - label: Projets (carrousel de réalisations)
            name: projets
            widget: object
            summary: 'Projets : {{fields.titre}}{{fields.masquer | ternary('' (masqué)'', '''')}}'
            fields:
              - label: Masquer ce bloc (il reste enregistré)
                name: masquer
