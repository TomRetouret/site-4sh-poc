                        collapsed: true
                        summary: '{{fields.cle}} : {{fields.valeur}}'
                        fields:
                          - label: Mot-clé
                            name: cle
                            widget: string
                            required: false
                          - label: Texte
                            name: valeur
                            widget: string
                            required: false
                      - label: Badge
                        name: badge
                        widget: string
                        required: false
                      - label: Note du badge
                        name: badge_note
                        widget: string
                        required: false
                    hint: Variante expressive uniquement.
              - label: Texte simple
                name: texte_simple
                widget: object
                summary: 'Texte simple : {{fields.titre}}{{fields.masquer | ternary('' (masqué)'', '''')}}'
                fields:
                  - label: Masquer ce bloc (il reste enregistré)
