# Bloc « projet_vedette » : Projet vedette
# Composant du site : src/_includes/composants/blocs/projet_vedette.njk
# Mode d'emploi : docs/back-office/schema-blocs.md (« Ajouter un bloc »).
# Après modification : node scripts/generer-blocs.js puis node scripts/assembler-config.js

# Profils où le bloc est proposé, avec son rang dans le menu « Ajouter un bloc » (10, 20, 30...).
profils:
  demo: 150
  offre: 70
  institutionnel: 82
  institutionnel_bilingue: 82

# Définition du type de bloc pour le CMS (sans i18n : le générateur l'ajoute pour l'accueil).
type:
  label: Projet vedette
  name: projet_vedette
  widget: object
  summary: 'Projet vedette : {{fields.client}}{{fields.masquer | ternary('' (masqué)'', '''')}}'
  fields:
    - label: Masquer ce bloc (il reste enregistré)
      name: masquer
      widget: boolean
      required: false
      default: false
      hint: Le bloc n'apparaît plus sur le site, mais son contenu est conservé.
    - label: Surtitre
      name: surtitre
      widget: string
      required: false
      hint: Petit texte au-dessus du titre. 30 caractères maximum.
    - label: Titre
      name: titre
      widget: string
      required: true
      hint: 60 caractères maximum. Mettez un mot entre *astérisques* pour l'afficher en rouge.
    - label: Ancre de la section
      name: ancre
      widget: string
      required: false
      default: realisations
      pattern:
        - ^[a-z0-9-]*$
        - Lettres minuscules sans accent, chiffres et tirets uniquement.
      hint: 'Permet de pointer un bouton vers cette section (par exemple #realisations). Vide : pas d''ancre.'
    - label: Secteur
      name: secteur
      widget: string
      required: false
      hint: 'Affiché en petit au-dessus du client. 25 caractères maximum. Par exemple : Infoport · Fret maritime.'
    - label: Client
      name: client
      widget: string
      required: true
      hint: Nom du client ou du produit, écrit en toutes lettres. 40 caractères maximum.
    - label: Description
      name: description
      widget: text
      required: false
      hint: 30 mots maximum.
    - label: Témoignage
      name: temoignage
      widget: relation
      required: false
      hint: Choisissez un témoignage de la collection Témoignages. Pour en créer un, passez par cette collection.
      collection: temoignages
      value_field: '{{slug}}'
      display_fields:
        - '{{entreprise}} {{auteur}}'
      search_fields:
        - entreprise
        - auteur
        - citation
    - label: Chiffres du projet
      name: chiffres
      widget: list
      required: false
      label_singular: Chiffre
      collapsed: true
      max: 3
      summary: '{{fields.valeur}} {{fields.libelle}}'
      hint: 2 chiffres conseillés.
      fields:
        - label: Chiffre
          name: valeur
          widget: string
          required: true
          hint: 10 caractères maximum. Mettez un mot entre *astérisques* pour l'afficher en rouge.
        - label: Libellé
          name: libelle
          widget: string
          required: true
          hint: 30 caractères maximum.
    - label: Bouton du projet
      name: bouton
      widget: object
      required: false
      collapsed: false
      summary: '{{fields.texte}} ({{fields.lien}})'
      fields:
        - label: Texte du bouton
          name: texte
          widget: string
          required: false
          hint: '25 caractères maximum, commence par un verbe. Vide : pas de bouton.'
        - label: 'Destination (adresse ou #ancre)'
          name: lien
          widget: string
          required: false
          hint: Adresse commençant par / pour une page du site, https:// pour un site externe.
    - label: Autres références
      name: references
      widget: relation
      required: false
      multiple: true
      max: 3
      collection: references
      value_field: '{{slug}}'
      display_fields:
        - '{{titre}}'
      search_fields:
        - titre
        - client
      hint: 2 à 3 fiches de la collection Références clients. Les cartes affichent le client, le titre et le résumé de chaque fiche, avec un lien vers elle.
