  # -----------------------------------------------------------------------
  # 7) PAGES UNIQUES  (spécification : docs/back-office/schema-pages.md)
  #    Trois collections, chemins de fichiers inchangés sauf Notre démarche et Notre entreprise
  #    (passées en blocs dans src/_data/contenus/) :
  #      - Pages institutionnelles : pages en blocs (Notre démarche, Notre entreprise / Company),
  #        Intelligence artificielle, Podcasts, Contact ;
  #      - Pages mères : listes alimentées par les collections (Formations, Références,
  #        Expertises techniques, Glossaire) ;
  #      - Pages légales : Mentions légales, Notice RGPD.
  #    Réglages du site, menu, SEO et libellés : collection « Réglages » (130-seo.yml).
  #    Pages et réglages anglais : collection « Pages et réglages (anglais) » (160-pages_en.yml).
  #    Le nom (name) de chaque fichier sert aussi d'aperçu : admin-shared/apercus-pages.js.
  # -----------------------------------------------------------------------
  - name: pages_institutionnelles
    label: Pages institutionnelles
    label_singular: Page institutionnelle
    description: "Pages de présentation de 4SH. Notre démarche et Notre entreprise se composent de blocs, comme l'accueil ; Notre entreprise a sa version anglaise (Company) dans le même écran."
    i18n: true
    files:
      - name: notre_demarche
        label: Notre démarche
        file: src/_data/contenus/fr/notre_demarche.json
        format: json
        preview_path: notre-demarche/
        fields:
          - &f_seo_page
            label: Référencement
            name: seo
            widget: object
            required: true
            collapsed: true
            summary: "{{fields.meta_title}}"
            hint: "Ce qui s'affiche dans les résultats de Google et dans l'onglet du navigateur. N'apparaît pas dans la page."
            fields:
              - { label: Titre SEO (onglet du navigateur), name: meta_title, widget: string, required: true, hint: "50 à 60 caractères conseillés. Vide : le titre par défaut des Réglages SEO s'affiche." }
              - { label: Description SEO, name: meta_description, widget: text, required: true, hint: "150 à 160 caractères conseillés. Résumé affiché sous le titre dans Google." }
          - label: Blocs de la page
            name: blocs
            widget: list
            required: true
            label_singular: Bloc
            hint: Les blocs s'affichent dans cet ordre. Faites-les glisser pour les déplacer. Le formulaire de contact reste toujours en bas de page.
            collapsed: true
            typeKey: type
            # >>> BLOCS:institutionnel (généré par scripts/generer-blocs.js : ne pas modifier à la main)
            types:
              - label: Haut de page institutionnelle
                name: hero_institutionnel
                widget: object
                summary: 'Haut de page : {{fields.titre_page}}{{fields.masquer | ternary('' (masqué)'', '''')}}'
                fields:
                  - label: Masquer ce bloc (il reste enregistré)
                    name: masquer
                    widget: boolean
                    required: false
                    default: false
                    hint: Le bloc n'apparaît plus sur le site, mais son contenu est conservé.
                  - label: Fil d'Ariane
                    name: fil_ariane
                    widget: list
                    required: false
                    label_singular: Étape
                    hint: 'Petit chemin affiché tout en haut, de l''accueil à la page. La première étape renvoie vers l''accueil. Par exemple : Accueil, L''agence, Notre entreprise. Laissez vide pour ne pas l''afficher.'
                    max: 4
                    field:
                      label: Étape
                      name: etape
                      widget: string
                      required: true
                      hint: 30 caractères maximum.
                  - label: Surtitre
                    name: surtitre
                    widget: string
                    required: false
                    hint: Petit texte au-dessus du grand titre. 30 caractères maximum.
                  - label: Titre de la page (H1)
                    name: titre_page
                    widget: string
                    required: true
                    hint: Le grand titre, lu par Google et les lecteurs d'écran. 70 caractères maximum. Mettez un mot entre *astérisques* pour l'afficher en rouge.
                  - label: Chapô
                    name: chapo
                    widget: text
                    required: false
                    hint: Paragraphe d'introduction sous le titre. 45 mots maximum.
                  - label: Bouton principal
                    name: bouton_principal
                    widget: object
                    required: true
                    collapsed: false
                    summary: '{{fields.texte}} ({{fields.lien}})'
                    fields:
                      - label: Texte du bouton
                        name: texte
                        widget: string
                        required: true
                        hint: 30 caractères maximum.
                      - label: 'Destination (adresse ou #ancre)'
                        name: lien
                        widget: string
                        required: true
                        default: '#contact'
                        hint: '#contact descend au formulaire en bas de page. Une adresse commençant par https:// s''ouvre dans un nouvel onglet.'
                  - label: Bouton secondaire
                    name: bouton_secondaire
                    widget: object
                    required: false
                    collapsed: false
                    summary: '{{fields.texte}} ({{fields.lien}})'
                    hint: Laissez le texte vide pour ne pas afficher de second bouton.
                    fields:
                      - label: Texte du bouton
                        name: texte
                        widget: string
                        required: false
                        hint: 30 caractères maximum.
                      - label: 'Destination (adresse ou #ancre)'
                        name: lien
                        widget: string
                        required: false
                        default: '#contact'
                        hint: 'Une #ancre descend à la section qui la porte (par exemple #methode). Une adresse commençant par https:// s''ouvre dans un nouvel onglet.'
                  - label: Étiquettes
                    name: etiquettes
                    widget: list
                    required: false
                    label_singular: Étiquette
                    max: 4
                    hint: Petits mots-clés sous les boutons, 4 au maximum.
                    field:
                      label: Étiquette
                      name: etiquette
                      widget: string
                      required: true
                      hint: 20 caractères maximum.
                  - label: Illustration
                    name: illustration
                    widget: hidden
                    required: false
                    default: aucune
              - label: Hero (haut de page)
                name: hero
                widget: object
                summary: 'Hero : {{fields.titre_page}}{{fields.masquer | ternary('' (masqué)'', '''')}}'
                fields:
                  - label: Masquer ce bloc (il reste enregistré)
                    name: masquer
                    widget: boolean
                    required: false
                    default: false
                    hint: Le bloc n'apparaît plus sur le site, mais son contenu est conservé.
                  - label: Variante
                    name: variante
