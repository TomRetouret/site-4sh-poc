  # -----------------------------------------------------------------------
  # 7 bis) PAGES D'OFFRE EN BLOCS  (Logiciel métier, puis les autres pages d'offre)
  #    Un fichier JSON par page : src/_data/contenus/fr/<page>.json { nom, bouton_flottant, seo, blocs }
  #    Spécification : docs/back-office/schema-logiciel-metier.md
  #    Ajouter une page d'offre : copier l'entrée « logiciel_metier » ci-dessous (repères BLOCS compris),
  #    créer son gabarit sur le modèle de src/logiciel-metier.njk, puis lancer
  #    node scripts/generer-blocs.js et node scripts/assembler-config.js.
  # -----------------------------------------------------------------------
  - name: pages_offre
    label: Pages d'offre
    label_singular: Page d'offre
    description: Pages qui présentent une offre de 4SH, composées de blocs. Le formulaire de contact reste toujours en bas de page.
    files:
      - name: logiciel_metier
        label: Logiciel métier
        file: src/_data/contenus/fr/logiciel_metier.json
        format: json
        preview_path: prestations/logiciel-metier/
        fields:
          - label: Référencement
            name: seo
            widget: object
            required: true
            collapsed: true
            summary: "{{fields.meta_title}}"
            hint: Ce qui s'affiche dans les résultats de Google et l'onglet du navigateur. N'apparaît pas dans la page.
            fields:
              - { label: Titre SEO, name: meta_title, widget: string, required: true, hint: 50 à 60 caractères. Mot-clé principal en tête. Affiché dans l'onglet du navigateur et dans Google. }
              - { label: Méta-description, name: meta_description, widget: text, required: true, hint: 140 à 160 caractères. Une phrase qui donne envie de cliquer. }
          - { label: Nom de la page (fil d'Ariane), name: nom, widget: string, required: true, hint: "Nom court affiché dans le fil d'Ariane du haut de page, après « Accueil ». Par exemple : Logiciel métier." }
          - { label: Bouton flottant, name: bouton_flottant, widget: relation, required: false, collection: appels_action, value_field: "{{slug}}", display_fields: ["{{intitule}}"], search_fields: [intitule, texte], hint: "Bouton qui reste visible en bas d'écran sur mobile. Choisissez un appel à l'action partagé. Vide : pas de bouton flottant." }
          - label: Blocs de la page
            name: blocs
            widget: list
            required: true
            label_singular: Bloc
            hint: Les blocs s'affichent dans cet ordre. Faites-les glisser pour les déplacer. Le formulaire de contact reste toujours en bas de page.
            collapsed: true
            typeKey: type
            # >>> BLOCS:offre (généré par scripts/generer-blocs.js : ne pas modifier à la main)
            types:
              - label: Hero (haut de page)
                name: hero
                widget: object
                summary: 'Hero : {{fields.titre_page}}{{fields.masquer | ternary('' (masqué)'', '''')}}'
                fields:
                  - label: Masquer ce bloc (il reste enregistré)
                    name: masquer
                    widget: boolean
                    required: false
                    default: false
                    hint: Le bloc n'apparaît plus sur le site, mais son contenu est conservé.
                  - label: Variante
                    name: variante
                    widget: select
                    required: false
                    default: expressif
                    hint: 'Expressive : grande accroche sur fond sombre, pour l''accueil. Sobre : le titre de la page est le grand titre, pour les pages d''offre et les pages intérieures. Vide : expressive.'
                    options:
                      - label: Expressive (accueil)
                        value: expressif
                      - label: Sobre (pages d'offre et pages intérieures)
                        value: sobre
                  - label: Offre (surtitre coloré)
                    name: offre
                    widget: select
                    required: false
                    hint: 'Variante sobre uniquement. Affiche le surtitre de l''offre (par exemple « 4SH Build · Concevoir & développer ») et donne sa couleur à la page. Vide : pas de surtitre.'
                    options:
                      - label: 4SH Build
                        value: build
                      - label: 4SH Run
                        value: run
                      - label: 4SH Learning
                        value: learning
                      - label: 4SH institutionnel
                        value: institutionnel
                  - label: Titre de la page (H1)
                    name: titre_page
                    widget: string
                    required: true
                    hint: 'Lu par Google et les lecteurs d''écran. 60 caractères maximum. Expressive : affiché en petit au-dessus de l''accroche. Sobre : c''est le grand titre ; mettez un mot entre *astérisques* pour l''afficher en rouge.'
                  - label: Accroche
                    name: accroche
                    widget: string
                    required: false
                    hint: Variante expressive uniquement, et obligatoire dans ce cas. Mettez un mot entre *astérisques* pour l'afficher en rouge. Environ 40 caractères.
                  - label: Chapô
                    name: chapo
                    widget: text
                    required: false
                    hint: 40 mots maximum.
                  - label: Bouton principal
                    name: bouton_principal
                    widget: object
                    required: true
                    collapsed: false
                    summary: '{{fields.texte}} ({{fields.lien}})'
                    fields:
                      - label: Texte du bouton
                        name: texte
                        widget: string
                        required: true
                      - label: 'Destination (adresse ou #ancre)'
                        name: lien
                        widget: string
                        required: true
                        default: '#contact'
                  - label: Bouton secondaire
                    name: bouton_secondaire
                    widget: object
                    required: false
                    collapsed: false
                    summary: '{{fields.texte}} ({{fields.lien}})'
                    fields:
                      - label: Texte du bouton
                        name: texte
                        widget: string
                        required: false
                      - label: 'Destination (adresse ou #ancre)'
                        name: lien
                        widget: string
                        required: false
                        default: /references/
                  - label: Note sous les boutons
                    name: note
                    widget: string
                    required: false
                  - label: Étiquettes
                    name: etiquettes
                    widget: list
                    required: false
                    label_singular: Étiquette
                    max: 4
                    hint: Variante sobre uniquement. Petits mots-clés sous les boutons, 4 au maximum.
                    field:
                      label: Étiquette
                      name: etiquette
                      widget: string
                      required: true
                      hint: 30 caractères maximum.
                  - label: Encart visuel
                    name: encart
                    widget: object
                    required: false
                    collapsed: true
                    summary: '{{fields.titre}}'
                    fields:
                      - label: Afficher l'encart
                        name: afficher
                        widget: boolean
                        required: false
                        default: true
                      - label: Titre de l'encart
                        name: titre
                        widget: string
                        required: false
                      - label: Lignes
                        name: lignes
                        widget: list
                        required: false
                        label_singular: Ligne
                        collapsed: true
                        summary: '{{fields.cle}} : {{fields.valeur}}'
                        fields:
                          - label: Mot-clé
                            name: cle
                            widget: string
                            required: false
                          - label: Texte
                            name: valeur
                            widget: string
                            required: false
                      - label: Badge
                        name: badge
                        widget: string
                        required: false
                      - label: Note du badge
                        name: badge_note
                        widget: string
                        required: false
                    hint: Variante expressive uniquement.
              - label: Chiffres clés
                name: chiffres_cles
                widget: object
                summary: Chiffres clés{{fields.masquer | ternary(' (masqué)', '')}}
                fields:
                  - label: Masquer ce bloc (il reste enregistré)
                    name: masquer
                    widget: boolean
                    required: false
                    default: false
                    hint: Le bloc n'apparaît plus sur le site, mais son contenu est conservé.
                  - label: Chiffres
                    name: chiffres
                    widget: list
                    required: false
                    label_singular: Chiffre
                    collapsed: true
                    min: 2
                    max: 4
                    summary: '{{fields.valeur}} {{fields.texte}}'
                    hint: De 2 à 4 chiffres.
                    fields:
                      - label: Chiffre
                        name: valeur
                        widget: string
                        required: true
                      - label: Libellé
                        name: texte
                        widget: string
                        required: true
                      - label: Note (petit texte)
                        name: note
                        widget: string
                        required: false
              - label: Texte simple
                name: texte_simple
