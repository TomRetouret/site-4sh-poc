                    hint: 'Obligatoire sauf si l''image est décorative. Décrivez ce que montre l''image en une phrase, 120 caractères maximum. Par exemple : Deux développeurs devant un tableau blanc couvert de maquettes.'
                  - label: Image décorative (aucune information à transmettre)
                    name: decorative
                    widget: boolean
                    required: false
                    default: false
                    hint: Cochez seulement si l'image n'apporte rien au texte (ambiance, texture). Le texte alternatif est alors ignoré.
                  - label: Crédit photo
                    name: credit
                    widget: string
                    required: false
                    hint: 'Affiché en petit sous l''image. Par exemple : Photo Studio Nantes. Vide : pas de crédit.'
                  - label: Cadrage
                    name: cadrage
                    widget: select
                    required: true
                    default: centre
                    hint: Partie de l'image conservée quand elle est recadrée.
                    options:
                      - label: Centre
                        value: centre
                      - label: Haut
                        value: haut
                      - label: Bas
                        value: bas
                      - label: Gauche
                        value: gauche
                      - label: Droite
                        value: droite
              - label: Format d'affichage
                name: format
                widget: select
                required: true
                default: bandeau
                hint: 'Bandeau : image recadrée en bande panoramique (suivez le réglage Cadrage). Image entière : aucune partie coupée.'
                options:
                  - label: Bandeau panoramique
                    value: bandeau
                  - label: Image entière
                    value: entiere
              - label: Légende
                name: legende
                widget: string
                required: false
                hint: 'Phrase affichée sous l''image, 120 caractères maximum. Vide : pas de légende.'
          - label: Téléchargement d'un document
            name: telechargement
            widget: object
            summary: 'Téléchargement : {{fields.titre}}{{fields.masquer | ternary('' (masqué)'', '''')}}'
            fields:
              - label: Masquer ce bloc (il reste enregistré)
                name: masquer
                widget: boolean
                required: false
                default: false
                hint: Le bloc n'apparaît plus sur le site, mais son contenu est conservé.
              - label: Surtitre
                name: surtitre
                widget: string
                required: false
                hint: Petit texte au-dessus du titre. 30 caractères maximum.
              - label: Titre
                name: titre
                widget: string
                required: true
                hint: 'Nom du document, 60 caractères maximum. Par exemple : Plaquette 4SH Build. Mettez un mot entre *astérisques* pour l''afficher en rouge.'
              - label: Texte
                name: texte
                widget: text
                required: false
                hint: Ce que contient le document et à qui il sert, 40 mots maximum.
              - label: Document
                name: document
                widget: file
                required: true
                choose_url: true
                hint: Déposez le fichier (PDF de préférence, 10 Mo maximum) ou collez l'adresse d'un document en ligne commençant par https://. Le format (PDF, DOCX...) est affiché d'après le nom du fichier.
              - label: Texte du bouton
                name: bouton_texte
                widget: string
                required: true
                default: Télécharger le document
                hint: '30 caractères maximum, commence par un verbe. Par exemple : Télécharger la plaquette.'
              - label: Poids du fichier
                name: poids
                widget: string
                required: false
                hint: 'Par exemple : 2,4 Mo. Affiché à côté du format pour prévenir le visiteur. Vide : poids non affiché.'
          - label: Équipe ou portraits (fiches Équipe)
            name: portraits
            widget: object
            summary: 'Portraits : {{fields.titre}}{{fields.masquer | ternary('' (masqué)'', '''')}}'
            fields:
              - label: Masquer ce bloc (il reste enregistré)
                name: masquer
                widget: boolean
                required: false
                default: false
                hint: Le bloc n'apparaît plus sur le site, mais son contenu est conservé.
              - label: Surtitre
                name: surtitre
                widget: string
                required: false
                hint: Petit texte au-dessus du titre. 30 caractères maximum.
              - label: Titre
                name: titre
                widget: string
                required: true
                hint: 60 caractères maximum. Mettez un mot entre *astérisques* pour l'afficher en rouge.
              - label: Sous-titre
                name: sous_titre
                widget: text
                required: false
                hint: 40 mots maximum.
              - label: Affichage
                name: affichage
                widget: select
                required: true
                default: grille
                hint: 'Grille : photo, nom et fonction de chaque personne (4 par ligne). Portrait unique : la première personne choisie, avec sa présentation.'
                options:
                  - label: Grille de portraits
                    value: grille
                  - label: Portrait unique
                    value: unique
              - label: Personnes
                name: membres
                widget: relation
                required: true
                multiple: true
                min: 1
                max: 12
                collection: equipe
                value_field: '{{slug}}'
                display_fields:
                  - '{{nom}}, {{fonction}}'
                search_fields:
                  - nom
                  - fonction
                hint: Choisissez de 1 à 12 personnes de la collection Équipe, dans l'ordre d'affichage. Photo, nom, fonction et présentation se modifient dans la fiche de la personne.
          - label: Encart avec bouton
            name: encart_bouton
            widget: object
            summary: 'Encart : {{fields.titre}}{{fields.masquer | ternary('' (masqué)'', '''')}}'
            fields:
              - label: Masquer ce bloc (il reste enregistré)
                name: masquer
                widget: boolean
                required: false
                default: false
                hint: Le bloc n'apparaît plus sur le site, mais son contenu est conservé.
              - label: Coller au bloc précédent
                name: sans_marge_haute
                widget: boolean
                required: false
                default: false
                hint: Supprime l'espace au-dessus du bloc. À cocher quand le bloc précédent a le même fond blanc.
              - label: Présentation
                name: presentation
                widget: select
                required: true
                default: encadre
                hint: 'Encadré : centré sur fond crème, bouton plein (recrutement). Libre : aligné à gauche, sans fond, bouton contour (document à consulter).'
                options:
                  - label: Encadré centré
                    value: encadre
                  - label: Libre, aligné à gauche
                    value: libre
              - label: Titre
                name: titre
                widget: string
                required: true
                hint: 60 caractères maximum.
              - label: Texte
                name: texte
                widget: text
                required: false
                hint: 40 mots maximum.
              - label: Bouton
                name: bouton
                widget: object
                required: true
                collapsed: false
                summary: '{{fields.texte}} ({{fields.lien}})'
                fields:
                  - label: Texte du bouton
                    name: texte
                    widget: string
                    required: true
                    hint: 40 caractères maximum.
                  - label: 'Destination (adresse ou #ancre)'
                    name: lien
                    widget: string
                    required: true
                    default: '#contact'
                    hint: Une adresse commençant par https:// s'ouvre dans un nouvel onglet.
