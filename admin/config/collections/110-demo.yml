            fields:
              - label: Masquer ce bloc (il reste enregistré)
                name: masquer
                widget: boolean
                required: false
                default: false
                hint: Le bloc n'apparaît plus sur le site, mais son contenu est conservé.
              - label: Surtitre
                name: surtitre
                widget: string
                required: false
              - label: Titre
                name: titre
                widget: string
                required: true
                hint: Mettez un mot entre *astérisques* pour l'afficher en rouge.
              - label: Sous-titre
                name: sous_titre
                widget: text
                required: false
              - label: Cartes
                name: cartes
                widget: list
                required: false
                label_singular: Carte
                collapsed: true
                summary: '{{fields.titre}}'
                fields:
                  - label: Titre
                    name: titre
                    widget: string
                    required: true
                  - label: Texte
                    name: texte
                    widget: text
                    required: false
                  - label: Lien de la carte
                    name: lien
                    widget: object
                    required: false
                    collapsed: false
                    summary: '{{fields.texte}} ({{fields.lien}})'
                    fields:
                      - label: Texte du bouton
                        name: texte
                        widget: string
                        required: false
                      - label: 'Destination (adresse ou #ancre)'
                        name: lien
                        widget: string
                        required: false
          - label: Méthode 4D
            name: methode_4d
            widget: object
            summary: 'Méthode 4D : {{fields.titre}}{{fields.masquer | ternary('' (masqué)'', '''')}}'
            fields:
              - label: Masquer ce bloc (il reste enregistré)
