  # -----------------------------------------------------------------------
  # 7 bis) PAGES D'OFFRE EN BLOCS  (Logiciel métier, puis les autres pages d'offre)
  #    Un fichier JSON par page : src/_data/contenus/fr/<page>.json { nom, bouton_flottant, seo, blocs }
  #    Spécification : docs/back-office/schema-logiciel-metier.md
  #    Ajouter une page d'offre : copier l'entrée « logiciel_metier » ci-dessous (repères BLOCS compris),
