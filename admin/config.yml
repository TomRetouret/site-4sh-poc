# FICHIER GÉNÉRÉ par scripts/assembler-config.js à partir de admin/config/ : ne pas modifier à la main.
# =========================================================================
#  Configuration du CMS git (Sveltia CMS, successeur de Decap CMS)
#  Preuve de concept back-office (branche poc/back-office) :
#  circuit éditorial activé. Chaque enregistrement crée une demande de fusion
#  (pull request) sur GitHub ; la mise en ligne a lieu à la publication.
# =========================================================================

# --- Où le CMS écrit-il ? ---
backend:
  name: github
  repo: TomRetouret/site-4sh-poc # dépôt de test temporaire (compte personnel de Tom), à transférer vers 4SH ensuite
  branch: main
  # Authentification "Se connecter avec GitHub" via le Worker Cloudflare sveltia-cms-auth.
  # Le domaine du site de test doit figurer dans la variable ALLOWED_DOMAINS du Worker.
  base_url: https://sveltia-cms-auth.tom-retouret.workers.dev
  # Les liens d'aperçu sont lus dans les statuts envoyés par Netlify (deploy preview).
  # Si plusieurs services publient des statuts, nommer le bon ici :
  # preview_context: netlify/site-4sh-poc/deploy-preview

# Note : sur localhost, Sveltia propose automatiquement l'édition locale (dossier du projet),
# sans circuit éditorial.

# --- Circuit éditorial ---
# Brouillon, En relecture, Prêt : chaque contenu modifié vit dans sa propre pull request
# jusqu'à la publication (fusion dans main). Un brouillon peut être enregistré même si des
# champs obligatoires sont vides ; ils sont exigés pour passer en relecture ou publier.
publish_mode:
  type: editorial_workflow
  allow_incomplete_drafts: true

# Liens « Voir l'aperçu » vers le déploiement de prévisualisation de chaque pull request.
show_preview_links: true

# --- Multilingue (utilisé par la page d'accueil en blocs et les témoignages) ---
# Les autres collections ne sont pas concernées (elles n'activent pas i18n).
i18n:
  structure: multiple_folders
  locales: [fr, en]
  default_locale: fr
  initial_locales: default
  omit_default_locale_from_preview_path: true

# Langue de l'interface
locale: fr

# URL du site déployé : sert aux liens "Voir sur le site" (preview_path) et à l'en-tête de l'admin.
site_url: https://eclectic-conkies-63f114.netlify.app # site Netlify du dépôt de test
display_url: https://eclectic-conkies-63f114.netlify.app # site Netlify du dépôt de test

# Dossier des images uploadées par les rédacteurs
media_folder: "src/uploads"
public_folder: "/uploads"

# Optimisation des images dès le dépôt (Sveltia CMS, option media_libraries,
# voir docs/back-office/images.md). Les photos JPEG, PNG et HEIC sont converties
# en WebP (qualité 85) et réduites à 2400 px de large au plus (jamais agrandies).
# Les GIF (animés) et les SVG ne sont pas touchés. Fichier refusé au-delà de 10 Mo.
# Le site génère ensuite lui-même les variantes AVIF, WebP et les largeurs utiles.
media_libraries:
  default:
    config:
      max_file_size: 10485760
      transformations:
        jpeg: { format: webp, quality: 85, width: 2400, height: 2400 }
        png: { format: webp, quality: 85, width: 2400, height: 2400 }
        heic: { format: webp, quality: 85, width: 2400, height: 2400 }

collections:
  # -----------------------------------------------------------------------
  # 1) FORMATIONS  (une fiche = un niveau = un fichier ; on peut en ajouter / supprimer)
  #    Gabarit fixe (src/_includes/formation.njk) alimenté par la fiche.
  #    Champs regroupés dans l'ordre de la page : En-tête, Inscription, Chiffres clés,
  #    Description, Public visé et prérequis, Objectifs, Programme, Formateur,
  #    Questions fréquentes, puis Référencement. Schéma : docs/back-office/schema-formations.md
  #    Champs « obligatoires » : exigés pour passer en relecture ou publier ; un brouillon
  #    incomplet reste enregistrable (allow_incomplete_drafts).
  # -----------------------------------------------------------------------
  - name: "formations"
    label: "Formations"
    label_singular: "Formation"
    folder: "src/content/formations"
    preview_path: "formations/{{slug}}/"
    create: true
    identifier_field: "entete.titre"
    slug: "{{entete.titre}}-{{entete.niveau}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{entete.titre}} - {{entete.niveau}} ({{entete.categorie}})"
    sortable_fields: ["entete.titre", "entete.categorie", "entete.groupe"]
    fields:
      # --- En-tête -----------------------------------------------------------
      - label: "En-tête"
        name: "entete"
        widget: "object"
        required: true
        collapsed: false
        summary: "{{fields.titre}} {{fields.sous_titre}}"
        hint: "Haut de la page : fil d'Ariane, surtitre, grand titre « Formation <nom> <complément> » et accroche."
        fields:
          - { label: "Nom de la formation", name: "titre", widget: "string", required: true, hint: "Technologie ou sujet, sans le mot « Formation » (ajouté automatiquement). 40 caractères maximum. Ex. : Angular" }
          - { label: "Complément du titre (en rouge)", name: "sous_titre", widget: "string", required: false, hint: "Affiché en rouge après le nom, sans tiret ni ponctuation au début. 20 caractères maximum. Ex. : Les fondamentaux" }
          - { label: "Niveau", name: "niveau", widget: "select", options: ["Essentiel", "Fondamental", "Intermédiaire", "Avancé"], required: true, hint: "Sert au tri des niveaux au catalogue, au sélecteur de niveau et à la fenêtre de pré-inscription." }
          - { label: "Famille (relie les niveaux d'une même formation)", name: "groupe", widget: "string", required: false, pattern: ["^[a-z0-9-]*$", "Minuscules, chiffres et tirets seulement, sans espace."], hint: "Identifiant identique pour tous les niveaux d'une même techno, en minuscules sans espace. Ex. : angular. Vide : la fiche forme sa propre famille." }
          - label: "Catégorie"
            name: "categorie"
            widget: "relation"
            required: true
            collection: "categories"
            value_field: "nom"
            search_fields: ["nom"]
            display_fields: ["nom"]
            hint: "Choisir dans la liste (Develop, Design, DevOps, Outils, IA). Affichée dans le fil d'Ariane, le surtitre et « Autres formations »."
          - { label: "Accroche", name: "chapo", widget: "text", required: true, hint: "Une phrase sous le titre, 40 mots maximum. Sert aussi de description Google par défaut et de texte de la carte au catalogue." }
          - { label: "Logo ou illustration", name: "image", widget: "image", required: false, choose_url: true, hint: "SVG de préférence, carré, fond transparent. Un lien vers une image déjà en ligne est accepté." }

      # --- Inscription (carte de droite) ---------------------------------------
      - label: "Inscription"
        name: "inscription"
        widget: "object"
        required: true
        collapsed: false
        summary: "{{fields.prix}} € HT"
        hint: "Carte d'inscription à droite de la page : prix, prochaines sessions et programme à télécharger."
        fields:
          - { label: "Prix par participant (€ HT)", name: "prix", widget: "number", value_type: "int", min: 0, required: true, hint: "Nombre entier en euros hors taxes, sans symbole ni espace. Ex. : 1500. Affiché « 1500 € HT »." }
          - { label: "Afficher « À partir de » devant le prix", name: "prix_a_partir", widget: "boolean", required: false, default: false, hint: "À cocher seulement si le prix varie selon la durée ou le format. Affiché « À partir de 700 € HT »." }
          - label: "Prochaines sessions"
            name: "sessions"
            widget: "list"
            required: false
            label_singular: "Session"
            collapsed: true
            summary: "{{fields.debut}} au {{fields.fin}}"
            hint: "Une ligne par session. Une session d'un jour : même date de début et de fin. Les sessions déjà commencées sont masquées automatiquement à la mise en ligne."
            fields:
              - { label: "Date de début", name: "debut", widget: "datetime", type: "date", required: true, hint: "Premier jour de la session." }
              - { label: "Date de fin", name: "fin", widget: "datetime", type: "date", required: true, hint: "Dernier jour. Même date que le début pour une session d'un jour." }
          - { label: "Programme détaillé (PDF)", name: "programme_pdf", widget: "string", required: true, hint: "Lien de partage public vers le PDF du programme (Google Drive par exemple), commençant par https://. Attendu par Qualiopi." }
          - { label: "Poids du PDF", name: "programme_pdf_poids", widget: "string", required: false, hint: "Affiché à côté du lien. Ex. : 724 Ko" }

      # --- Chiffres clés ---------------------------------------------------------
      - label: "Chiffres clés"
        name: "chiffres"
        widget: "object"
        required: true
        collapsed: false
        hint: "Bandeau sous le titre : durée, participants, note des stagiaires, ancienneté, répartition théorie et pratique."
        fields:
          - { label: "Durée en jours", name: "duree_jours", widget: "number", value_type: "float", min: 0.5, step: 0.5, required: false, hint: "Ex. : 3 ou 1,5 ; 0,5 pour une demi-journée. Affiché « 3 jours (21h00) » avec la durée en heures." }
          - { label: "Durée en heures", name: "duree_heures", widget: "number", value_type: "float", min: 0, step: 0.5, required: false, hint: "Ex. : 21 ; 3,5 pour 3h30." }
          - { label: "Durée, saisie libre (cas particulier)", name: "duree_texte", widget: "string", required: false, hint: "Seulement si la durée ne tient pas en deux nombres. Remplace jours et heures. La partie avant la parenthèse s'affiche en gras. Ex. : 1 à 5 jours (7h00 à 35h00)" }
          - { label: "Participants minimum", name: "participants_min", widget: "number", value_type: "int", min: 1, default: 1, required: false, hint: "Nombre entier. Ex. : 1" }
          - { label: "Participants maximum", name: "participants_max", widget: "number", value_type: "int", min: 1, required: true, hint: "Nombre entier. Ex. : 8. Affiché « 1 à 8 personnes »." }
          - { label: "Note moyenne des stagiaires (sur 5)", name: "note", widget: "number", value_type: "float", min: 0, max: 5, step: 0.01, required: false, hint: "Nombre décimal entre 0 et 5. Ex. : 4,7. Affiché « 4,7 / 5 ». Vide : la note n'est pas affichée." }
          - { label: "Nombre d'avis", name: "avis", widget: "number", value_type: "int", min: 0, required: false, hint: "Nombre entier. Ex. : 12" }
          - { label: "Proposée depuis", name: "depuis", widget: "string", required: false, hint: "Mois et année. Ex. : janvier 2023" }
          - { label: "Part de théorie (%)", name: "theorie", widget: "number", value_type: "int", min: 0, max: 100, required: false, hint: "Nombre entre 0 et 100. Ex. : 60. La part de pratique est calculée (100 moins la théorie)." }

      # --- Description (corps de la fiche) -------------------------------------
      - { label: "Description", name: "body", widget: "markdown", required: true, hint: "Paragraphes de présentation, en haut de la section Description. 150 à 300 mots. Intertitres de niveau 3 au plus." }

      # --- Public visé et prérequis ---------------------------------------------
      - label: "Public visé et prérequis"
        name: "public"
        widget: "object"
        required: true
        collapsed: false
        hint: "Suite de la section Description. Informations attendues par Qualiopi."
        fields:
          - { label: "Public visé", name: "pour_qui", widget: "text", required: true, hint: "À qui s'adresse la formation, 50 mots maximum. Mettez un mot entre *astérisques* pour l'afficher en rouge." }
          - label: "Prérequis"
            name: "prerequis"
            widget: "list"
            required: true
            min: 1
            label_singular: "Prérequis"
            hint: "Une ligne par prérequis, 150 caractères maximum. Écrire « Aucun » s'il n'y en a pas."
            field: { label: "Prérequis", name: "item", widget: "string", required: true }

      # --- Objectifs ---------------------------------------------------------------
      - label: "Objectifs pédagogiques"
        name: "objectifs"
        widget: "list"
        required: true
        min: 1
        label_singular: "Objectif"
        hint: "3 à 6 objectifs, chacun commence par un verbe. 120 caractères maximum. Attendus par Qualiopi."
        field: { label: "Objectif", name: "item", widget: "string", required: true }

      # --- Programme -----------------------------------------------------------------
      - label: "Programme"
        name: "programme"
        widget: "list"
        required: true
        min: 1
        label_singular: "Chapitre"
        collapsed: true
        summary: "{{fields.titre}}"
        hint: "Un chapitre par demi-journée environ, affiché en accordéon (le premier est ouvert). Attendu par Qualiopi."
        fields:
          - { label: "Titre du chapitre", name: "titre", widget: "string", required: true, hint: "60 caractères maximum. Ex. : Architecture d'Angular" }
          - label: "Points abordés"
            name: "points"
            widget: "list"
            required: true
            min: 1
            label_singular: "Point"
            hint: "Une ligne par point, 120 caractères maximum."
            field: { label: "Point abordé", name: "point", widget: "string", required: true }

      # --- Formateur -------------------------------------------------------------------
      - label: "Formateur"
        name: "formateur"
        widget: "object"
        required: false
        collapsed: true
        summary: "{{fields.personne}}"
        hint: "Le nom, la photo, la fonction et la présentation viennent de la fiche Équipe choisie. Vide : la section Formateur n'est pas affichée."
        fields:
          - label: "Personne"
            name: "personne"
            widget: "relation"
            required: false
            collection: "equipe"
            value_field: "{{slug}}"
            search_fields: ["nom", "fonction"]
            display_fields: ["{{nom}}, {{fonction}}"]
            hint: "Choisir dans la collection Équipe. Pour ajouter une personne, passez par cette collection."
          - { label: "Fonction propre à cette formation", name: "fonction", widget: "string", required: false, hint: "Facultatif. Remplace la fonction de la fiche Équipe sur cette page seulement. 40 caractères maximum." }
          - { label: "Présentation propre à cette formation", name: "presentation", widget: "text", required: false, hint: "Facultatif. Remplace la présentation de la fiche Équipe sur cette page seulement. Séparez les paragraphes par une ligne vide. 80 mots maximum." }

      # --- Questions fréquentes --------------------------------------------------------
      - label: "Questions fréquentes"
        name: "faq"
        widget: "list"
        required: false
        label_singular: "Question"
        summary: "{{fields.question}}"
        collapsed: true
        hint: "3 à 6 questions, affichées en accordéon (la première est ouverte)."
        fields:
          - { label: "Question", name: "question", widget: "string", required: true, hint: "100 caractères maximum." }
          - { label: "Réponse", name: "reponse", widget: "text", required: true, hint: "80 mots maximum." }

      # --- Référencement (séparé du contenu de la page) ----------------------------------
      - label: "Référencement"
        name: "referencement"
        widget: "object"
        required: false
        collapsed: true
        summary: "{{fields.meta_title}}"
        hint: "Ce qui s'affiche dans les résultats de Google et l'onglet du navigateur. Rien n'apparaît sur la page."
        fields:
          - { label: "Titre SEO (onglet du navigateur)", name: "meta_title", widget: "string", required: false, hint: "50 à 60 caractères. Vide : « Formation <nom> - 4SH »." }
          - { label: "Description SEO", name: "meta_description", widget: "text", required: false, hint: "140 à 160 caractères. Vide : l'accroche est reprise." }
          - { label: "Afficher cette page dans les moteurs de recherche", name: "indexation", widget: "boolean", required: false, default: true, hint: "Laisser coché en temps normal. Décocher retire la page de Google et du plan du site." }

  # -----------------------------------------------------------------------
  # 1 bis) ÉQUIPE  (contenu partagé : une personne = un fichier JSON)
  #    src/_data/equipe/<slug>.json, lu par le site comme donnée globale « equipe ».
  #    Reliée depuis les fiches formation (champ Formateur). Une fiche reliée ne peut
  #    pas être supprimée tant qu'une formation l'utilise.
  # -----------------------------------------------------------------------
  - name: "equipe"
    label: "Équipe"
    label_singular: "Membre de l'équipe"
    folder: "src/_data/equipe"
    extension: "json"
    format: "json"
    create: true
    identifier_field: "nom"
    slug: "{{nom}}"
    summary: "{{nom}}, {{fonction}}"
    sortable_fields: ["nom"]
    fields:
      - { label: "Prénom et nom", name: "nom", widget: "string", required: true, hint: "Tel qu'affiché sur le site. Ex. : Damien Martin" }
      - { label: "Fonction", name: "fonction", widget: "string", required: false, hint: "40 caractères maximum. Ex. : Développeur et formateur depuis 2013" }
      - { label: "Photo", name: "photo", widget: "image", required: false, choose_url: true, hint: "Portrait carré, 600 x 600 px minimum." }
      - { label: "Texte alternatif de la photo", name: "photo_alt", widget: "string", required: false, hint: "Décrit la photo pour les lecteurs d'écran, 120 caractères maximum. Ex. : Damien Martin souriant, en chemise bleue. Sur les fiches formation, le texte « <nom>, formateur <formation> chez 4SH » est utilisé." }
      - { label: "Courte présentation", name: "presentation", widget: "text", required: false, hint: "Parcours et expertise, 80 mots maximum. Séparez les paragraphes par une ligne vide. Une formation peut afficher sa propre présentation (champ « Présentation propre à cette formation »)." }

  # -----------------------------------------------------------------------
  # 2) RÉFÉRENCES  (études de cas clients, une fiche = un fichier)
  # Gabarit fixe : src/_includes/reference.njk. Champs groupés dans l'ordre de la
  # page (préfixe du libellé = groupe). Spécification : docs/back-office/schema-references.md
  # Les champs titre, client, resume, logo, image, ordre et h1 sont aussi lus par
  # les cartes de références des autres pages : ne pas les renommer.
  # -----------------------------------------------------------------------
  - name: "references"
    label: "Références"
    label_singular: "Référence"
    folder: "src/content/references"
    preview_path: "references/{{slug}}/"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{titre}}"
    sortable_fields: ["ordre", "titre", "client"]
    fields:
      # --- En-tête ---
      - { label: "En-tête · Nom du projet", name: "titre", widget: "string", required: true, maxlength: 50, hint: "Client et produit, 50 caractères maximum. Ex. : Izivia - App Mobile. Affiché dans le fil d'Ariane, sur les cartes et dans la navigation entre projets." }
      - { label: "En-tête · Titre de la fiche (grand titre)", name: "h1", widget: "string", required: true, maxlength: 60, hint: "60 caractères maximum. Ex. : L'application mobile. Mettez un mot entre *astérisques* pour l'afficher en rouge." }
      - { label: "En-tête · Sous-titre", name: "sous_titre", widget: "text", required: true, hint: "Une ou deux phrases sous le grand titre, 40 mots maximum. Sert aussi de description pour Google si celle du Référencement est vide." }
      - { label: "En-tête · Client", name: "client", widget: "string", required: true, hint: "Nom de l'entreprise tel qu'elle l'écrit. Ex. : Bordeaux Métropole." }
      - { label: "En-tête · Logo du client", name: "logo", widget: "image", required: true, choose_url: true, hint: "SVG ou PNG sur fond transparent, 400 px de large minimum. Le texte alternatif est le nom du client (automatique)." }
      - label: "En-tête · Chiffres clés"
        name: "stats"
        widget: "list"
        required: false
        max: 4
        hint: "Facultatif. 2 à 4 chiffres déjà cités dans l'étude de cas, affichés sous le sous-titre."
        summary: "{{chiffre}} {{label}}"
        fields:
          - { label: "Chiffre", name: "chiffre", widget: "string", required: true, maxlength: 10, hint: "10 caractères maximum. Ex. : 9 000" }
          - { label: "Libellé", name: "label", widget: "string", required: true, maxlength: 40, hint: "40 caractères maximum. Ex. : bornes de recharge" }

      # --- Téléchargement ---
      - { label: "Téléchargement · Fiche projet (PDF)", name: "fiche_pdf", widget: "string", required: false, hint: "Lien de partage public du PDF (Google Drive...). Le bouton « Télécharger la fiche » s'affiche dans l'en-tête et dans la colonne de droite." }
      - { label: "Téléchargement · Date de mise à jour", name: "maj", widget: "datetime", required: false, time_format: false, date_format: "DD/MM/YYYY", format: "YYYY-MM-DD", picker_utc: true, hint: "Date de la dernière mise à jour de la fiche, affichée « Dernière mise à jour : JJ/MM/AAAA »." }
      - { label: "Téléchargement · Date (ancienne saisie à reprendre)", name: "maj_repli", widget: "string", required: false, hint: "Rempli seulement si une ancienne date n'a pas pu être convertie. Saisissez la date ci-dessus puis videz ce champ." }

      # --- Étude de cas ---
      - label: "Étude de cas"
        name: "etude"
        widget: "object"
        required: true
        hint: "Quatre rubriques fixes, affichées dans cet ordre avec leur intertitre. Une rubrique vide n'est pas affichée."
        fields:
          - { label: "1. Entreprise et activité", name: "entreprise", widget: "markdown", required: true, buttons: ["bold", "italic", "link", "bulleted-list", "numbered-list"], editor_components: [], hint: "Qui est le client, son métier, sa taille. 100 à 250 mots." }
          - { label: "2. Nos missions", name: "missions", widget: "markdown", required: false, buttons: ["bold", "italic", "link", "bulleted-list", "numbered-list"], editor_components: [], hint: "Ce que 4SH a fait pour le client, de préférence en liste. 100 à 250 mots." }
          - label: "3. Enjeux et objectifs"
            name: "enjeux_objectifs"
            widget: "object"
            required: false
            fields:
              - { label: "Phrase d'introduction", name: "intro", widget: "text", required: false, hint: "Facultatif. Une phrase avant les enjeux. Ex. : Refonte du système de gestion de fret." }
              - { label: "Les enjeux", name: "enjeux", widget: "markdown", required: false, buttons: ["bold", "italic", "link", "bulleted-list"], editor_components: [], hint: "Liste à puces des enjeux du client." }
              - { label: "Les objectifs", name: "objectifs", widget: "markdown", required: false, buttons: ["bold", "italic", "link", "bulleted-list"], editor_components: [], hint: "Liste à puces des objectifs, éventuellement suivie d'une phrase de conclusion." }
          - label: "4. Points clés"
            name: "points_cles"
            widget: "object"
            required: false
            fields:
              - label: "Intertitre"
                name: "intertitre"
                widget: "select"
                required: false
                default: "Les points clés de l'application"
                options: ["Les points clés de l'application", "Les points clés de l'application mobile", "Les points clés de la solution", "Les points clés de kubernetes", "Les points clés"]
                hint: "Choisissez ce que décrivent les points clés."
              - { label: "Points clés de la solution", name: "texte", widget: "markdown", required: false, buttons: ["bold", "italic", "link", "heading-three", "bulleted-list"], editor_components: [], hint: "Liste à puces. Des sous-titres (Titre 3) sont possibles, par exemple « Côté utilisateur » et « Côté entreprise »." }
              - { label: "Les points clés du projet", name: "projet", widget: "markdown", required: false, buttons: ["bold", "italic", "link", "bulleted-list"], editor_components: [], hint: "Facultatif. Liste à puces sur la conduite du projet (équipe, méthode, durée)." }
          - { label: "Compléments", name: "complements", widget: "markdown", required: false, maxlength: 2500, buttons: ["bold", "italic", "link", "heading-two", "heading-three", "bulleted-list"], editor_components: [], hint: "À n'utiliser que si le contenu ne rentre pas dans les 4 rubriques. Affiché après les points clés. Chaque partie commence par un Titre 2. 2 500 caractères maximum." }

      # --- Identité du projet ---
      - { label: "Identité du projet · Secteurs", name: "secteurs", widget: "relation", required: true, multiple: true, min: 1, max: 3, collection: "listes", file: "listes", value_field: "secteurs.*.nom", search_fields: ["secteurs.*.nom"], display_fields: ["secteurs.*.nom"], hint: "1 à 3. Le premier s'affiche dans le surtitre de la fiche et sur la carte. Pour ajouter un secteur, modifiez « Listes de référence »." }
      - { label: "Identité du projet · Technologies", name: "technologies", widget: "relation", required: false, multiple: true, collection: "listes", file: "listes", value_field: "technologies.*.nom", search_fields: ["technologies.*.nom"], display_fields: ["technologies.*.nom"], hint: "Les 4 premières s'affichent sur la carte. Pour ajouter une technologie, modifiez « Listes de référence »." }
      - { label: "Identité du projet · Expertises", name: "expertises", widget: "relation", required: false, multiple: true, collection: "listes", file: "listes", value_field: "expertises.*.nom", search_fields: ["expertises.*.nom"], display_fields: ["expertises.*.nom"], hint: "Offres et étapes de la méthode mobilisées. Pour ajouter une expertise, modifiez « Listes de référence »." }

      # --- Visuels ---
      - { label: "Visuels · Visuel principal", name: "image", widget: "image", required: true, choose_url: true, hint: "Paysage 4:3, 1200 x 900 px minimum. Affiché dans l'en-tête de la fiche et sur la carte." }
      - { label: "Visuels · Texte alternatif du visuel principal", name: "image_alt", widget: "string", required: false, maxlength: 120, hint: "Obligatoire sauf image décorative : décrivez ce que montre l'image, 120 caractères maximum. Ex. : Écran d'accueil de l'application Izivia sur smartphone." }
      - { label: "Visuels · Visuel principal décoratif", name: "image_decorative", widget: "boolean", required: false, default: false, hint: "Cochez seulement si l'image n'apporte aucune information (le texte alternatif est alors ignoré)." }
      - label: "Visuels · Galerie"
        name: "galerie"
        widget: "list"
        required: false
        hint: "3 à 6 images de même format, 1600 px de large."
        summary: "{{alt}}"
        fields:
          - { label: "Image", name: "image", widget: "image", required: true, choose_url: true }
          - { label: "Texte alternatif", name: "alt", widget: "string", required: false, maxlength: 120, hint: "Obligatoire sauf image décorative : ce que montre l'écran, 120 caractères maximum." }
          - { label: "Image décorative", name: "decorative", widget: "boolean", required: false, default: false, hint: "Cochez seulement si l'image n'apporte aucune information." }

      # --- Carte de liste ---
      - { label: "Carte de liste · Résumé", name: "resume", widget: "text", required: true, maxlength: 160, hint: "160 caractères maximum. Affiché sur la carte de la page Nos réussites (et sur la fiche si le sous-titre est vide)." }
      - { label: "Carte de liste · Position", name: "ordre", widget: "number", required: false, value_type: "int", min: 1, hint: "Nombre entier : le plus petit s'affiche en premier. Sert aussi à la navigation entre projets." }

      # --- Référencement ---
      - label: "Référencement"
        name: "referencement"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Titre SEO", name: "meta_title", widget: "string", required: false, maxlength: 90, hint: "50 à 60 caractères. Vide : « Nom du projet - Référence 4SH »." }
          - { label: "Description SEO", name: "meta_description", widget: "text", required: false, maxlength: 170, hint: "140 à 160 caractères. Vide : le sous-titre est utilisé." }
          - { label: "Afficher dans les moteurs de recherche", name: "indexation", widget: "boolean", required: false, default: true, hint: "Laisser coché en temps normal. Décocher masque la fiche dans Google." }

  # -----------------------------------------------------------------------
  # 2 bis) LISTES DE RÉFÉRENCE  (valeurs proposées dans les fiches références)
  # Fichier : src/_data/listes.json. Les fiches choisissent dans ces listes
