# Bloc « faq » : Questions fréquentes
# Composant du site : src/_includes/composants/blocs/faq.njk
# Mode d'emploi : docs/back-office/schema-blocs.md (« Ajouter un bloc »).
# Après modification : node scripts/generer-blocs.js puis node scripts/assembler-config.js

# Profils où le bloc est proposé, avec son rang dans le menu « Ajouter un bloc » (10, 20, 30...).
profils:
  accueil: 90
  demo: 90
  offre: 130

# Définition du type de bloc pour le CMS (sans i18n : le générateur l'ajoute pour l'accueil).
type:
  label: Questions fréquentes
  name: faq
  widget: object
  summary: 'Questions fréquentes : {{fields.titre}}{{fields.masquer | ternary('' (masqué)'', '''')}}'
  fields:
    - label: Masquer ce bloc (il reste enregistré)
      name: masquer
      widget: boolean
      required: false
      default: false
      hint: Le bloc n'apparaît plus sur le site, mais son contenu est conservé.
    - label: Titre
      name: titre
      widget: string
      required: true
      hint: 60 caractères maximum. Mettez un mot entre *astérisques* pour l'afficher en rouge.
    - label: Sous-titre
      name: sous_titre
      widget: text
      required: false
    - label: Questions
      name: questions
      widget: list
      required: false
      label_singular: Question
      collapsed: true
      summary: '{{fields.question}}'
      fields:
        - label: Question
          name: question
          widget: string
          required: true
        - label: Réponse
          name: reponse
          widget: text
          required: true
