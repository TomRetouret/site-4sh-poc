# =========================================================================
#  Configuration du CMS git (Sveltia CMS, successeur de Decap CMS)
#  Preuve de concept back-office (branche poc/back-office) :
#  circuit éditorial activé. Chaque enregistrement crée une demande de fusion
#  (pull request) sur GitHub ; la mise en ligne a lieu à la publication.
# =========================================================================

# --- Où le CMS écrit-il ? ---
backend:
  name: github
  repo: TomRetouret/site-4sh-poc # à remplacer par le dépôt de test 4SH
  branch: main
  # Authentification "Se connecter avec GitHub" via le Worker Cloudflare sveltia-cms-auth.
  # Le domaine du site de test doit figurer dans la variable ALLOWED_DOMAINS du Worker.
  base_url: https://sveltia-cms-auth.tom-retouret.workers.dev
  # Les liens d'aperçu sont lus dans les statuts envoyés par Netlify (deploy preview).
  # Si plusieurs services publient des statuts, nommer le bon ici :
  # preview_context: netlify/site-4sh-poc/deploy-preview

# Note : sur localhost, Sveltia propose automatiquement l'édition locale (dossier du projet),
# sans circuit éditorial.

# --- Circuit éditorial ---
# Brouillon, En relecture, Prêt : chaque contenu modifié vit dans sa propre pull request
# jusqu'à la publication (fusion dans main). Un brouillon peut être enregistré même si des
# champs obligatoires sont vides ; ils sont exigés pour passer en relecture ou publier.
publish_mode:
  type: editorial_workflow
  allow_incomplete_drafts: true

# Liens « Voir l'aperçu » vers le déploiement de prévisualisation de chaque pull request.
show_preview_links: true

# --- Multilingue (utilisé par la page d'accueil en blocs et les témoignages) ---
# Les autres collections ne sont pas concernées (elles n'activent pas i18n).
i18n:
  structure: multiple_folders
  locales: [fr, en]
  default_locale: fr
  initial_locales: default
  omit_default_locale_from_preview_path: true

# Langue de l'interface
locale: fr

# URL du site déployé : sert aux liens "Voir sur le site" (preview_path) et à l'en-tête de l'admin.
site_url: https://site-4sh-poc.netlify.app # à remplacer par l'adresse du site Netlify de test
display_url: https://site-4sh-poc.netlify.app # à remplacer par l'adresse du site Netlify de test

# Dossier des images uploadées par les rédacteurs
media_folder: "src/uploads"
public_folder: "/uploads"

collections:
  # -----------------------------------------------------------------------
  # 1) FORMATIONS  (une fiche = un fichier ; on peut en ajouter / supprimer)
  # -----------------------------------------------------------------------
  - name: "formations"
    label: "Formations"
    label_singular: "Formation"
    folder: "src/content/formations"
    preview_path: "formations/{{slug}}/"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{titre}} - {{niveau}} ({{categorie}})"
    sortable_fields: ["titre", "categorie", "groupe"]
    fields:
      - { label: "Nom (techno)", name: "titre", widget: "string", hint: "Ex. : Angular", required: true }
      - { label: "Groupe (relie les niveaux d'une même techno)", name: "groupe", widget: "string", hint: "Identifiant commun à tous les niveaux, ex. : angular. Sert au regroupement au catalogue et au sélecteur de niveau.", required: false }
      - { label: "Sous-titre", name: "sous_titre", widget: "string", required: false, hint: "Ex. : - Les fondamentaux" }
      - label: "Catégorie"
        name: "categorie"
        widget: "relation"
        collection: "categories"
        value_field: "nom"
        search_fields: ["nom"]
        display_fields: ["nom"]
        hint: "Reliée aux pages catégories existantes (Develop, Design, DevOps, Outils)."
      - { label: "Niveau", name: "niveau", widget: "select", options: ["Essentiel", "Fondamental", "Intermédiaire", "Avancé"], required: false }
      - { label: "Accroche (phrase d'intro)", name: "chapo", widget: "text", required: false }
      - { label: "Titre SEO (onglet du navigateur)", name: "meta_title", widget: "string", required: false }
      - { label: "Description SEO", name: "meta_description", widget: "text", required: false }
      - { label: "Cacher cette page de Google (à laisser décoché en temps normal)", name: "noindex", widget: "boolean", required: false, default: false }
      - { label: "Programme de la formation (PDF)", name: "programme_pdf", widget: "string", required: false, hint: "Lien vers le PDF du programme." }
      - { label: "Poids du PDF du programme", name: "programme_pdf_poids", widget: "string", required: false, hint: "Ex. : 724 Ko" }
      - { label: "Prix", name: "prix", widget: "string", hint: "Ex. : 2200 € HT", required: false }
      - { label: "Durée", name: "duree", widget: "string", required: false, hint: "Ex. : 4 jours (28h00)" }
      - { label: "Nombre de participants", name: "participants", widget: "string", required: false, hint: "Ex. : 1 à 8" }
      - { label: "Note", name: "note", widget: "string", required: false, hint: "Ex. : 4,89 / 5" }
      - { label: "Nombre d'avis", name: "avis", widget: "number", required: false, value_type: "int" }
      - { label: "Proposée depuis", name: "depuis", widget: "string", required: false, hint: "Ex. : janvier 2023" }
      - { label: "Part de théorie (%)", name: "theorie", widget: "number", required: false, value_type: "int", min: 0, max: 100 }
      - { label: "Part de pratique (%)", name: "pratique", widget: "number", required: false, value_type: "int", min: 0, max: 100 }
      - { label: "Illustration / logo (URL ou image)", name: "image", widget: "image", required: false, choose_url: true }
      - label: "Sessions à venir"
        name: "sessions"
        widget: "list"
        required: false
        field: { label: "Session", name: "session", widget: "string", hint: "Ex. : Du 15/09/2026 au 18/09/2026", required: false }
      - { label: "Pour qui ?", name: "pour_qui", widget: "text", required: false }
      - label: "Prérequis"
        name: "prerequis"
        widget: "list"
        required: false
        field: { label: "Prérequis", name: "item", widget: "string", required: false }
      - label: "Objectifs pédagogiques"
        name: "objectifs"
        widget: "list"
        required: false
        field: { label: "Objectif", name: "item", widget: "string", required: false }
      - label: "Programme (chapitres)"
        name: "programme"
        widget: "list"
        required: false
        fields:
          - { label: "Titre du chapitre", name: "titre", widget: "string", required: false }
          - label: "Points abordés"
            name: "items"
            widget: "list"
            field: { label: "Point", name: "point", widget: "string", required: false }
      - label: "Formateur"
        name: "formateur"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Nom", name: "nom", widget: "string", required: false }
          - { label: "Rôle", name: "role", widget: "string", required: false }
          - { label: "Photo (URL ou image)", name: "photo", widget: "image", required: false, choose_url: true }
          - label: "Biographie (paragraphes)"
            name: "bio"
            widget: "list"
            field: { label: "Paragraphe", name: "para", widget: "text", required: false }
      - label: "Questions fréquentes"
        name: "faq"
        widget: "list"
        summary: "{{fields.question}}"
        collapsed: true
        required: false
        fields:
          - { label: "Question", name: "question", widget: "string", required: false }
          - { label: "Réponse", name: "reponse", widget: "text", required: false }
      - { label: "Description (texte principal)", name: "body", widget: "markdown", hint: "Les paragraphes de présentation affichés en haut de la section Description.", required: false }

  # -----------------------------------------------------------------------
  # 2) RÉFÉRENCES  (projets clients / réussites)
  # -----------------------------------------------------------------------
  - name: "references"
    label: "Références"
    label_singular: "Référence"
    folder: "src/content/references"
    preview_path: "references/{{slug}}/"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{titre}}"
    sortable_fields: ["ordre", "titre", "client"]
    fields:
      - { label: "Titre du projet", name: "titre", widget: "string", hint: "Ex. : Izivia - App Mobile", required: true }
      - { label: "Client", name: "client", widget: "string", required: false }
      - { label: "Résumé (carte)", name: "resume", widget: "text", hint: "Phrase de présentation affichée sur la carte et en chapô.", required: false }
      - { label: "Ordre d'affichage", name: "ordre", widget: "number", required: false, value_type: "int", hint: "Plus petit = affiché en premier." }
      - { label: "Titre de la fiche (grand titre visible)", name: "h1", widget: "string", required: true, hint: "Ex. : L'application mobile" }
      - { label: "Sous-titre", name: "sous_titre", widget: "text", required: false, hint: "Phrase affichée sous le titre de la fiche." }
      - { label: "Lien fiche PDF", name: "fiche_pdf", widget: "string", required: false, hint: "Lien vers la fiche PDF (Drive...)." }
      - { label: "Dernière mise à jour", name: "maj", widget: "string", required: false, hint: "Ex. : 20/04/2022" }
      - label: "Chiffres clés (bandeau hero)"
        name: "stats"
        widget: "list"
        required: false
        hint: "Optionnel. Reprend des chiffres déjà présents dans l'étude de cas pour les mettre en avant."
        fields:
          - { label: "Chiffre", name: "chiffre", widget: "string", hint: "Ex. : 9 000, 200 000", required: false }
          - { label: "Libellé", name: "label", widget: "string", hint: "Ex. : utilisateurs, bornes de recharge", required: false }
      - { label: "Logo client", name: "logo", widget: "image", required: false, choose_url: true }
      - { label: "Visuel", name: "image", widget: "image", required: false, choose_url: true }
      - label: "Secteurs"
        name: "secteurs"
        widget: "list"
        required: false
        field: { label: "Secteur", name: "secteur", widget: "string", hint: "Ex. : Logistique, Mobilité, Assurance...", required: false }
      - label: "Technologies"
        name: "technologies"
        widget: "list"
        required: false
        field: { label: "Technologie", name: "techno", widget: "string", hint: "Ex. : Angular, Java, Kotlin...", required: false }
      - label: "Expertises"
        name: "expertises"
        widget: "list"
        required: false
        field: { label: "Expertise", name: "expertise", widget: "string", hint: "Ex. : UX, Data, Studio...", required: false }
      - { label: "Titre SEO", name: "meta_title", widget: "string", required: false }
      - { label: "Description SEO", name: "meta_description", widget: "text", required: false }
      - { label: "Cacher cette page de Google (à laisser décoché en temps normal)", name: "noindex", widget: "boolean", required: false, default: false }
      - { label: "Lien source (site actuel)", name: "source_url", widget: "string", required: false }
      - label: "Galerie (visuels)"
        name: "galerie"
        widget: "list"
        required: false
        field: { label: "Image", name: "image", widget: "image", choose_url: true, required: false }
      - { label: "Étude de cas", name: "body", widget: "markdown", hint: "Sections : Entreprise et activité, Nos missions, Enjeux & Objectifs, Les points clés.", required: false }

  # -----------------------------------------------------------------------
  # 3) CATÉGORIES  (pages Develop / Design / DevOps / Outils, textes SEO dédiés)
  # -----------------------------------------------------------------------
  - name: "categories"
    label: "Catégories de formation"
    label_singular: "Catégorie"
    folder: "src/content/categories"
    preview_path: "formations/{{slug}}/"
    create: false
    extension: "md"
    format: "frontmatter"
    summary: "{{nom}}"
    fields:
      - { label: "Nom", name: "nom", widget: "select", options: ["Develop", "Design", "DevOps", "Outils"], hint: "Doit correspondre à la catégorie des fiches formation.", required: false }
      - { label: "Titre SEO", name: "meta_title", widget: "string", required: false }
      - { label: "Description SEO", name: "meta_description", widget: "text", required: false }
      - { label: "Cacher cette page de Google (à laisser décoché en temps normal)", name: "noindex", widget: "boolean", required: false, default: false }
      - { label: "Titre principal de la page (grand titre visible)", name: "h1", widget: "string", required: true }
      - { label: "Introduction", name: "intro", widget: "text", required: false }
      - label: "Questions fréquentes"
        name: "faq"
        widget: "list"
        summary: "{{fields.question}}"
        collapsed: true
        required: false
        fields:
          - { label: "Question", name: "question", widget: "string", required: false }
          - { label: "Réponse", name: "reponse", widget: "text", required: false }
      - { label: "Texte SEO", name: "body", widget: "markdown", hint: "Le contenu rédactionnel affiché sous le catalogue de la catégorie.", required: false }

  # -----------------------------------------------------------------------
  # 4) SECTEURS  (pages métier : Logistique, Électromobilité, Assurance...)
  # -----------------------------------------------------------------------
  - name: "secteurs"
    label: "Secteurs"
    label_singular: "Secteur"
    folder: "src/content/secteurs"
    preview_path: "secteurs/{{slug}}/"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{titre}}"
    sortable_fields: ["ordre", "titre"]
    fields:
      - { label: "Nom du secteur", name: "titre", widget: "string", required: false }
      - { label: "Titre principal de la page (grand titre visible)", name: "h1", widget: "string", required: true }
      - { label: "Accroche", name: "accroche", widget: "text", required: false }
      - { label: "Ordre d'affichage", name: "ordre", widget: "number", required: false, value_type: "int" }
      - { label: "Titre SEO", name: "meta_title", widget: "string", required: false }
      - { label: "Description SEO", name: "meta_description", widget: "text", required: false }
      - { label: "Cacher cette page de Google (à laisser décoché en temps normal)", name: "noindex", widget: "boolean", required: false, default: false }
      - { label: "Introduction des défis", name: "defis_intro", widget: "text", required: false }
      - label: "Défis du métier"
        name: "defis"
        widget: "list"
        required: false
        field: { label: "Défi", name: "defi", widget: "string", hint: "Mots-clés en gras via <strong>...</strong>.", required: false }
      - { label: "Introduction des opportunités", name: "opportunites_intro", widget: "text", required: false }
      - label: "Opportunités"
        name: "opportunites"
        widget: "list"
        required: false
        field: { label: "Opportunité", name: "opportunite", widget: "string", required: false }
      - label: "Pourquoi 4SH (atouts)"
        name: "pourquoi"
        widget: "list"
        required: false
        fields:
          - { label: "Titre", name: "titre", widget: "string", required: false }
          - label: "Paragraphes"
            name: "paras"
            widget: "list"
            field: { label: "Paragraphe", name: "para", widget: "text", required: false }
      - { label: "Introduction de l'approche", name: "comment_intro", widget: "text", required: false }
      - label: "Étapes (Comment ?)"
        name: "etapes"
        widget: "list"
        required: false
        fields:
          - { label: "Titre", name: "titre", widget: "string", required: false }
          - { label: "Texte", name: "texte", widget: "text", required: false }
      - label: "Références clients"
        name: "references"
        widget: "relation"
        required: false
        multiple: true
        collection: "references"
        value_field: "{{slug}}"
        search_fields: ["titre", "client"]
        display_fields: ["titre"]
        hint: "Sélectionnez les fiches références à afficher (recherche par nom)."

  # -----------------------------------------------------------------------
  # 5) CLIENTS & SOLUTIONS  (pages sous /secteurs/ : profils clients et produits 4SH)
  # -----------------------------------------------------------------------
  - name: "pages_secteurs"
    label: "Clients & Solutions"
    label_singular: "Page"
    folder: "src/content/pages-secteurs"
    preview_path: "secteurs/{{slug}}/"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{titre}} ({{categorie}})"
    sortable_fields: ["categorie", "ordre", "titre"]
    fields:
      - { label: "Titre", name: "titre", widget: "string", required: false }
      - { label: "Catégorie", name: "categorie", widget: "select", options: ["Client", "Solution"], required: false }
      - { label: "Titre principal de la page (grand titre visible)", name: "h1", widget: "string", required: true }
      - { label: "Accroche", name: "chapo", widget: "text", required: false }
      - { label: "Logo produit", name: "logo", widget: "image", required: false, choose_url: true }
      - { label: "Ordre d'affichage", name: "ordre", widget: "number", required: false, value_type: "int" }
      - { label: "Titre SEO", name: "meta_title", widget: "string", required: false }
      - { label: "Description SEO", name: "meta_description", widget: "text", required: false }
      - { label: "Cacher cette page de Google (à laisser décoché en temps normal)", name: "noindex", widget: "boolean", required: false, default: false }
      - { label: "Libellé du bouton", name: "cta_label", widget: "string", required: false }
      - { label: "Lien du bouton", name: "cta_url", widget: "string", required: false }
      - { label: "Titre du bandeau final", name: "cta_titre", widget: "string", required: false }
      - { label: "Texte du bandeau final", name: "cta_texte", widget: "text", required: false }
      - label: "Chiffres clés"
        name: "chiffres"
        widget: "list"
        summary: "{{fields.valeur}} · {{fields.texte}}"
        collapsed: true
        required: false
        fields:
          - { label: "Chiffre", name: "chiffre", widget: "string", required: false }
          - { label: "Libellé", name: "label", widget: "string", required: false }
      - label: "Références clients"
        name: "references"
        widget: "relation"
        required: false
        multiple: true
        collection: "references"
        value_field: "{{slug}}"
        search_fields: ["titre", "client"]
        display_fields: ["titre"]
        hint: "Sélectionnez les fiches références à afficher (recherche par nom)."
      - label: "Questions fréquentes"
        name: "faq"
        widget: "list"
        summary: "{{fields.question}}"
        collapsed: true
        required: false
        fields:
          - { label: "Question", name: "question", widget: "string", required: false }
          - { label: "Réponse", name: "reponse", widget: "text", required: false }
      - { label: "Contenu", name: "body", widget: "markdown", required: false }

  # -----------------------------------------------------------------------
  # 5ter) PRESTATIONS  (une page d'offre = un fichier ; sous /prestations/)
  # -----------------------------------------------------------------------
  - name: "pages_prestations"
    label: "Prestations"
    label_singular: "Prestation"
    folder: "src/content/prestations"
    preview_path: "prestations/{{slug}}/"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{titre}} ({{famille_label}})"
    sortable_fields: ["ordre", "titre", "famille_label"]
    fields:
      - { label: "Nom court de la prestation", name: "titre", widget: "string", required: true }
      - { label: "Famille", name: "famille_label", widget: "select", options: ["Concevoir & développer", "Faire vivre & auditer"], required: false }
      - { label: "Titre principal de la page (grand titre visible)", name: "h1", widget: "string", required: true, hint: "Mettre un mot entre *astérisques* pour l'accentuer en rouge." }
      - { label: "Accroche", name: "chapo", widget: "text", required: false }
      - { label: "Ordre d'affichage", name: "ordre", widget: "number", required: false, value_type: "int" }
      - { label: "Titre SEO", name: "meta_title", widget: "string", required: false }
      - { label: "Description SEO", name: "meta_description", widget: "text", required: false }
      - { label: "Cacher cette page de Google (à laisser décoché en temps normal)", name: "noindex", widget: "boolean", required: false, default: false }
      - { label: "Libellé du bouton", name: "cta_label", widget: "string", required: false }
      - { label: "Lien du bouton", name: "cta_url", widget: "string", required: false, default: "/contact/" }
      - { label: "URL de la page d'origine (pour mémoire)", name: "source_url", widget: "string", required: false }
      - label: "Chiffres clés"
        name: "chiffres"
        widget: "list"
        summary: "{{fields.chiffre}} · {{fields.label}}"
        collapsed: true
        required: false
        fields:
          - { label: "Chiffre", name: "chiffre", widget: "string", required: false }
          - { label: "Libellé", name: "label", widget: "string", required: false }
      - label: "Références clients"
        name: "references"
        widget: "relation"
        required: false
        multiple: true
        collection: "references"
        value_field: "{{slug}}"
        search_fields: ["titre", "client"]
        display_fields: ["titre"]
        hint: "Sélectionnez les fiches références à afficher (recherche par nom)."
      - label: "Questions fréquentes"
        name: "faq"
        widget: "list"
        summary: "{{fields.question}}"
        collapsed: true
        required: false
        fields:
          - { label: "Question", name: "question", widget: "string", required: false }
          - { label: "Réponse", name: "reponse", widget: "text", required: false }
      - { label: "Contenu", name: "body", widget: "markdown", required: false }

  # -----------------------------------------------------------------------
  # 5bis) GLOSSAIRE  (un terme = une entrée ; affichés sur la page /glossaire/)
  # -----------------------------------------------------------------------
  - name: "glossaire"
    label: "Glossaire"
    label_singular: "Terme"
    folder: "src/content/glossaire"
    preview_path: "glossaire/"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{terme}}"
    sortable_fields: ["terme"]
    fields:
      - { label: "Terme", name: "terme", widget: "string", hint: "Le classement A-Z est automatique d'après le terme.", required: false }
      - { label: "Définition", name: "definition", widget: "text", hint: "Maillage interne : insérez un lien en plein texte avec cette syntaxe : <a href='/formations/angular-fondamental/'>Angular</a>. Mettez le lien sur un mot-clé de la phrase, vers une page pertinente du site.", required: false }

  # -----------------------------------------------------------------------
  # 5 bis) TECHNOLOGIES  (fiches sous « Expertises techniques »)
  # -----------------------------------------------------------------------
  - name: "technologies"
    label: "Technologies"
    label_singular: "Technologie"
    folder: "src/content/technologies"
    preview_path: "expertises-techniques/{{slug}}/"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{nom}}"
    sortable_fields: ["ordre", "nom"]
    fields:
      - { label: "Nom", name: "nom", widget: "string", hint: "Ex. : Java", required: true }
      - { label: "Ordre d'affichage", name: "ordre", widget: "number", required: false, value_type: "int", hint: "Plus petit = affiché en premier sur la page mère." }
      - { label: "Famille d'offre (code couleur)", name: "famille", widget: "select", options: ["build", "run", "formation"], default: "build", hint: "build = rouge (dev), run = cyan (infra), formation = violet.", required: false }
      - { label: "Logo (URL ou image)", name: "logo", widget: "image", required: false, choose_url: true }
      - { label: "Accroche courte (carte de la page mère)", name: "accroche_courte", widget: "text", required: false }
      - { label: "Titre (H1)", name: "h1", widget: "string", hint: "Pour mettre un mot en avant (rouge, italique), encadrez-le d'astérisques. Ex. : votre *projet*", required: false }
      - { label: "Introduction (hero)", name: "intro", widget: "text", required: false }
      - { label: "Titre SEO", name: "meta_title", widget: "string", required: false }
      - { label: "Description SEO", name: "meta_description", widget: "text", required: false }
      - { label: "Pourquoi · titre", name: "pourquoi_titre", widget: "string", hint: "Pour mettre un mot en avant, encadrez-le d'astérisques. Ex. : votre *projet*", required: false }
      - { label: "Pourquoi · sous-titre", name: "pourquoi_intro", widget: "text", required: false }
      - label: "Atouts (numérotés automatiquement)"
        name: "atouts"
        widget: "list"
        summary: "{{fields.titre}}"
        collapsed: true
        fields:
          - { label: "Titre", name: "titre", widget: "string", required: false }
          - { label: "Texte", name: "texte", widget: "text", required: false }
      - label: "Références clients"
        name: "references"
        widget: "list"
        summary: "{{fields.titre}}"
        collapsed: true
        required: false
        fields:
          - { label: "Titre", name: "titre", widget: "string", required: false }
          - { label: "Lien (optionnel)", name: "lien", widget: "string", required: false }
          - { label: "Texte", name: "texte", widget: "text", required: false }
      - { label: "Guide · surtitre du bloc de contenu", name: "corps_eyebrow", widget: "string", required: false, hint: "Ex. : Guide, ou Communauté et écosystème." }
      - { label: "Guide · titre du bloc de contenu", name: "corps_titre", widget: "string", required: false }
      - { label: "Guide · afficher le bloc sur fond sombre", name: "corps_sombre", widget: "boolean", required: false, default: false }
      - { label: "Guide · URL de la page d'origine (pour mémoire)", name: "guide_source_url", widget: "string", required: false }
      - label: "Formations liées"
        name: "formations"
        widget: "list"
        summary: "{{fields.titre}}"
        collapsed: true
        required: false
        fields:
          - { label: "Titre", name: "titre", widget: "string", required: false }
          - { label: "Lien", name: "url", widget: "string", required: false }
      - { label: "Communauté & écosystème", name: "body", widget: "markdown", hint: "Texte affiché dans la section sombre « Communauté et écosystème ».", required: false }

  # -----------------------------------------------------------------------
  # 6) PAGE D'ACCUEIL EN BLOCS  (preuve de concept, voir docs/back-office/schema-blocs.md)
  #    Un seul écran pour le français et l'anglais (multilingue intégré de Sveltia) :
  #    src/_data/contenus/fr/accueil.json et src/_data/contenus/en/accueil.json.
  #    L'ancien fichier src/_data/accueil.json n'est plus édité ici (retour arrière possible).
  # -----------------------------------------------------------------------
  - name: accueil
    label: Page d'accueil
    label_singular: Page d'accueil
    i18n: true
    files:
      - name: accueil
        label: Page d'accueil
        file: src/_data/contenus/{{locale}}/accueil.json
        format: json
        i18n: true
        preview_path: "{{locale}}/"
        fields:
          - label: Référencement
            name: seo
            widget: object
            required: false
            collapsed: true
            summary: "{{fields.meta_title}}"
            hint: Ce qui s'affiche dans les résultats de Google et l'onglet du navigateur.
            fields:
              - { label: Titre SEO (onglet du navigateur), name: meta_title, widget: string, required: false, hint: 60 caractères maximum., i18n: true }
              - { label: Description SEO, name: meta_description, widget: text, required: false, hint: 155 caractères maximum., i18n: true }
            i18n: true
          - label: Blocs de la page
            name: blocs
            widget: list
            required: false
            label_singular: Bloc
            hint: Les blocs s'affichent dans cet ordre. Faites-les glisser pour les déplacer. Le formulaire de contact reste toujours en bas de page.
            collapsed: true
            typeKey: type
            types:
              - label: Hero (haut de page)
                name: hero
                widget: object
                summary: "Hero : {{fields.accroche}}{{fields.masquer | ternary(' (masqué)', '')}}"
                fields:
                  - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé.", i18n: true }
                  - { label: Titre de la page (H1), name: titre_page, widget: string, required: true, hint: Affiché en petit au-dessus de l'accroche. Lu par Google et les lecteurs d'écran. 60 caractères maximum., i18n: true }
                  - { label: Accroche, name: accroche, widget: string, required: true, hint: Mettez un mot entre *astérisques* pour l'afficher en rouge. Environ 40 caractères., i18n: true }
                  - { label: Chapô, name: chapo, widget: text, required: false, hint: 40 mots maximum., i18n: true }
                  - label: Bouton principal
                    name: bouton_principal
                    widget: object
                    required: true
                    collapsed: false
                    summary: "{{fields.texte}} ({{fields.lien}})"
                    fields:
                      - { label: Texte du bouton, name: texte, widget: string, required: true, i18n: true }
                      - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: true, default: "#contact", i18n: true }
                    i18n: true
                  - label: Bouton secondaire
                    name: bouton_secondaire
                    widget: object
                    required: false
                    collapsed: false
                    summary: "{{fields.texte}} ({{fields.lien}})"
                    fields:
                      - { label: Texte du bouton, name: texte, widget: string, required: false, i18n: true }
                      - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: false, default: /references/, i18n: true }
                    i18n: true
                  - { label: Note sous les boutons, name: note, widget: string, required: false, i18n: true }
                  - label: Encart visuel
                    name: encart
                    widget: object
                    required: false
                    collapsed: true
                    summary: "{{fields.titre}}"
                    fields:
                      - { label: Afficher l'encart, name: afficher, widget: boolean, required: false, default: true, i18n: true }
                      - { label: Titre de l'encart, name: titre, widget: string, required: false, i18n: true }
                      - label: Lignes
                        name: lignes
                        widget: list
                        required: false
                        label_singular: Ligne
                        collapsed: true
                        summary: "{{fields.cle}} : {{fields.valeur}}"
                        fields:
                          - { label: Mot-clé, name: cle, widget: string, required: false, i18n: true }
                          - { label: Texte, name: valeur, widget: string, required: false, i18n: true }
                        i18n: true
                      - { label: Badge, name: badge, widget: string, required: false, i18n: true }
                      - { label: Note du badge, name: badge_note, widget: string, required: false, i18n: true }
                    i18n: true
              - label: Logos clients (Ils nous confient leur métier)
                name: logos_clients
                widget: object
                summary: Logos clients{{fields.masquer | ternary(' (masqué)', '')}}
                fields:
                  - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé.", i18n: true }
                  - { label: Titre, name: titre, widget: string, required: false, hint: Laisser vide pour reprendre l'intitulé des réglages du site. Les noms des clients se modifient dans les réglages du site., i18n: true }
              - label: Cartes d'offres (Build, Run, Learning)
                name: cartes_offres
                widget: object
                summary: "Cartes d'offres : {{fields.titre}}{{fields.masquer | ternary(' (masqué)', '')}}"
                fields:
                  - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé.", i18n: true }
                  - { label: Surtitre, name: surtitre, widget: string, required: false, i18n: true }
                  - { label: Titre, name: titre, widget: string, required: true, hint: Mettez un mot entre *astérisques* pour l'afficher en rouge., i18n: true }
                  - { label: Sous-titre, name: sous_titre, widget: text, required: false, i18n: true }
                  - label: Cartes
                    name: cartes
                    widget: list
                    required: false
                    label_singular: Carte
                    collapsed: true
                    min: 1
                    max: 3
                    summary: "{{fields.titre}}"
                    hint: De 1 à 3 cartes.
                    fields:
                      - label: Couleur d'offre
                        name: offre
                        widget: select
                        required: true
                        default: build
                        hint: Donne la couleur, le picto et l'étiquette de la carte.
                        options:
                          - { label: 4SH Build, value: build }
                          - { label: 4SH Run, value: run }
                          - { label: 4SH Learning, value: learning }
                          - { label: 4SH institutionnel, value: institutionnel }
                        i18n: true
                      - { label: Titre, name: titre, widget: string, required: true, i18n: true }
                      - { label: Texte, name: texte, widget: text, required: true, i18n: true }
                      - label: Liens
                        name: liens
                        widget: list
                        required: false
                        label_singular: Lien
                        collapsed: true
                        summary: "{{fields.texte}}"
                        fields:
                          - { label: Texte du bouton, name: texte, widget: string, required: false, i18n: true }
                          - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: false, i18n: true }
                        i18n: true
                      - label: Lien de bas de carte
                        name: lien_bas
                        widget: object
                        required: false
                        collapsed: false
                        summary: "{{fields.texte}} ({{fields.lien}})"
                        fields:
                          - { label: Texte du bouton, name: texte, widget: string, required: false, i18n: true }
                          - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: false, i18n: true }
                        i18n: true
                    i18n: true
              - label: Chiffres clés
                name: chiffres_cles
                widget: object
                summary: Chiffres clés{{fields.masquer | ternary(' (masqué)', '')}}
                fields:
                  - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé.", i18n: true }
                  - label: Chiffres
                    name: chiffres
                    widget: list
                    required: false
                    label_singular: Chiffre
                    collapsed: true
                    min: 2
                    max: 4
                    summary: "{{fields.valeur}} {{fields.texte}}"
                    hint: De 2 à 4 chiffres.
                    fields:
                      - { label: Chiffre, name: valeur, widget: string, required: true, i18n: true }
                      - { label: Libellé, name: texte, widget: string, required: true, i18n: true }
                      - { label: Note (petit texte), name: note, widget: string, required: false, i18n: true }
                    i18n: true
              - label: Cartes secteurs (carrousel)
                name: cartes_secteurs
                widget: object
                summary: "Cartes secteurs : {{fields.titre}}{{fields.masquer | ternary(' (masqué)', '')}}"
                fields:
                  - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé.", i18n: true }
                  - { label: Surtitre, name: surtitre, widget: string, required: false, i18n: true }
                  - { label: Titre, name: titre, widget: string, required: true, hint: Mettez un mot entre *astérisques* pour l'afficher en rouge., i18n: true }
                  - { label: Sous-titre, name: sous_titre, widget: text, required: false, i18n: true }
                  - label: Cartes
                    name: cartes
                    widget: list
                    required: false
                    label_singular: Carte
                    collapsed: true
                    summary: "{{fields.titre}}"
                    fields:
                      - { label: Titre, name: titre, widget: string, required: true, i18n: true }
                      - { label: Texte, name: texte, widget: text, required: false, i18n: true }
                      - label: Lien de la carte
                        name: lien
                        widget: object
                        required: false
                        collapsed: false
                        summary: "{{fields.texte}} ({{fields.lien}})"
                        fields:
                          - { label: Texte du bouton, name: texte, widget: string, required: false, i18n: true }
                          - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: false, i18n: true }
                        i18n: true
                    i18n: true
              - label: Méthode 4D
                name: methode_4d
                widget: object
                summary: "Méthode 4D : {{fields.titre}}{{fields.masquer | ternary(' (masqué)', '')}}"
                fields:
                  - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé.", i18n: true }
                  - { label: Surtitre, name: surtitre, widget: string, required: false, i18n: true }
                  - { label: Titre, name: titre, widget: string, required: true, hint: Mettez un mot entre *astérisques* pour l'afficher en rouge., i18n: true }
                  - { label: Sous-titre, name: sous_titre, widget: text, required: false, i18n: true }
                  - label: Étapes
                    name: etapes
                    widget: list
                    required: false
                    label_singular: Étape
                    collapsed: true
                    min: 4
                    max: 4
                    summary: "{{fields.numero}} {{fields.phase}}"
                    hint: Exactement 4 étapes. Elles sont aussi reprises dans le haut de page.
                    fields:
                      - { label: Numéro, name: numero, widget: string, required: false, i18n: true }
                      - { label: Phase, name: phase, widget: string, required: false, i18n: true }
                      - { label: Titre, name: titre, widget: string, required: false, i18n: true }
                      - { label: Texte, name: texte, widget: text, required: false, i18n: true }
                    i18n: true
              - label: Projets (carrousel de réalisations)
                name: projets
                widget: object
                summary: "Projets : {{fields.titre}}{{fields.masquer | ternary(' (masqué)', '')}}"
                fields:
                  - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé.", i18n: true }
                  - { label: Surtitre, name: surtitre, widget: string, required: false, i18n: true }
                  - { label: Titre, name: titre, widget: string, required: true, hint: Mettez un mot entre *astérisques* pour l'afficher en rouge., i18n: true }
                  - { label: Sous-titre, name: sous_titre, widget: text, required: false, i18n: true }
                  - label: Projets
                    name: projets
                    widget: list
                    required: false
                    label_singular: Projet
                    collapsed: true
                    summary: "{{fields.client}} ({{fields.secteur}})"
                    fields:
                      - { label: Secteur, name: secteur, widget: string, required: false, i18n: true }
                      - { label: Client, name: client, widget: string, required: true, i18n: true }
                      - label: Visuel du projet
                        name: image
                        widget: object
                        required: false
                        collapsed: true
                        summary: "{{fields.fichier}}"
                        fields:
                          - { label: Image, name: fichier, widget: image, required: false, i18n: true }
                          - { label: Texte alternatif, name: alt, widget: string, required: false, hint: Obligatoire sauf si l'image est décorative. Décrivez ce que montre l'image., i18n: true }
                          - { label: Image décorative (aucune information à transmettre), name: decorative, widget: boolean, required: false, default: false, i18n: true }
                          - { label: Crédit photo, name: credit, widget: string, required: false, i18n: true }
                          - label: Cadrage
                            name: cadrage
                            widget: select
                            required: true
                            default: centre
                            hint: Partie de l'image conservée quand elle est recadrée.
                            options:
                              - { label: Centre, value: centre }
                              - { label: Haut, value: haut }
                              - { label: Bas, value: bas }
                              - { label: Gauche, value: gauche }
                              - { label: Droite, value: droite }
                            i18n: true
                        i18n: true
                      - { label: Description, name: description, widget: text, required: false, i18n: true }
                      - { label: Témoignage, name: temoignage, widget: relation, required: false, hint: "Choisissez un témoignage de la collection Témoignages. Pour en créer un, passez par cette collection.", collection: temoignages, value_field: "{{slug}}", display_fields: ["{{auteur}}, {{entreprise}}"], search_fields: [auteur, entreprise, citation], i18n: true }
                      - label: Chiffres du projet
                        name: chiffres
                        widget: list
                        required: false
                        label_singular: Chiffre
                        collapsed: true
                        summary: "{{fields.valeur}} {{fields.libelle}}"
                        fields:
                          - { label: Chiffre, name: valeur, widget: string, required: false, hint: Mettez un mot entre *astérisques* pour l'afficher en rouge., i18n: true }
                          - { label: Libellé, name: libelle, widget: string, required: false, i18n: true }
                        i18n: true
                      - label: Bouton du projet
                        name: bouton
                        widget: object
                        required: false
                        collapsed: false
                        summary: "{{fields.texte}} ({{fields.lien}})"
                        fields:
                          - { label: Texte du bouton, name: texte, widget: string, required: false, i18n: true }
                          - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: false, i18n: true }
                        i18n: true
                    i18n: true
                  - label: Bouton sous le carrousel
                    name: bouton_bas
                    widget: object
                    required: false
                    collapsed: false
                    summary: "{{fields.texte}} ({{fields.lien}})"
                    fields:
                      - { label: Texte du bouton, name: texte, widget: string, required: false, i18n: true }
                      - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: false, default: /references/, i18n: true }
                    i18n: true
              - label: Technologies (mur)
                name: technologies
                widget: object
                summary: "Technologies : {{fields.titre}}{{fields.masquer | ternary(' (masqué)', '')}}"
                fields:
                  - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé.", i18n: true }
                  - { label: Surtitre, name: surtitre, widget: string, required: false, i18n: true }
                  - { label: Titre, name: titre, widget: string, required: true, hint: Mettez un mot entre *astérisques* pour l'afficher en rouge., i18n: true }
                  - { label: Sous-titre, name: sous_titre, widget: text, required: false, i18n: true }
                  - label: Technologies
                    name: technos
                    widget: list
                    required: false
                    label_singular: Technologie
                    collapsed: true
                    summary: "{{fields.nom}}"
                    fields:
                      - { label: Nom, name: nom, widget: string, required: true, i18n: true }
                      - { label: Destination, name: lien, widget: string, required: false, i18n: true }
                    i18n: true
              - label: Questions fréquentes
                name: faq
                widget: object
                summary: "Questions fréquentes : {{fields.titre}}{{fields.masquer | ternary(' (masqué)', '')}}"
                fields:
                  - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé.", i18n: true }
                  - { label: Titre, name: titre, widget: string, required: true, i18n: true }
                  - { label: Sous-titre, name: sous_titre, widget: text, required: false, i18n: true }
                  - label: Questions
                    name: questions
                    widget: list
                    required: false
                    label_singular: Question
                    collapsed: true
                    summary: "{{fields.question}}"
                    fields:
                      - { label: Question, name: question, widget: string, required: true, i18n: true }
                      - { label: Réponse, name: reponse, widget: text, required: true, i18n: true }
                    i18n: true
              - label: Derniers articles du blog
                name: derniers_articles
                widget: object
                summary: "Derniers articles : {{fields.titre}}{{fields.masquer | ternary(' (masqué)', '')}}"
                fields:
                  - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé.", i18n: true }
                  - { label: Titre, name: titre, widget: string, required: false, hint: Mettez un mot entre *astérisques* pour l'afficher en rouge. Les articles sont repris automatiquement du blog., default: Nos derniers *articles*, i18n: true }
                  - label: Lien vers le blog
                    name: lien_tout
                    widget: object
                    required: false
                    collapsed: false
                    summary: "{{fields.texte}} ({{fields.lien}})"
                    fields:
                      - { label: Texte du bouton, name: texte, widget: string, required: false, default: Tout le blog, i18n: true }
                      - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: false, default: https://blog.4sh.fr/, i18n: true }
                    i18n: true
              - label: Équipe (photo et texte)
                name: equipe
                widget: object
                summary: "Équipe : {{fields.titre}}{{fields.masquer | ternary(' (masqué)', '')}}"
                fields:
                  - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé.", i18n: true }
                  - { label: Surtitre, name: surtitre, widget: string, required: false, i18n: true }
                  - { label: Titre, name: titre, widget: string, required: true, hint: Mettez un mot entre *astérisques* pour l'afficher en rouge., i18n: true }
                  - { label: Texte, name: texte, widget: text, required: false, i18n: true }
                  - label: Photo de l'équipe
                    name: photo
                    widget: object
                    required: false
                    collapsed: true
                    summary: "{{fields.fichier}}"
                    fields:
                      - { label: Image, name: fichier, widget: image, required: false, i18n: true }
                      - { label: Texte alternatif, name: alt, widget: string, required: false, hint: "Obligatoire sauf si l'image est décorative. Décrivez ce que montre l'image. À défaut, le titre est utilisé.", i18n: true }
                      - { label: Image décorative (aucune information à transmettre), name: decorative, widget: boolean, required: false, default: false, i18n: true }
                      - { label: Crédit photo, name: credit, widget: string, required: false, i18n: true }
