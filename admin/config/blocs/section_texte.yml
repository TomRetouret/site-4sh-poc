# Bloc « section_texte » : Section de texte (pages de prestation)
# Composant du site : src/_includes/composants/blocs/section_texte.njk (morceaux communs : _section.njk)
# Spécification : docs/back-office/schema-prestations.md ; mode d'emploi : docs/back-office/schema-blocs.md
# Après modification : node scripts/generer-blocs.js puis node scripts/assembler-config.js
#
# Le fond (blanc, gris clair une section sur deux, sombre pour la première section en étapes)
# et le petit numéro de section sont calculés par le site : aucun réglage ici.

profils:
  prestation: 10

type:
  label: Section de texte
  name: section_texte
  widget: object
  summary: 'Texte : {{fields.titre}}{{fields.masquer | ternary('' (masqué)'', '''')}}'
  fields:
    - label: Masquer ce bloc (il reste enregistré)
      name: masquer
      widget: boolean
      required: false
      default: false
      hint: Le bloc n'apparaît plus sur le site, mais son contenu est conservé.
    - label: Titre de la section
      name: titre
      widget: string
      required: false
      hint: 'Mettez un mot entre *astérisques* pour l''afficher en rouge. Laissez vide uniquement pour le texte d''introduction en haut de page.'
    - label: Disposition
      name: disposition
      widget: select
      required: true
      default: empile
      options:
        - { label: 'Titre au-dessus du texte', value: empile }
        - { label: 'Titre à gauche, texte à droite', value: colonnes }
        - { label: "Bandeau d'appel centré (sans numéro)", value: bandeau }
      hint: Le bandeau d'appel convient à la dernière section, avec un titre court et un bouton.
    - label: Texte
      name: texte
      widget: markdown
      required: false
      hint: Gras, liens et listes (affichées en liste à cocher). Laissez une ligne vide entre deux paragraphes.
      buttons: [bold, link, bulleted-list, numbered-list]
      editor_components: []
      modes: [rich_text]
    - label: Boutons
      name: boutons
      widget: list
      required: false
      label_singular: Bouton
      collapsed: true
      max: 3
      summary: '{{fields.texte}} ({{fields.lien}})'
      hint: Facultatif. Affichés en fin de section ; le premier est rouge, les suivants en contour.
      fields:
        - label: Texte du bouton
          name: texte
          widget: string
          required: true
          hint: 'Verbe d''action, 30 caractères maximum. Par exemple : Parlons de votre projet.'
        - label: Destination
          name: lien
          widget: string
          required: true
          default: /contact/
          hint: Adresse d'une page du site (/contact/) ou adresse complète (https://...), ouverte alors dans un nouvel onglet.
