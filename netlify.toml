# Configuration de déploiement Netlify
# (Netlify = l'hébergeur le plus simple pour un CMS git : auth du CMS incluse)
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Cache des images optimisées dans node_modules, que Netlify conserve entre deux builds.
  IMAGES_CACHE_DIR = "node_modules/.cache/eleventy-img"

# Empêche l'indexation par les moteurs pendant la préprod (double sécurité avec la balise meta noindex).
# À RETIRER lors de la mise en production réelle (et passer "indexation" à true dans src/_data/seo.json).
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Storybook du design system (publié avec le site sous /storybook/) : jamais indexé.
# À CONSERVER après la mise en production, contrairement à l'en-tête global ci-dessus.
[[headers]]
  for = "/storybook/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
