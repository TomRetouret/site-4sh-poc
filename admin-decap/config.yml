# =========================================================================
#  Preuve de concept : Decap CMS 3.17.3 (comparaison avec Sveltia, voir /admin/)
#  Périmètre limité : page d'accueil en blocs, témoignages et pages de démonstration.
#  Schéma de référence : docs/back-office/schema-blocs.md
# =========================================================================

backend:
  name: github
  repo: TomRetouret/site-4sh-poc # dépôt de test temporaire (compte personnel de Tom), à transférer vers 4SH ensuite
  branch: main
  # Même Worker Cloudflare que Sveltia (sveltia-cms-auth) : il répond sur /auth et /callback,
  # chemins attendus par Decap (auth_endpoint par défaut : auth).
  base_url: https://sveltia-cms-auth.tom-retouret.workers.dev
  # Les liens d'aperçu viennent des statuts de commit dont le nom contient « deploy »
  # (Netlify : netlify/<site>/deploy-preview). Sinon, nommer le statut ici :
  # preview_context: netlify/site-4sh-poc/deploy-preview

# Circuit éditorial : Brouillon, En relecture, Prêt. Chaque contenu modifié vit dans une
# pull request jusqu'à sa publication. Decap n'a pas de réglage pour enregistrer un brouillon
# incomplet : les champs obligatoires sont contrôlés à chaque enregistrement.
publish_mode: editorial_workflow
show_preview_links: true

locale: fr
site_url: https://site-4sh-poc.netlify.app # site Netlify de test : nommer le site « site-4sh-poc » sur Netlify, sinon corriger ici
display_url: https://site-4sh-poc.netlify.app # site Netlify de test : nommer le site « site-4sh-poc » sur Netlify, sinon corriger ici

media_folder: "src/uploads"
public_folder: "/uploads"

# Multilingue : Decap n'accepte que la structure single_file (un seul fichier pour toutes les
# langues) pour une collection de fichiers. Le schéma impose un fichier par langue : la page
# d'accueil est donc proposée en deux fichiers distincts, sans multilingue intégré.
# Les témoignages (collection de dossier) utilisent le multilingue : temoignages/<langue>/<slug>.json
i18n:
  structure: multiple_folders
  locales: [fr, en]
  default_locale: fr

collections:
  # -----------------------------------------------------------------------
  # Page d'accueil en blocs (un fichier par langue)
  # -----------------------------------------------------------------------
  - name: accueil
    label: Page d'accueil
    files:
      - name: accueil_fr
        label: Page d'accueil (français)
        file: src/_data/contenus/fr/accueil.json
        preview_path: ""
        fields:
          - label: Référencement
            name: seo
            widget: object
            required: false
            collapsed: true
            summary: "{{fields.meta_title}}"
            hint: Ce qui s'affiche dans les résultats de Google et l'onglet du navigateur.
            fields:
              - { label: Titre SEO (onglet du navigateur), name: meta_title, widget: string, required: false, hint: 60 caractères maximum. }
              - { label: Description SEO, name: meta_description, widget: text, required: false, hint: 155 caractères maximum. }
          - label: Blocs de la page
            name: blocs
            widget: list
            required: false
            label_singular: Bloc
            hint: Les blocs s'affichent dans cet ordre. Faites-les glisser pour les déplacer. Le formulaire de contact reste toujours en bas de page.
            collapsed: true
            typeKey: type
            types:
              - label: Hero (haut de page)
                name: hero
                widget: object
                summary: "Hero : {{fields.accroche}}{{fields.masquer | ternary(' (masqué)', '')}}"
                fields:
                  - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé." }
                  - { label: Titre de la page (H1), name: titre_page, widget: string, required: true, hint: Affiché en petit au-dessus de l'accroche. Lu par Google et les lecteurs d'écran. 60 caractères maximum. }
                  - { label: Accroche, name: accroche, widget: string, required: true, hint: Mettez un mot entre *astérisques* pour l'afficher en rouge. Environ 40 caractères. }
                  - { label: Chapô, name: chapo, widget: text, required: false, hint: 40 mots maximum. }
                  - label: Bouton principal
                    name: bouton_principal
                    widget: object
                    required: true
                    collapsed: false
                    summary: "{{fields.texte}} ({{fields.lien}})"
                    fields:
                      - { label: Texte du bouton, name: texte, widget: string, required: true }
                      - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: true, default: "#contact" }
                  - label: Bouton secondaire
                    name: bouton_secondaire
                    widget: object
                    required: false
                    collapsed: false
                    summary: "{{fields.texte}} ({{fields.lien}})"
                    fields:
                      - { label: Texte du bouton, name: texte, widget: string, required: false }
                      - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: false, default: /references/ }
                  - { label: Note sous les boutons, name: note, widget: string, required: false }
                  - label: Encart visuel
                    name: encart
                    widget: object
                    required: false
                    collapsed: true
                    summary: "{{fields.titre}}"
                    fields:
                      - { label: Afficher l'encart, name: afficher, widget: boolean, required: false, default: true }
                      - { label: Titre de l'encart, name: titre, widget: string, required: false }
                      - label: Lignes
                        name: lignes
                        widget: list
                        required: false
                        label_singular: Ligne
                        collapsed: true
                        summary: "{{fields.cle}} : {{fields.valeur}}"
                        fields:
                          - { label: Mot-clé, name: cle, widget: string, required: false }
                          - { label: Texte, name: valeur, widget: string, required: false }
                      - { label: Badge, name: badge, widget: string, required: false }
                      - { label: Note du badge, name: badge_note, widget: string, required: false }
              - label: Logos clients (Ils nous confient leur métier)
                name: logos_clients
                widget: object
                summary: Logos clients{{fields.masquer | ternary(' (masqué)', '')}}
                fields:
                  - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé." }
                  - { label: Titre, name: titre, widget: string, required: false, hint: Laisser vide pour reprendre l'intitulé des réglages du site. Les noms des clients se modifient dans les réglages du site. }
              - label: Cartes d'offres (Build, Run, Learning)
                name: cartes_offres
                widget: object
                summary: "Cartes d'offres : {{fields.titre}}{{fields.masquer | ternary(' (masqué)', '')}}"
                fields:
                  - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé." }
                  - { label: Surtitre, name: surtitre, widget: string, required: false }
                  - { label: Titre, name: titre, widget: string, required: true, hint: Mettez un mot entre *astérisques* pour l'afficher en rouge. }
                  - { label: Sous-titre, name: sous_titre, widget: text, required: false }
                  - label: Cartes
                    name: cartes
                    widget: list
                    required: false
                    label_singular: Carte
                    collapsed: true
                    min: 1
                    max: 3
                    summary: "{{fields.titre}}"
                    hint: De 1 à 3 cartes.
                    fields:
                      - label: Couleur d'offre
                        name: offre
                        widget: select
                        required: true
                        default: build
                        hint: Donne la couleur, le picto et l'étiquette de la carte.
                        options:
                          - { label: 4SH Build, value: build }
                          - { label: 4SH Run, value: run }
                          - { label: 4SH Learning, value: learning }
                          - { label: 4SH institutionnel, value: institutionnel }
                      - { label: Titre, name: titre, widget: string, required: true }
                      - { label: Texte, name: texte, widget: text, required: true }
                      - label: Liens
                        name: liens
                        widget: list
                        required: false
                        label_singular: Lien
                        collapsed: true
                        summary: "{{fields.texte}}"
                        fields:
                          - { label: Texte du bouton, name: texte, widget: string, required: false }
                          - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: false }
                      - label: Lien de bas de carte
                        name: lien_bas
                        widget: object
                        required: false
                        collapsed: false
                        summary: "{{fields.texte}} ({{fields.lien}})"
                        fields:
                          - { label: Texte du bouton, name: texte, widget: string, required: false }
                          - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: false }
              - label: Chiffres clés
                name: chiffres_cles
                widget: object
                summary: Chiffres clés{{fields.masquer | ternary(' (masqué)', '')}}
                fields:
                  - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé." }
                  - label: Chiffres
                    name: chiffres
                    widget: list
                    required: false
                    label_singular: Chiffre
                    collapsed: true
                    min: 2
                    max: 4
                    summary: "{{fields.valeur}} {{fields.texte}}"
                    hint: De 2 à 4 chiffres.
                    fields:
                      - { label: Chiffre, name: valeur, widget: string, required: true }
                      - { label: Libellé, name: texte, widget: string, required: true }
                      - { label: Note (petit texte), name: note, widget: string, required: false }
              - label: Cartes secteurs (carrousel)
                name: cartes_secteurs
                widget: object
                summary: "Cartes secteurs : {{fields.titre}}{{fields.masquer | ternary(' (masqué)', '')}}"
                fields:
                  - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé." }
                  - { label: Surtitre, name: surtitre, widget: string, required: false }
                  - { label: Titre, name: titre, widget: string, required: true, hint: Mettez un mot entre *astérisques* pour l'afficher en rouge. }
                  - { label: Sous-titre, name: sous_titre, widget: text, required: false }
                  - label: Cartes
                    name: cartes
                    widget: list
                    required: false
                    label_singular: Carte
                    collapsed: true
                    summary: "{{fields.titre}}"
                    fields:
                      - { label: Titre, name: titre, widget: string, required: true }
                      - { label: Texte, name: texte, widget: text, required: false }
                      - label: Lien de la carte
                        name: lien
                        widget: object
                        required: false
                        collapsed: false
                        summary: "{{fields.texte}} ({{fields.lien}})"
                        fields:
                          - { label: Texte du bouton, name: texte, widget: string, required: false }
                          - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: false }
              - label: Méthode 4D
                name: methode_4d
                widget: object
                summary: "Méthode 4D : {{fields.titre}}{{fields.masquer | ternary(' (masqué)', '')}}"
                fields:
                  - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé." }
                  - { label: Surtitre, name: surtitre, widget: string, required: false }
                  - { label: Titre, name: titre, widget: string, required: true, hint: Mettez un mot entre *astérisques* pour l'afficher en rouge. }
                  - { label: Sous-titre, name: sous_titre, widget: text, required: false }
                  - label: Étapes
                    name: etapes
                    widget: list
                    required: false
                    label_singular: Étape
                    collapsed: true
                    min: 4
                    max: 4
                    summary: "{{fields.numero}} {{fields.phase}}"
                    hint: Exactement 4 étapes. Elles sont aussi reprises dans le haut de page.
                    fields:
                      - { label: Numéro, name: numero, widget: string, required: false }
                      - { label: Phase, name: phase, widget: string, required: false }
                      - { label: Titre, name: titre, widget: string, required: false }
                      - { label: Texte, name: texte, widget: text, required: false }
              - label: Projets (carrousel de réalisations)
                name: projets
                widget: object
                summary: "Projets : {{fields.titre}}{{fields.masquer | ternary(' (masqué)', '')}}"
                fields:
                  - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé." }
                  - { label: Surtitre, name: surtitre, widget: string, required: false }
                  - { label: Titre, name: titre, widget: string, required: true, hint: Mettez un mot entre *astérisques* pour l'afficher en rouge. }
                  - { label: Sous-titre, name: sous_titre, widget: text, required: false }
                  - label: Projets
                    name: projets
                    widget: list
                    required: false
                    label_singular: Projet
                    collapsed: true
                    summary: "{{fields.client}} ({{fields.secteur}})"
                    fields:
                      - { label: Secteur, name: secteur, widget: string, required: false }
                      - { label: Client, name: client, widget: string, required: true }
                      - label: Visuel du projet
                        name: image
                        widget: object
                        required: false
                        collapsed: true
                        summary: "{{fields.fichier}}"
                        fields:
                          - { label: Image, name: fichier, widget: image, required: false }
                          - { label: Texte alternatif, name: alt, widget: string, required: false, hint: Obligatoire sauf si l'image est décorative. Décrivez ce que montre l'image. }
                          - { label: Image décorative (aucune information à transmettre), name: decorative, widget: boolean, required: false, default: false }
                          - { label: Crédit photo, name: credit, widget: string, required: false }
                          - label: Cadrage
                            name: cadrage
                            widget: select
                            required: true
                            default: centre
                            hint: Partie de l'image conservée quand elle est recadrée.
                            options:
                              - { label: Centre, value: centre }
                              - { label: Haut, value: haut }
                              - { label: Bas, value: bas }
                              - { label: Gauche, value: gauche }
                              - { label: Droite, value: droite }
                      - { label: Description, name: description, widget: text, required: false }
                      - { label: Témoignage, name: temoignage, widget: relation, required: false, hint: "Choisissez un témoignage de la collection Témoignages. Pour en créer un, passez par cette collection.", collection: temoignages, value_field: "{{slug}}", display_fields: ["{{auteur}}, {{entreprise}}"], search_fields: [auteur, entreprise, citation] }
                      - label: Chiffres du projet
                        name: chiffres
                        widget: list
                        required: false
                        label_singular: Chiffre
                        collapsed: true
                        summary: "{{fields.valeur}} {{fields.libelle}}"
                        fields:
                          - { label: Chiffre, name: valeur, widget: string, required: false, hint: Mettez un mot entre *astérisques* pour l'afficher en rouge. }
                          - { label: Libellé, name: libelle, widget: string, required: false }
                      - label: Bouton du projet
                        name: bouton
                        widget: object
                        required: false
                        collapsed: false
                        summary: "{{fields.texte}} ({{fields.lien}})"
                        fields:
                          - { label: Texte du bouton, name: texte, widget: string, required: false }
                          - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: false }
                  - label: Bouton sous le carrousel
                    name: bouton_bas
                    widget: object
                    required: false
                    collapsed: false
                    summary: "{{fields.texte}} ({{fields.lien}})"
                    fields:
                      - { label: Texte du bouton, name: texte, widget: string, required: false }
                      - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: false, default: /references/ }
              - label: Technologies (mur)
                name: technologies
                widget: object
                summary: "Technologies : {{fields.titre}}{{fields.masquer | ternary(' (masqué)', '')}}"
                fields:
                  - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé." }
                  - { label: Surtitre, name: surtitre, widget: string, required: false }
                  - { label: Titre, name: titre, widget: string, required: true, hint: Mettez un mot entre *astérisques* pour l'afficher en rouge. }
                  - { label: Sous-titre, name: sous_titre, widget: text, required: false }
                  - label: Technologies
                    name: technos
                    widget: list
                    required: false
                    label_singular: Technologie
                    collapsed: true
                    summary: "{{fields.nom}}"
                    fields:
                      - { label: Nom, name: nom, widget: string, required: true }
                      - { label: Destination, name: lien, widget: string, required: false }
              - label: Questions fréquentes
                name: faq
                widget: object
                summary: "Questions fréquentes : {{fields.titre}}{{fields.masquer | ternary(' (masqué)', '')}}"
                fields:
                  - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé." }
                  - { label: Titre, name: titre, widget: string, required: true }
                  - { label: Sous-titre, name: sous_titre, widget: text, required: false }
                  - label: Questions
                    name: questions
                    widget: list
                    required: false
                    label_singular: Question
                    collapsed: true
                    summary: "{{fields.question}}"
                    fields:
                      - { label: Question, name: question, widget: string, required: true }
                      - { label: Réponse, name: reponse, widget: text, required: true }
              - label: Derniers articles du blog
                name: derniers_articles
                widget: object
                summary: "Derniers articles : {{fields.titre}}{{fields.masquer | ternary(' (masqué)', '')}}"
                fields:
                  - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé." }
                  - { label: Titre, name: titre, widget: string, required: false, hint: Mettez un mot entre *astérisques* pour l'afficher en rouge. Les articles sont repris automatiquement du blog., default: Nos derniers *articles* }
                  - label: Lien vers le blog
                    name: lien_tout
                    widget: object
                    required: false
                    collapsed: false
                    summary: "{{fields.texte}} ({{fields.lien}})"
                    fields:
                      - { label: Texte du bouton, name: texte, widget: string, required: false, default: Tout le blog }
                      - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: false, default: https://blog.4sh.fr/ }
              - label: Équipe (photo et texte)
                name: equipe
                widget: object
                summary: "Équipe : {{fields.titre}}{{fields.masquer | ternary(' (masqué)', '')}}"
                fields:
                  - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé." }
                  - { label: Surtitre, name: surtitre, widget: string, required: false }
                  - { label: Titre, name: titre, widget: string, required: true, hint: Mettez un mot entre *astérisques* pour l'afficher en rouge. }
                  - { label: Texte, name: texte, widget: text, required: false }
                  - label: Photo de l'équipe
                    name: photo
                    widget: object
                    required: false
                    collapsed: true
                    summary: "{{fields.fichier}}"
                    fields:
                      - { label: Image, name: fichier, widget: image, required: false }
                      - { label: Texte alternatif, name: alt, widget: string, required: false, hint: "Obligatoire sauf si l'image est décorative. Décrivez ce que montre l'image. À défaut, le titre est utilisé." }
                      - { label: Image décorative (aucune information à transmettre), name: decorative, widget: boolean, required: false, default: false }
                      - { label: Crédit photo, name: credit, widget: string, required: false }
                      - label: Cadrage
                        name: cadrage
                        widget: select
                        required: true
                        default: centre
                        hint: Partie de l'image conservée quand elle est recadrée.
                        options:
                          - { label: Centre, value: centre }
                          - { label: Haut, value: haut }
                          - { label: Bas, value: bas }
                          - { label: Gauche, value: gauche }
                          - { label: Droite, value: droite }
                  - label: Bouton
                    name: bouton
                    widget: object
                    required: false
                    collapsed: false
                    summary: "{{fields.texte}} ({{fields.lien}})"
                    fields:
                      - { label: Texte du bouton, name: texte, widget: string, required: false, default: Notre entreprise }
                      - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: false, default: /notre-entreprise/ }
      - name: accueil_en
        label: Page d'accueil (anglais)
        file: src/_data/contenus/en/accueil.json
        preview_path: en/
        fields:
          - label: Référencement
            name: seo
            widget: object
            required: false
            collapsed: true
            summary: "{{fields.meta_title}}"
            hint: Ce qui s'affiche dans les résultats de Google et l'onglet du navigateur.
            fields:
              - { label: Titre SEO (onglet du navigateur), name: meta_title, widget: string, required: false, hint: 60 caractères maximum. }
              - { label: Description SEO, name: meta_description, widget: text, required: false, hint: 155 caractères maximum. }
          - label: Blocs de la page
            name: blocs
            widget: list
            required: false
            label_singular: Bloc
            hint: Les blocs s'affichent dans cet ordre. Faites-les glisser pour les déplacer. Le formulaire de contact reste toujours en bas de page.
            collapsed: true
            typeKey: type
            types:
              - label: Hero (haut de page)
                name: hero
                widget: object
                summary: "Hero : {{fields.accroche}}{{fields.masquer | ternary(' (masqué)', '')}}"
                fields:
                  - { label: Masquer ce bloc (il reste enregistré), name: masquer, widget: boolean, required: false, default: false, hint: "Le bloc n'apparaît plus sur le site, mais son contenu est conservé." }
                  - { label: Titre de la page (H1), name: titre_page, widget: string, required: true, hint: Affiché en petit au-dessus de l'accroche. Lu par Google et les lecteurs d'écran. 60 caractères maximum. }
                  - { label: Accroche, name: accroche, widget: string, required: true, hint: Mettez un mot entre *astérisques* pour l'afficher en rouge. Environ 40 caractères. }
                  - { label: Chapô, name: chapo, widget: text, required: false, hint: 40 mots maximum. }
                  - label: Bouton principal
                    name: bouton_principal
                    widget: object
                    required: true
                    collapsed: false
                    summary: "{{fields.texte}} ({{fields.lien}})"
                    fields:
                      - { label: Texte du bouton, name: texte, widget: string, required: true }
                      - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: true, default: "#contact" }
                  - label: Bouton secondaire
                    name: bouton_secondaire
                    widget: object
                    required: false
                    collapsed: false
                    summary: "{{fields.texte}} ({{fields.lien}})"
                    fields:
                      - { label: Texte du bouton, name: texte, widget: string, required: false }
                      - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: false, default: /references/ }
                  - { label: Note sous les boutons, name: note, widget: string, required: false }
                  - label: Encart visuel
                    name: encart
                    widget: object
                    required: false
                    collapsed: true
                    summary: "{{fields.titre}}"
                    fields:
                      - { label: Afficher l'encart, name: afficher, widget: boolean, required: false, default: true }
                      - { label: Titre de l'encart, name: titre, widget: string, required: false }
                      - label: Lignes
                        name: lignes
                        widget: list
                        required: false
                        label_singular: Ligne
                        collapsed: true
                        summary: "{{fields.cle}} : {{fields.valeur}}"
                        fields:
                          - { label: Mot-clé, name: cle, widget: string, required: false }
                          - { label: Texte, name: valeur, widget: string, required: false }
                      - { label: Badge, name: badge, widget: string, required: false }
                      - { label: Note du badge, name: badge_note, widget: string, required: false }
              - label: Logos clients (Ils nous confient leur métier)
                name: logos_clients
                widget: object
                summary: Logos clients{{fields.masquer | ternary(' (masqué)', '')}}
