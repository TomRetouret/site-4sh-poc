  - name: pages_prestations
    label: Prestations
    label_singular: Prestation
    description: "Pages de prestation (/prestations/...). Ordre fixe : en-tête, chiffres, sections, références, questions fréquentes, formulaire de contact."
    folder: src/content/prestations
    preview_path: "prestations/{{slug}}/"
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    identifier_field: titre
    summary: "{{titre}}"
    sortable_fields: [ordre, titre]
    fields:
      - { label: Nom court de la prestation, name: titre, widget: string, required: true, hint: "Affiché dans le fil d'Ariane et dans l'onglet du navigateur si le titre SEO est vide. 40 caractères maximum. Par exemple : UX Design." }
      - { label: Ordre d'affichage, name: ordre, widget: number, required: false, value_type: int, min: 1, hint: "Nombre entier : le plus petit passe en premier dans la liste des prestations." }
      - label: En-tête de page
        name: entete
        widget: object
        required: true
        collapsed: false
        summary: "{{fields.titre_h1}}"
        fields:
          - label: Couleur d'offre
            name: offre
            widget: select
            required: true
            default: build
            options:
              - { label: "4SH Build · Concevoir & développer", value: build }
              - { label: "4SH Run · Faire vivre & auditer", value: run }
            hint: Donne le surtitre coloré au-dessus du grand titre et la couleur de la page.
          - { label: Grand titre de la page (H1), name: titre_h1, widget: string, required: true, hint: "Lu par Google et les lecteurs d'écran. 70 caractères maximum. Mettez un mot entre *astérisques* pour l'afficher en rouge." }
          - { label: Chapô, name: chapo, widget: text, required: false, hint: "Deux ou trois phrases sous le grand titre. 50 mots maximum. Sert aussi de description dans Google si la description SEO est vide." }
          - label: Bouton
            name: bouton
            widget: object
            required: true
            summary: "{{fields.texte}}"
            fields:
              - { label: Texte du bouton, name: texte, widget: string, required: true, default: Parlons de votre projet, hint: "30 caractères maximum." }
