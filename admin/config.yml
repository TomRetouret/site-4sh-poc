      - { label: "Ordre d'affichage", name: "ordre", widget: "number", required: false, value_type: "int" }
      - { label: "Titre SEO", name: "meta_title", widget: "string", required: false }
      - { label: "Description SEO", name: "meta_description", widget: "text", required: false }
      - { label: "Cacher cette page de Google (à laisser décoché en temps normal)", name: "noindex", widget: "boolean", required: false, default: false }
      - { label: "Introduction des défis", name: "defis_intro", widget: "text", required: false }
      - label: "Défis du métier"
        name: "defis"
        widget: "list"
