  # -----------------------------------------------------------------------
  # 8) MENU (navigation principale : textes, liens, ordre, colonnes, icônes)
  # -----------------------------------------------------------------------
  - name: "navigation"
    label: "Menu (navigation)"
    files:
      - name: "menu"
        label: "Menu principal"
        file: "src/_data/navigation.json"
        fields: &f_navigation
          - label: "Entrées du menu"
            name: "items"
            widget: "list"
            typeKey: "type"
            hint: "Glissez-déposez pour réordonner. Ajoutez une entrée : lien simple, méga-menu ou menu déroulant."
            types:
              - name: "lien"
                label: "Lien simple"
                fields:
                  - { label: "Libellé", name: "label", widget: "string", required: false }
                  - { label: "Lien", name: "url", widget: "string", required: false }
              - name: "menu_simple"
                label: "Menu déroulant (liste)"
                fields:
                  - { label: "Libellé", name: "label", widget: "string", required: false }
                  - { label: "Titre de la colonne", name: "titre_col", widget: "string", required: false }
                  - label: "Liens"
                    name: "liens"
                    widget: "list"
                    fields:
                      - { label: "Libellé", name: "label", widget: "string", required: false }
                      - { label: "Sous-texte", name: "sous_texte", widget: "string", required: false }
                      - { label: "Lien", name: "url", widget: "string", required: false }
              - name: "megamenu"
                label: "Méga-menu (colonnes)"
                fields:
                  - { label: "Libellé", name: "label", widget: "string", required: false }
                  - { label: "Variante", name: "variant", widget: "select", required: false, options: ["", "menu-secteurs"], hint: "Laisser vide en général." }
                  - label: "Bloc promo (encart de gauche)"
                    name: "promo"
                    widget: "object"
                    required: false
                    collapsed: true
                    fields:
                      - { label: "Titre", name: "titre", widget: "string", required: false }
                      - { label: "Texte", name: "texte", widget: "text", required: false }
                      - { label: "Libellé du lien", name: "lien_libelle", widget: "string", required: false }
                      - { label: "Lien", name: "url", widget: "string", required: false }
                      - label: "Chiffre clé (optionnel)"
                        name: "kpi"
                        widget: "object"
                        required: false
                        fields:
                          - { label: "Valeur", name: "valeur", widget: "string", required: false }
                          - { label: "Libellé", name: "label", widget: "string", required: false }
                  - label: "Colonnes"
                    name: "colonnes"
                    widget: "list"
                    fields:
                      - { label: "Titre de la colonne", name: "titre", widget: "string", required: false }
                      - label: "Liens"
                        name: "liens"
                        widget: "list"
                        fields:
                          - { label: "Libellé", name: "label", widget: "string", required: false }
                          - { label: "Sous-texte", name: "sous_texte", widget: "string", required: false }
                          - { label: "Lien", name: "url", widget: "string", required: false }
                          - { label: "Icône", name: "icone", widget: "select", required: false, options: ["ecran", "cloud", "mobile", "design", "serveurs", "refonte", "audit", "logistique", "eclair", "bouclier", "editeur", "cloud-plus", "reseau", "megaphone", "hub", "graph", "batterie"], hint: "Jeu d'icônes 4SH. Ignoré si une image est fournie." }
                          - { label: "Image (remplace l'icône)", name: "image", widget: "image", required: false, choose_url: true }
                  - label: "Encart bas de menu"
                    name: "bas"
                    widget: "object"
                    required: false
                    collapsed: true
                    fields:
                      - { label: "Titre", name: "titre", widget: "string", required: false }
                      - { label: "Texte", name: "texte", widget: "text", required: false }
                      - { label: "Libellé du bouton", name: "cta_label", widget: "string", required: false }
                      - { label: "Lien du bouton", name: "cta_url", widget: "string", required: false }
          - label: "Boutons d'action (à droite)"
            name: "actions"
            widget: "list"
            fields:
              - { label: "Libellé", name: "label", widget: "string", required: false }
              - { label: "Lien", name: "url", widget: "string", required: false }
              - { label: "Style CSS", name: "style", widget: "string", hint: "Ex. : lien-formations, ou btn btn-primary btn-sm", required: false }
