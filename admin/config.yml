  # -----------------------------------------------------------------------
  # 5 bis) TECHNOLOGIES  (fiches /expertises-techniques/<slug>/)
  # Gabarit fixe : src/_includes/technologie.njk. Champs dans l'ordre de la page :
  # Identité, En-tête, Pourquoi, Références, Contenu détaillé (sections), Formations,
  # Questions fréquentes, Carte de la page mère, Référencement, Suivi interne.
  # nom, famille, logo, accroche_courte et ordre sont aussi lus par la page
  # Expertises techniques (FR et EN) : ne pas les renommer.
  # Spécification : docs/back-office/schema-collections.md
  # -----------------------------------------------------------------------
  - name: "technologies"
    label: "Technologies"
    label_singular: "Technologie"
    description: "Fiches des expertises techniques. Chaque fiche a aussi sa carte sur la page Expertises techniques (française et anglaise)."
    folder: "src/content/technologies"
    preview_path: "expertises-techniques/{{slug}}/"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{nom}}"
    sortable_fields: ["ordre", "nom"]
    fields:
      # --- Identité ---
      - { label: "Identité · Nom de la technologie", name: "nom", widget: "string", required: true, maxlength: 30, hint: "30 caractères maximum. Ex. : Java. Affiché dans le fil d'Ariane, sur la carte de la page Expertises techniques et dans les surtitres par défaut." }
      - label: "Identité · Famille d'offre (couleur)"
        name: "famille"
        widget: "select"
        required: true
        default: "build"
        options:
          - { label: "4SH Build : développement (rouge)", value: "build" }
          - { label: "4SH Run : infrastructure (cyan)", value: "run" }
          - { label: "4SH Learning : formation (violet)", value: "formation" }
        hint: "Donne la couleur d'accent de la fiche et de sa carte."
      - { label: "Identité · Logo", name: "logo", widget: "image", required: false, choose_url: true, hint: "Facultatif. SVG carré sur fond transparent. Affiché dans l'en-tête et sur la carte de la page Expertises techniques. Le texte alternatif est le nom de la technologie (automatique)." }

      # --- En-tête ---
      - { label: "En-tête · Grand titre", name: "h1", widget: "string", required: true, maxlength: 110, hint: "70 caractères conseillés, 110 maximum. Mettez un mot entre *astérisques* pour l'afficher en rouge. Ex. : Développement Angular : applications web et *interfaces métier* sur mesure" }
      - { label: "En-tête · Introduction", name: "intro", widget: "text", required: true, hint: "Paragraphe sous le grand titre, 60 mots maximum. Sert aussi de description pour Google si celle du Référencement est vide." }

      # --- Pourquoi ---
      - { label: "Pourquoi · Surtitre", name: "pourquoi_eyebrow", widget: "string", required: false, maxlength: 40, hint: "Facultatif, 40 caractères maximum. Vide : « Pourquoi <nom> ? »." }
      - { label: "Pourquoi · Titre", name: "pourquoi_titre", widget: "string", required: false, maxlength: 90, hint: "90 caractères maximum. Mettez un mot entre *astérisques* pour l'afficher en rouge. Ex. : Pourquoi utiliser *Kubernetes* ? Vide : pas de titre." }
      - { label: "Pourquoi · Sous-titre", name: "pourquoi_intro", widget: "text", required: false, hint: "Facultatif. Une ou deux phrases sous le titre." }
      - label: "Pourquoi · Atouts"
        name: "atouts"
        widget: "list"
        required: true
        min: 1
        label_singular: "Atout"
        summary: "{{fields.titre}}"
        collapsed: true
        hint: "Quatre par rangée, numérotés automatiquement : 4 ou 8 atouts de préférence."
        fields:
          - { label: "Titre de l'atout", name: "titre", widget: "string", required: true, maxlength: 70, hint: "70 caractères maximum. Ex. : TypeScript pour un code typé et maintenable" }
          - { label: "Texte", name: "texte", widget: "text", required: true, hint: "50 mots maximum, sans mise en forme." }

      # --- Références clients ---
      - label: "Références clients"
        name: "references"
        widget: "list"
        required: false
        label_singular: "Référence"
        summary: "{{fields.titre}}"
        collapsed: true
        hint: "Facultatif. Projets où la technologie a servi, en cartes. Le visuel, le logo et le secteur viennent de la fiche référence choisie."
        fields:
          - label: "Fiche référence"
            name: "fiche"
            widget: "relation"
            required: false
            collection: "references"
            value_field: "{{slug}}"
            search_fields: ["titre", "client"]
            display_fields: ["titre"]
            hint: "Facultatif. Vide : carte sans visuel ni lien (projet sans fiche publiée)."
          - { label: "Titre de la carte", name: "titre", widget: "string", required: true, maxlength: 60, hint: "Client et secteur, 60 caractères maximum. Ex. : Filhet-Allard - Assurance" }
          - { label: "Texte", name: "texte", widget: "text", required: true, hint: "Le rôle de la technologie dans le projet, 60 mots maximum, sans mise en forme." }

      # --- Contenu détaillé ---
      - { label: "Contenu détaillé · Surtitre", name: "corps_eyebrow", widget: "string", required: false, maxlength: 40, hint: "Facultatif, 40 caractères maximum. Ex. : Guide. Vide : « Communauté et écosystème »." }
      - { label: "Contenu détaillé · Titre", name: "corps_titre", widget: "string", required: false, maxlength: 90, hint: "Facultatif, 90 caractères maximum. Mettez un mot entre *astérisques* pour l'afficher en rouge. Ex. : Comprendre *Kubernetes*" }
      - { label: "Contenu détaillé · Texte continu sur fond sombre", name: "corps_sombre", widget: "boolean", required: false, default: false, hint: "Coché : les sections s'affichent en un seul texte sur fond sombre, sans mise en page automatique (pour un contenu court). Décoché : une section par grand thème." }
      - label: "Contenu détaillé · Sections"
        name: "sections"
        widget: "list"
        required: false
        label_singular: "Section"
        summary: "{{fields.titre}}"
        collapsed: true
        hint: "Une section par grand thème, dans l'ordre de la page. Mise en page automatique (fonds alternés, cartes, atouts, étapes), sauf si « Texte continu sur fond sombre » est coché. Vide : le bloc n'est pas affiché."
        fields:
          - { label: "Titre de la section", name: "titre", widget: "string", required: false, maxlength: 110, hint: "Intertitre de la section, 110 caractères maximum. Laisser vide seulement pour un texte d'introduction placé en tout premier. Le titre décide aussi de la mise en page des sous-parties : « approche », « méthode », « démarche », « comment »... donne des étapes numérotées (3 sous-parties minimum) ; « pourquoi », « choisir », « atout », « engagement »... donne des atouts sur deux colonnes ; sinon des cartes." }
          - { label: "Texte d'introduction", name: "texte", widget: "markdown", required: false, buttons: ["bold", "link", "bulleted-list", "numbered-list"], editor_components: [], hint: "Paragraphes sous le titre. Sans sous-partie, une liste de 3 puces ou plus devient une grille de cartes (« **Titre** : texte » donne une carte titrée). Un paragraphe qui ne contient qu'un lien devient un bouton. Un lien vers une fiche (/references/...) affiche l'aperçu de cette référence à côté du texte." }
          - label: "Sous-parties"
            name: "sous_parties"
            widget: "list"
            required: false
            label_singular: "Sous-partie"
            summary: "{{fields.titre}}"
            collapsed: true
            hint: "Facultatif. 2 à 8 sous-parties de même nature, affichées en cartes, atouts ou étapes selon le titre de la section. Au-delà de 3 cartes, elles défilent en carrousel."
            fields:
              - { label: "Titre de la sous-partie", name: "titre", widget: "string", required: true, maxlength: 110, hint: "110 caractères maximum. Ex. : Centralisation de toutes les demandes dans une interface unique" }
              - { label: "Texte", name: "texte", widget: "markdown", required: false, buttons: ["bold", "link", "bulleted-list", "numbered-list"], editor_components: [], hint: "60 mots environ (au-delà de 420 caractères en moyenne, les cartes passent en atouts). Listes à puces possibles." }

      # --- Formations liées ---
      - label: "Formations liées"
        name: "formations"
        widget: "list"
        required: false
        label_singular: "Formation"
        summary: "{{fields.titre}}"
        collapsed: true
        hint: "Facultatif. Cartes vers les fiches formation, trois par rangée. Ajoute le bouton « Nos formations » dans l'en-tête."
        fields:
          - { label: "Titre de la carte", name: "titre", widget: "string", required: true, maxlength: 60, hint: "60 caractères maximum. Ex. : Angular - Les fondamentaux" }
          - label: "Fiche formation"
            name: "formation"
            widget: "relation"
            required: true
            collection: "formations"
            value_field: "{{slug}}"
            search_fields: ["entete.titre", "entete.niveau"]
            display_fields: ["{{entete.titre}} {{entete.sous_titre}} ({{entete.niveau}})"]
            hint: "La carte mène à cette fiche."

      # --- Questions fréquentes ---
      - { label: "Questions fréquentes · Titre", name: "faq_titre", widget: "string", required: false, maxlength: 90, hint: "Facultatif, 90 caractères maximum. Mettez un mot entre *astérisques* pour l'afficher en rouge. Vide : « Questions fréquentes sur <nom> »." }
      - label: "Questions fréquentes · Questions"
        name: "faq"
        widget: "list"
        required: false
        label_singular: "Question"
        summary: "{{fields.question}}"
        collapsed: true
        hint: "Facultatif. 3 à 8 questions, affichées en accordéon. Vide : la section n'est pas affichée."
        fields:
          - { label: "Question", name: "question", widget: "string", required: true, maxlength: 120, hint: "120 caractères maximum." }
          - { label: "Réponse", name: "reponse", widget: "text", required: true, hint: "80 mots maximum, sans mise en forme." }

      # --- Carte de la page Expertises techniques ---
      - { label: "Carte de la page mère · Accroche courte", name: "accroche_courte", widget: "text", required: true, maxlength: 90, hint: "Une phrase, 90 caractères maximum, affichée sur la carte de la page Expertises techniques (française et anglaise)." }
      - { label: "Carte de la page mère · Position", name: "ordre", widget: "number", required: false, value_type: "int", min: 1, hint: "Nombre entier : le plus petit s'affiche en premier sur la page Expertises techniques." }

      # --- Référencement ---
      - label: "Référencement"
        name: "referencement"
        widget: "object"
        required: false
        collapsed: true
        summary: "{{fields.meta_title}}"
        hint: "Ce qui s'affiche dans les résultats de Google et l'onglet du navigateur. Rien n'apparaît sur la page."
        fields:
          - { label: "Titre SEO (onglet du navigateur)", name: "meta_title", widget: "string", required: false, hint: "50 à 60 caractères conseillés. Vide : « <nom> - Expertise technique 4SH »." }
          - { label: "Description SEO", name: "meta_description", widget: "text", required: false, hint: "150 à 160 caractères conseillés. Vide : l'introduction est reprise." }
          - { label: "Afficher dans les moteurs de recherche", name: "indexation", widget: "boolean", required: false, default: true, hint: "Laisser coché en temps normal. Décocher retire la page de Google et du plan du site." }

      # --- Suivi interne (non affiché) ---
      - { label: "Suivi interne · Requête visée (non affichée)", name: "requete_cible", widget: "string", required: false, hint: "Pour mémoire : expression recherchée dans Google que la fiche cible. Ex. : développement Angular" }
      - { label: "Suivi interne · Page d'origine (non affichée)", name: "source_url", widget: "string", required: false, hint: "Pour mémoire : page de l'ancien site dont le contenu est repris." }
      - { label: "Suivi interne · Page Confluence (non affichée)", name: "source_confluence", widget: "string", required: false, hint: "Pour mémoire : page de rédaction dans Confluence." }
      - { label: "Suivi interne · Guide d'origine (non affiché)", name: "guide_source_url", widget: "string", required: false, hint: "Pour mémoire : page de l'ancien site dont vient le contenu détaillé." }

  # -----------------------------------------------------------------------
  # 6) PAGE D'ACCUEIL EN BLOCS  (preuve de concept, voir docs/back-office/schema-blocs.md)
  #    Un seul écran pour le français et l'anglais (multilingue intégré de Sveltia) :
  #    src/_data/contenus/fr/accueil.json et src/_data/contenus/en/accueil.json.
  #    L'ancien fichier src/_data/accueil.json n'est plus édité ici (retour arrière possible).
  # -----------------------------------------------------------------------
  - name: accueil
    label: Page d'accueil
    label_singular: Page d'accueil
    i18n: true
    files:
      - name: accueil
        label: Page d'accueil
        file: src/_data/contenus/{{locale}}/accueil.json
        format: json
        i18n: true
        preview_path: "{{locale}}/"
        fields:
          - label: Référencement
            name: seo
            widget: object
            required: false
            collapsed: true
            summary: "{{fields.meta_title}}"
            hint: Ce qui s'affiche dans les résultats de Google et l'onglet du navigateur.
            fields:
              - { label: Titre SEO (onglet du navigateur), name: meta_title, widget: string, required: false, hint: 50 à 60 caractères conseillés., i18n: true }
              - { label: Description SEO, name: meta_description, widget: text, required: false, hint: 150 à 160 caractères conseillés., i18n: true }
            i18n: true
          - label: Blocs de la page
            name: blocs
            widget: list
            required: false
            label_singular: Bloc
            hint: Les blocs s'affichent dans cet ordre. Faites-les glisser pour les déplacer. Le formulaire de contact reste toujours en bas de page.
            collapsed: true
            typeKey: type
            # >>> BLOCS:accueil (généré par scripts/generer-blocs.js : ne pas modifier à la main)
            types:
              - label: Hero (haut de page)
                name: hero
                widget: object
                summary: 'Hero : {{fields.titre_page}}{{fields.masquer | ternary('' (masqué)'', '''')}}'
                fields:
                  - label: Masquer ce bloc (il reste enregistré)
                    name: masquer
                    widget: boolean
                    required: false
                    default: false
                    hint: Le bloc n'apparaît plus sur le site, mais son contenu est conservé.
                    i18n: true
                  - label: Variante
                    name: variante
                    widget: select
                    required: false
                    default: expressif
                    hint: 'Expressive : grande accroche sur fond sombre, pour l''accueil. Sobre : le titre de la page est le grand titre, pour les pages d''offre et les pages intérieures. Vide : expressive.'
                    options:
                      - label: Expressive (accueil)
                        value: expressif
                      - label: Sobre (pages d'offre et pages intérieures)
                        value: sobre
                    i18n: true
                  - label: Offre (surtitre coloré)
                    name: offre
                    widget: select
                    required: false
                    hint: 'Variante sobre uniquement. Affiche le surtitre de l''offre (par exemple « 4SH Build · Concevoir & développer ») et donne sa couleur à la page. Vide : pas de surtitre.'
                    options:
                      - label: 4SH Build
                        value: build
                      - label: 4SH Run
                        value: run
                      - label: 4SH Learning
                        value: learning
                      - label: 4SH institutionnel
                        value: institutionnel
                    i18n: true
                  - label: Titre de la page (H1)
                    name: titre_page
                    widget: string
                    required: true
                    hint: 'Lu par Google et les lecteurs d''écran. 60 caractères maximum. Expressive : affiché en petit au-dessus de l''accroche. Sobre : c''est le grand titre ; mettez un mot entre *astérisques* pour l''afficher en rouge.'
                    i18n: true
                  - label: Accroche
                    name: accroche
                    widget: string
                    required: false
                    hint: Variante expressive uniquement, et obligatoire dans ce cas. Mettez un mot entre *astérisques* pour l'afficher en rouge. Environ 40 caractères.
                    i18n: true
                  - label: Chapô
                    name: chapo
                    widget: text
                    required: false
                    hint: 40 mots maximum.
                    i18n: true
                  - label: Bouton principal
                    name: bouton_principal
                    widget: object
                    required: true
                    collapsed: false
                    summary: '{{fields.texte}} ({{fields.lien}})'
                    fields:
                      - label: Texte du bouton
                        name: texte
                        widget: string
                        required: true
                        i18n: true
                      - label: 'Destination (adresse ou #ancre)'
                        name: lien
                        widget: string
                        required: true
                        default: '#contact'
                        i18n: true
                    i18n: true
                  - label: Bouton secondaire
                    name: bouton_secondaire
                    widget: object
                    required: false
                    collapsed: false
                    summary: '{{fields.texte}} ({{fields.lien}})'
                    fields:
                      - label: Texte du bouton
                        name: texte
                        widget: string
                        required: false
                        i18n: true
                      - label: 'Destination (adresse ou #ancre)'
                        name: lien
                        widget: string
                        required: false
                        default: /references/
                        i18n: true
                    i18n: true
                  - label: Note sous les boutons
                    name: note
                    widget: string
                    required: false
                    i18n: true
                  - label: Étiquettes
                    name: etiquettes
                    widget: list
                    required: false
                    label_singular: Étiquette
                    max: 4
                    hint: Variante sobre uniquement. Petits mots-clés sous les boutons, 4 au maximum.
                    field:
                      label: Étiquette
                      name: etiquette
                      widget: string
                      required: true
                      hint: 30 caractères maximum.
                      i18n: true
                    i18n: true
                  - label: Encart visuel
                    name: encart
                    widget: object
                    required: false
                    collapsed: true
                    summary: '{{fields.titre}}'
                    fields:
                      - label: Afficher l'encart
                        name: afficher
                        widget: boolean
                        required: false
                        default: true
                        i18n: true
                      - label: Titre de l'encart
                        name: titre
                        widget: string
                        required: false
                        i18n: true
                      - label: Lignes
                        name: lignes
