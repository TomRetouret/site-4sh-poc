  # -----------------------------------------------------------------------
  # 6 ter) PAGES DE DÉMONSTRATION  (scénario « créer une page », français seulement)
  #    Un fichier Markdown par page dans src/demo/, contenu en front matter :
  #    mêmes blocs que l'accueil. Adresse /demo/<nom>/, jamais indexée.
  # -----------------------------------------------------------------------
  - name: demo
    label: Pages de démonstration
    label_singular: Page de démonstration
    folder: src/demo
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    preview_path: demo/{{slug}}/
    identifier_field: titre
    summary: "{{titre}}"
    fields:
      - { label: Titre de la page, name: titre, widget: string, required: true }
      - label: Référencement
        name: seo
        widget: object
        required: false
        collapsed: true
        summary: "{{fields.meta_title}}"
        hint: Ce qui s'affiche dans les résultats de Google et l'onglet du navigateur.
        fields:
          - { label: Titre SEO (onglet du navigateur), name: meta_title, widget: string, required: false, hint: 60 caractères maximum. }
          - { label: Description SEO, name: meta_description, widget: text, required: false, hint: 155 caractères maximum. }
      - label: Blocs de la page
        name: blocs
        widget: list
        required: false
        label_singular: Bloc
        hint: Les blocs s'affichent dans cet ordre. Faites-les glisser pour les déplacer. Le formulaire de contact reste toujours en bas de page.
        collapsed: true
        typeKey: type
        # >>> BLOCS:demo (généré par scripts/generer-blocs.js : ne pas modifier à la main)
        types:
          - label: Hero (haut de page)
            name: hero
            widget: object
            summary: 'Hero : {{fields.titre_page}}{{fields.masquer | ternary('' (masqué)'', '''')}}'
            fields:
              - label: Masquer ce bloc (il reste enregistré)
                name: masquer
                widget: boolean
                required: false
                default: false
                hint: Le bloc n'apparaît plus sur le site, mais son contenu est conservé.
              - label: Variante
                name: variante
                widget: select
                required: false
                default: expressif
                hint: 'Expressive : grande accroche sur fond sombre, pour l''accueil. Sobre : le titre de la page est le grand titre, pour les pages d''offre et les pages intérieures. Vide : expressive.'
                options:
                  - label: Expressive (accueil)
                    value: expressif
                  - label: Sobre (pages d'offre et pages intérieures)
                    value: sobre
              - label: Offre (surtitre coloré)
                name: offre
                widget: select
                required: false
                hint: 'Variante sobre uniquement. Affiche le surtitre de l''offre (par exemple « 4SH Build · Concevoir & développer ») et donne sa couleur à la page. Vide : pas de surtitre.'
                options:
                  - label: 4SH Build
                    value: build
                  - label: 4SH Run
                    value: run
                  - label: 4SH Learning
                    value: learning
                  - label: 4SH institutionnel
                    value: institutionnel
              - label: Titre de la page (H1)
                name: titre_page
                widget: string
                required: true
                hint: 'Lu par Google et les lecteurs d''écran. 60 caractères maximum. Expressive : affiché en petit au-dessus de l''accroche. Sobre : c''est le grand titre ; mettez un mot entre *astérisques* pour l''afficher en rouge.'
              - label: Accroche
                name: accroche
                widget: string
                required: false
                hint: Variante expressive uniquement, et obligatoire dans ce cas. Mettez un mot entre *astérisques* pour l'afficher en rouge. Environ 40 caractères.
              - label: Chapô
                name: chapo
                widget: text
                required: false
                hint: 40 mots maximum.
              - label: Bouton principal
                name: bouton_principal
                widget: object
                required: true
                collapsed: false
                summary: '{{fields.texte}} ({{fields.lien}})'
                fields:
                  - label: Texte du bouton
                    name: texte
                    widget: string
                    required: true
                  - label: 'Destination (adresse ou #ancre)'
                    name: lien
                    widget: string
                    required: true
                    default: '#contact'
              - label: Bouton secondaire
                name: bouton_secondaire
                widget: object
                required: false
                collapsed: false
                summary: '{{fields.texte}} ({{fields.lien}})'
                fields:
                  - label: Texte du bouton
                    name: texte
                    widget: string
                    required: false
                  - label: 'Destination (adresse ou #ancre)'
                    name: lien
                    widget: string
                    required: false
                    default: /references/
              - label: Note sous les boutons
                name: note
                widget: string
                required: false
              - label: Étiquettes
                name: etiquettes
                widget: list
                required: false
                label_singular: Étiquette
                max: 4
                hint: Variante sobre uniquement. Petits mots-clés sous les boutons, 4 au maximum.
                field:
                  label: Étiquette
                  name: etiquette
                  widget: string
                  required: true
                  hint: 30 caractères maximum.
              - label: Encart visuel
                name: encart
                widget: object
                required: false
                collapsed: true
                summary: '{{fields.titre}}'
                fields:
                  - label: Afficher l'encart
                    name: afficher
                    widget: boolean
                    required: false
                    default: true
                  - label: Titre de l'encart
                    name: titre
                    widget: string
                    required: false
                  - label: Lignes
                    name: lignes
                    widget: list
                    required: false
                    label_singular: Ligne
                    collapsed: true
                    summary: '{{fields.cle}} : {{fields.valeur}}'
                    fields:
                      - label: Mot-clé
                        name: cle
                        widget: string
                        required: false
                      - label: Texte
                        name: valeur
                        widget: string
                        required: false
                  - label: Badge
                    name: badge
                    widget: string
                    required: false
                  - label: Note du badge
                    name: badge_note
                    widget: string
                    required: false
                hint: Variante expressive uniquement.
          - label: Haut de page institutionnelle
            name: hero_institutionnel
            widget: object
            summary: 'Haut de page : {{fields.titre_page}}{{fields.masquer | ternary('' (masqué)'', '''')}}'
            fields:
              - label: Masquer ce bloc (il reste enregistré)
                name: masquer
                widget: boolean
                required: false
                default: false
                hint: Le bloc n'apparaît plus sur le site, mais son contenu est conservé.
              - label: Fil d'Ariane
                name: fil_ariane
                widget: list
                required: false
                label_singular: Étape
                hint: 'Petit chemin affiché tout en haut, de l''accueil à la page. La première étape renvoie vers l''accueil. Par exemple : Accueil, L''agence, Notre entreprise. Laissez vide pour ne pas l''afficher.'
                max: 4
                field:
                  label: Étape
                  name: etape
                  widget: string
                  required: true
                  hint: 30 caractères maximum.
              - label: Surtitre
                name: surtitre
                widget: string
                required: false
                hint: Petit texte au-dessus du grand titre. 30 caractères maximum.
              - label: Titre de la page (H1)
                name: titre_page
                widget: string
                required: true
                hint: Le grand titre, lu par Google et les lecteurs d'écran. 70 caractères maximum. Mettez un mot entre *astérisques* pour l'afficher en rouge.
              - label: Chapô
                name: chapo
                widget: text
                required: false
                hint: Paragraphe d'introduction sous le titre. 45 mots maximum.
              - label: Bouton principal
                name: bouton_principal
                widget: object
                required: true
                collapsed: false
                summary: '{{fields.texte}} ({{fields.lien}})'
                fields:
                  - label: Texte du bouton
                    name: texte
                    widget: string
                    required: true
                    hint: 30 caractères maximum.
                  - label: 'Destination (adresse ou #ancre)'
                    name: lien
                    widget: string
                    required: true
                    default: '#contact'
                    hint: '#contact descend au formulaire en bas de page. Une adresse commençant par https:// s''ouvre dans un nouvel onglet.'
              - label: Bouton secondaire
                name: bouton_secondaire
                widget: object
                required: false
                collapsed: false
                summary: '{{fields.texte}} ({{fields.lien}})'
                hint: Laissez le texte vide pour ne pas afficher de second bouton.
                fields:
                  - label: Texte du bouton
                    name: texte
                    widget: string
                    required: false
                    hint: 30 caractères maximum.
                  - label: 'Destination (adresse ou #ancre)'
                    name: lien
                    widget: string
                    required: false
                    default: '#contact'
                    hint: 'Une #ancre descend à la section qui la porte (par exemple #methode). Une adresse commençant par https:// s''ouvre dans un nouvel onglet.'
              - label: Étiquettes
                name: etiquettes
                widget: list
                required: false
                label_singular: Étiquette
                max: 4
                hint: Petits mots-clés sous les boutons, 4 au maximum.
                field:
                  label: Étiquette
                  name: etiquette
                  widget: string
                  required: true
                  hint: 20 caractères maximum.
              - label: Illustration
                name: illustration
                widget: select
                required: true
                default: aucune
                hint: Schéma dessiné à droite du titre (masqué sur téléphone). Ses textes sont écrits dans le gabarit du site, en français.
                options:
                  - label: Aucune
                    value: aucune
                  - label: 'Notre démarche : de votre idée à la mise en production'
                    value: demarche
                  - label: 'Notre entreprise : nos agences autour de 4SH'
                    value: entreprise
          - label: Logos clients (Ils nous confient leur métier)
            name: logos_clients
            widget: object
            summary: Logos clients{{fields.masquer | ternary(' (masqué)', '')}}
            fields:
              - label: Masquer ce bloc (il reste enregistré)
                name: masquer
                widget: boolean
                required: false
                default: false
                hint: Le bloc n'apparaît plus sur le site, mais son contenu est conservé.
              - label: Titre
                name: titre
                widget: string
                required: false
                hint: Laisser vide pour reprendre l'intitulé des réglages du site. Les noms des clients se modifient dans les réglages du site.
          - label: Chiffres animés
            name: chiffres_compteurs
            widget: object
            summary: Chiffres animés{{fields.masquer | ternary(' (masqué)', '')}}
            fields:
              - label: Masquer ce bloc (il reste enregistré)
                name: masquer
                widget: boolean
                required: false
                default: false
                hint: Le bloc n'apparaît plus sur le site, mais son contenu est conservé.
              - label: Chiffres
                name: chiffres
                widget: list
                required: true
                label_singular: Chiffre
                collapsed: true
                min: 2
                max: 6
                summary: '{{fields.valeur}} {{fields.texte}}'
                hint: De 2 à 6 chiffres, sur un bandeau sombre. Au-delà de 4, le bandeau défile sur téléphone.
                fields:
                  - label: Chiffre
                    name: valeur
                    widget: string
                    required: true
                    hint: Tel qu'affiché, par exemple 2007, 96% ou 58. 6 caractères maximum.
                  - label: Libellé
                    name: texte
                    widget: string
                    required: true
                    hint: Ce que mesure le chiffre. 70 caractères maximum.
                  - label: Note (petit texte)
                    name: note
                    widget: string
                    required: false
                    hint: 'Source ou précision, en petit sous le libellé. Par exemple : statistiques 4PM.'
                  - label: Animer le chiffre
                    name: animer
                    widget: boolean
                    required: false
                    default: true
                    hint: Le chiffre défile de 0 à sa valeur quand il apparaît à l'écran. Sans effet si le chiffre ne commence pas par un nombre entier (par exemple 4,7).
          - label: Cartes d'offres (Build, Run, Learning)
            name: cartes_offres
            widget: object
            summary: 'Cartes d''offres : {{fields.titre}}{{fields.masquer | ternary('' (masqué)'', '''')}}'
            fields:
              - label: Masquer ce bloc (il reste enregistré)
                name: masquer
                widget: boolean
                required: false
                default: false
                hint: Le bloc n'apparaît plus sur le site, mais son contenu est conservé.
              - label: Surtitre
                name: surtitre
                widget: string
                required: false
              - label: Titre
                name: titre
                widget: string
                required: true
                hint: Mettez un mot entre *astérisques* pour l'afficher en rouge.
              - label: Sous-titre
                name: sous_titre
                widget: text
                required: false
              - label: Cartes
                name: cartes
                widget: list
                required: false
                label_singular: Carte
                collapsed: true
                min: 1
                max: 3
                summary: '{{fields.titre}}'
                hint: De 1 à 3 cartes.
                fields:
                  - label: Couleur d'offre
                    name: offre
                    widget: select
                    required: true
                    default: build
                    hint: Donne la couleur, le picto et l'étiquette de la carte.
                    options:
                      - label: 4SH Build
                        value: build
                      - label: 4SH Run
                        value: run
                      - label: 4SH Learning
                        value: learning
                      - label: 4SH institutionnel
                        value: institutionnel
                  - label: Titre
                    name: titre
                    widget: string
                    required: true
                  - label: Texte
                    name: texte
                    widget: text
                    required: true
                  - label: Liens
                    name: liens
                    widget: list
                    required: false
                    label_singular: Lien
                    collapsed: true
                    summary: '{{fields.texte}}'
                    fields:
                      - label: Texte du bouton
                        name: texte
                        widget: string
                        required: false
                      - label: 'Destination (adresse ou #ancre)'
                        name: lien
                        widget: string
                        required: false
                  - label: Lien de bas de carte
                    name: lien_bas
                    widget: object
                    required: false
                    collapsed: false
                    summary: '{{fields.texte}} ({{fields.lien}})'
                    fields:
                      - label: Texte du bouton
                        name: texte
                        widget: string
                        required: false
                      - label: 'Destination (adresse ou #ancre)'
                        name: lien
                        widget: string
                        required: false
          - label: Frise de méthode (fond sombre)
            name: frise_methode
            widget: object
            summary: 'Frise de méthode : {{fields.titre}}{{fields.masquer | ternary('' (masqué)'', '''')}}'
            fields:
              - label: Masquer ce bloc (il reste enregistré)
                name: masquer
                widget: boolean
                required: false
                default: false
                hint: Le bloc n'apparaît plus sur le site, mais son contenu est conservé.
              - label: Ancre de la section
                name: ancre
                widget: string
                required: false
                pattern:
                  - ^[a-z0-9-]*$
                  - Minuscules sans accent, chiffres et tirets uniquement.
                hint: 'Nom court qui permet à un bouton d''y descendre avec #nom (par exemple methode pour #methode). Facultatif.'
              - label: Surtitre
                name: surtitre
                widget: string
                required: false
                hint: Petit texte au-dessus du titre. 30 caractères maximum.
              - label: Titre
                name: titre
                widget: string
                required: true
                hint: 60 caractères maximum. Mettez un mot entre *astérisques* pour l'afficher en rouge.
              - label: Sous-titre
                name: sous_titre
                widget: text
                required: false
                hint: 50 mots maximum.
              - label: Étapes
                name: etapes
                widget: list
                required: true
                label_singular: Étape
                collapsed: true
                min: 3
                max: 6
                summary: '{{fields.numero}} {{fields.titre}}'
                hint: De 3 à 6 étapes, affichées dans l'ordre de la liste.
                fields:
                  - label: Numéro
                    name: numero
                    widget: string
                    required: true
                    hint: Affiché en grand, par exemple 1.
                  - label: Phase
                    name: phase
                    widget: string
                    required: false
                    hint: Mot court à côté du numéro, par exemple Découvrir.
                  - label: Titre
                    name: titre
                    widget: string
                    required: true
                    hint: 40 caractères maximum.
                  - label: Texte
                    name: texte
                    widget: text
                    required: true
                    hint: 35 mots maximum.
          - label: Chiffres clés
            name: chiffres_cles
            widget: object
            summary: Chiffres clés{{fields.masquer | ternary(' (masqué)', '')}}
            fields:
              - label: Masquer ce bloc (il reste enregistré)
                name: masquer
                widget: boolean
                required: false
                default: false
                hint: Le bloc n'apparaît plus sur le site, mais son contenu est conservé.
              - label: Chiffres
                name: chiffres
                widget: list
                required: false
                label_singular: Chiffre
                collapsed: true
                min: 2
                max: 4
                summary: '{{fields.valeur}} {{fields.texte}}'
                hint: De 2 à 4 chiffres.
                fields:
                  - label: Chiffre
                    name: valeur
                    widget: string
                    required: true
                  - label: Libellé
                    name: texte
                    widget: string
                    required: true
                  - label: Note (petit texte)
                    name: note
                    widget: string
                    required: false
          - label: Cartes secteurs (carrousel)
            name: cartes_secteurs
            widget: object
