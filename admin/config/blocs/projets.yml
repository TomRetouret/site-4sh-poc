# Bloc « projets » : Projets (carrousel de réalisations)
# Composant du site : src/_includes/composants/blocs/projets.njk
# Mode d'emploi : docs/back-office/schema-blocs.md (« Ajouter un bloc »).
# Après modification : node scripts/generer-blocs.js puis node scripts/assembler-config.js

# Profils où le bloc est proposé, avec son rang dans le menu « Ajouter un bloc » (10, 20, 30...).
profils:
  accueil: 70
  demo: 70
  offre: 80

# Définition du type de bloc pour le CMS (sans i18n : le générateur l'ajoute pour l'accueil).
type:
  label: Projets (carrousel de réalisations)
  name: projets
  widget: object
  summary: 'Projets : {{fields.titre}}{{fields.masquer | ternary('' (masqué)'', '''')}}'
  fields:
    - label: Masquer ce bloc (il reste enregistré)
      name: masquer
      widget: boolean
      required: false
      default: false
      hint: Le bloc n'apparaît plus sur le site, mais son contenu est conservé.
    - label: Surtitre
      name: surtitre
      widget: string
      required: false
    - label: Titre
      name: titre
      widget: string
      required: true
      hint: Mettez un mot entre *astérisques* pour l'afficher en rouge.
    - label: Sous-titre
      name: sous_titre
      widget: text
      required: false
    - label: Projets
      name: projets
      widget: list
      required: false
      label_singular: Projet
      collapsed: true
      summary: '{{fields.client}} ({{fields.secteur}})'
      fields:
        - label: Secteur
          name: secteur
          widget: string
          required: false
        - label: Client
          name: client
          widget: string
          required: true
        - label: Visuel du projet
          name: image
          widget: object
          required: false
          collapsed: true
          summary: '{{fields.fichier}}'
          fields:
            - label: Image
              name: fichier
              widget: image
              required: false
            - label: Texte alternatif
              name: alt
              widget: string
              required: false
              hint: Obligatoire sauf si l'image est décorative. Décrivez ce que montre l'image.
            - label: Image décorative (aucune information à transmettre)
              name: decorative
              widget: boolean
              required: false
              default: false
            - label: Crédit photo
              name: credit
              widget: string
              required: false
            - label: Cadrage
              name: cadrage
              widget: select
              required: true
              default: centre
              hint: Partie de l'image conservée quand elle est recadrée.
              options:
                - label: Centre
                  value: centre
                - label: Haut
                  value: haut
                - label: Bas
                  value: bas
                - label: Gauche
                  value: gauche
                - label: Droite
                  value: droite
        - label: Description
          name: description
          widget: text
          required: false
        - label: Témoignage
          name: temoignage
          widget: relation
          required: false
          hint: Choisissez un témoignage de la collection Témoignages. Pour en créer un, passez par cette collection.
          collection: temoignages
          value_field: '{{slug}}'
          display_fields:
            - '{{entreprise}} {{auteur}}'
          search_fields:
            - entreprise
            - auteur
            - citation
        - label: Chiffres du projet
          name: chiffres
          widget: list
          required: false
          label_singular: Chiffre
          collapsed: true
          summary: '{{fields.valeur}} {{fields.libelle}}'
          fields:
            - label: Chiffre
              name: valeur
              widget: string
              required: false
              hint: Mettez un mot entre *astérisques* pour l'afficher en rouge.
            - label: Libellé
              name: libelle
              widget: string
              required: false
        - label: Bouton du projet
          name: bouton
          widget: object
          required: false
          collapsed: false
          summary: '{{fields.texte}} ({{fields.lien}})'
          fields:
            - label: Texte du bouton
              name: texte
              widget: string
              required: false
            - label: 'Destination (adresse ou #ancre)'
              name: lien
              widget: string
              required: false
    - label: Bouton sous le carrousel
      name: bouton_bas
      widget: object
      required: false
      collapsed: false
      summary: '{{fields.texte}} ({{fields.lien}})'
      fields:
        - label: Texte du bouton
          name: texte
          widget: string
          required: false
        - label: 'Destination (adresse ou #ancre)'
          name: lien
          widget: string
          required: false
          default: /references/
