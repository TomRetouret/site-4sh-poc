                  - label: Chapô
                    name: chapo
                    widget: text
                    required: false
                    hint: 40 mots maximum.
                  - label: Bouton principal
                    name: bouton_principal
                    widget: object
                    required: true
                    collapsed: false
                    summary: '{{fields.texte}} ({{fields.lien}})'
                    fields:
                      - label: Texte du bouton
                        name: texte
                        widget: string
                        required: true
                      - label: 'Destination (adresse ou #ancre)'
                        name: lien
                        widget: string
                        required: true
