                        name: badge
                        widget: string
                        required: false
                        i18n: true
                      - label: Note du badge
                        name: badge_note
                        widget: string
                        required: false
                        i18n: true
                    hint: Variante expressive uniquement.
                    i18n: true
              - label: Logos clients (Ils nous confient leur métier)
