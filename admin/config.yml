            # <<< BLOCS

      - name: page_ia
        label: Intelligence artificielle
        file: src/intelligence-artificielle.md
        format: frontmatter
        preview_path: intelligence-artificielle/
        fields:
          - { label: Gabarit, name: layout, widget: hidden, required: false, default: page-libre.njk }
          - { label: Adresse de la page, name: permalink, widget: hidden, required: false, default: /intelligence-artificielle/ }
          - &f_referencement
            label: Référencement
            name: referencement
            widget: object
            required: true
            collapsed: true
            summary: "{{fields.meta_title}}"
            hint: "Ce qui s'affiche dans les résultats de Google et dans l'onglet du navigateur. N'apparaît pas dans la page."
            fields:
              - { label: Titre SEO (onglet du navigateur), name: meta_title, widget: string, required: true, hint: "50 à 60 caractères conseillés. Vide : le titre par défaut des Réglages SEO s'affiche." }
              - { label: Description SEO, name: meta_description, widget: text, required: true, hint: "150 à 160 caractères conseillés. Résumé affiché sous le titre dans Google." }
          - { label: Nom de la page (fil d'Ariane), name: titre, widget: string, required: true, hint: "Dernier mot du petit chemin tout en haut de la page, après Accueil. 30 caractères maximum." }
          - label: Haut de page
            name: hero
            widget: object
            required: true
            collapsed: false
            fields:
              - { label: Surtitre, name: surtitre, widget: string, required: false, hint: Petit texte au-dessus du grand titre. 30 caractères maximum. }
              - { label: Titre principal (H1), name: titre, widget: string, required: true, hint: "Le grand titre, lu par Google et les lecteurs d'écran. 90 caractères maximum. Mettez un mot entre *astérisques* pour l'afficher en rouge." }
              - { label: Chapô, name: chapo, widget: text, required: false, hint: Paragraphe d'introduction sous le titre. 60 mots maximum. }
              - label: Bouton
                name: bouton
                widget: object
                required: false
                summary: "{{fields.texte}} ({{fields.lien}})"
                hint: Laissez le texte vide pour ne pas afficher de bouton.
                fields:
                  - { label: Texte du bouton, name: texte, widget: string, required: false, hint: 35 caractères maximum. }
                  - { label: Destination, name: lien, widget: string, required: false, default: /contact/, hint: "Vide : la page Contact." }
          - label: Contenu de la page
            name: body
            widget: markdown
            required: true
            hint: "Chaque titre de niveau 2 ouvre une nouvelle section (fond alterné). Titres de niveau 3 pour les sous-parties. Un lien seul sur sa ligne devient un bouton. Gras, liens et listes ; pas d'image ni de HTML."
            buttons: [heading-two, heading-three, bold, link, bulleted-list, numbered-list]
            editor_components: []
            modes: [rich_text, raw]
          - label: Références mises en avant
            name: references
            widget: relation
            required: false
            multiple: true
            collection: references
            value_field: "{{slug}}"
            search_fields: [titre, client]
            display_fields: [titre]
            hint: Fiches Références affichées en cartes après le contenu.
          - label: Questions fréquentes
            name: faq
            widget: list
            required: false
            label_singular: Question
            summary: "{{fields.question}}"
            collapsed: true
            hint: Affichées en accordéon en bas de page, et transmises à Google (données structurées FAQ).
            fields:
              - { label: Question, name: question, widget: string, required: true, hint: 90 caractères maximum. }
              - { label: Réponse, name: reponse, widget: text, required: true, hint: 80 mots maximum. }
          - { label: Afficher le formulaire de contact en bas de page, name: contact_final, widget: boolean, required: false, default: true }
          - &f_suivi
            label: Suivi éditorial (interne)
            name: suivi
            widget: object
            required: false
            collapsed: true
            hint: Notes de travail, jamais affichées sur le site.
            fields:
              - { label: Requête visée, name: requete_cible, widget: string, required: false, hint: "Expression de recherche que la page vise dans Google." }
              - { label: Page source dans Confluence, name: source_confluence, widget: string, required: false }
              - { label: Adresse sur l'ancien site, name: source_url, widget: string, required: false }

      - name: page_podcasts
        label: Podcasts (Vision Tech)
        file: src/_data/page_podcasts.json
        format: json
        preview_path: podcasts/
        fields:
          - *f_seo_page
          - label: Haut de page
            name: hero
            widget: object
            required: true
            collapsed: false
            fields:
              - { label: Surtitre, name: surtitre, widget: string, required: false, hint: Petit texte au-dessus du grand titre. 30 caractères maximum. }
              - { label: Titre principal (H1), name: titre, widget: string, required: true, hint: "70 caractères maximum. Mettez un mot entre *astérisques* pour l'afficher en rouge." }
              - { label: Chapô, name: chapo, widget: text, required: false, hint: 40 mots maximum. }
              - label: Boutons d'écoute
                name: plateformes
                widget: list
                required: false
                label_singular: Plateforme
                summary: "{{fields.label}}"
                max: 4
                hint: "Un bouton par plateforme, sous le chapô. « Écouter sur » est ajouté devant le nom. Le premier bouton est plein, les suivants en contour ; tous s'ouvrent dans un nouvel onglet."
                fields:
                  - { label: Nom de la plateforme, name: label, widget: string, required: true, hint: "Par exemple : Spotify." }
                  - { label: Adresse du podcast sur la plateforme, name: url, widget: string, required: true }
          - label: Épisodes
            name: episodes
            widget: list
            required: true
            label_singular: Épisode
            summary: "{{fields.date}} : {{fields.titre}}"
            collapsed: true
            hint: Affichés dans l'ordre de la liste. Mettez le plus récent en premier.
            fields:
              - { label: Date de diffusion, name: date, widget: string, required: true, hint: "Telle qu'affichée, par exemple : 30 juin 2025." }
              - { label: Durée, name: duree, widget: string, required: true, hint: "Par exemple : 21:47." }
              - { label: Titre de l'épisode, name: titre, widget: string, required: true, hint: 80 caractères maximum. }
              - { label: Résumé, name: resume, widget: text, required: true, hint: 50 mots maximum. }
              - { label: Lien Spotify, name: spotify, widget: string, required: true, hint: Toujours affiché. }
              - { label: Lien Deezer, name: deezer, widget: string, required: false, hint: "Vide : pas de lien Deezer." }
              - { label: Lien Apple Podcasts, name: apple, widget: string, required: false, hint: "Vide : pas de lien Apple Podcasts." }

      - name: contact
        label: Contact
        file: src/_data/contact.json
        format: json
        preview_path: contact/
        fields:
          - *f_seo_page
          - label: Haut de page
            name: hero
            widget: object
            required: true
            collapsed: false
            hint: "Les arguments, le téléphone, les villes et le formulaire de la page viennent des Réglages du site (Bloc contact, Coordonnées, Formulaire) : ils sont communs à tout le site."
            fields:
              - { label: Titre principal (H1), name: titre, widget: string, required: true, hint: "60 caractères maximum. Mettez un mot entre *astérisques* pour l'afficher en rouge." }
              - { label: Chapô, name: chapo, widget: text, required: false, hint: 40 mots maximum. }

  # -----------------------------------------------------------------------
  # PAGES MÈRES (listes alimentées par les collections ; versions anglaises : 160-pages_en.yml)
  # -----------------------------------------------------------------------
  - name: pages_meres
    label: Pages mères
    label_singular: Page mère
    description: "Pages d'entrée des grandes listes du site. Les cartes (formations, références, technologies, termes) viennent des collections correspondantes ; ici, seulement les textes de la page."
    files:
      - name: page_formations
        label: Formations (catalogue 4SH Learning)
        file: src/_data/page_formations.json
        format: json
        preview_path: formations/
        fields: &f_page_formations
          - *f_seo_page
          - label: Haut de page
            name: hero
            widget: object
            required: true
            collapsed: false
            fields:
              - { label: Surtitre, name: surtitre, widget: string, required: false, hint: "Petit texte coloré au-dessus du titre, par exemple : 4SH Learning." }
              - { label: Titre principal (H1), name: titre, widget: string, required: true, hint: "60 caractères maximum. Mettez un mot entre *astérisques* pour l'afficher en rouge." }
              - { label: Chapô, name: chapo, widget: text, required: true, hint: 45 mots maximum. }
              - { label: Note moyenne, name: note, widget: string, required: false, hint: "Affichée sous le chapô, par exemple : 4,71 / 5." }
              - { label: Détail de la note, name: note_detail, widget: string, required: false, hint: "À droite de la note, par exemple : 324 participant·e·s." }
              - label: Bouton principal
                name: bouton_principal
                widget: object
                required: true
                summary: "{{fields.texte}} ({{fields.lien}})"
                fields:
                  - { label: Texte du bouton, name: texte, widget: string, required: true, hint: 30 caractères maximum. }
                  - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: true, default: "#catalogue", hint: "#catalogue descend au catalogue." }
              - label: Bouton secondaire
                name: bouton_secondaire
                widget: object
                required: true
                summary: "{{fields.texte}} ({{fields.lien}})"
                fields:
                  - { label: Texte du bouton, name: texte, widget: string, required: true, hint: 30 caractères maximum. }
                  - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: true, default: "#contact", hint: "#contact descend au formulaire de devis." }
              - label: Étiquettes
                name: etiquettes
                widget: list
                required: false
                max: 4
                hint: Petits mots-clés sous les boutons.
                field: { label: Étiquette, name: etiquette, widget: string, required: true, hint: 25 caractères maximum. }
              - label: Animation (trois mots)
                name: etapes
                widget: list
                required: true
                min: 3
                max: 3
                hint: "Les trois mots du schéma animé à droite du titre, dans l'ordre (par exemple : Comprendre, Pratiquer, Maîtriser)."
                field: { label: Mot, name: mot, widget: string, required: true, hint: 12 caractères maximum. }
          - label: Pourquoi choisir 4SH Learning
            name: pourquoi
            widget: object
            required: true
            collapsed: true
            summary: "{{fields.titre}}"
            fields:
              - { label: Titre, name: titre, widget: string, required: true, hint: "60 caractères maximum. Mettez un mot entre *astérisques* pour l'afficher en rouge." }
              - label: Cartes
                name: cartes
                widget: list
                required: true
                min: 3
                max: 3
                label_singular: Carte
                summary: "{{fields.titre}}"
                hint: Trois cartes ; chacune a son pictogramme, dans l'ordre de la liste.
                fields:
                  - { label: Titre, name: titre, widget: string, required: true, hint: 40 caractères maximum. }
                  - { label: Texte, name: texte, widget: text, required: true, hint: 35 mots maximum. }
          - label: Catalogue
            name: catalogue
            widget: object
            required: true
            collapsed: true
            summary: "{{fields.titre}}"
            hint: "Les formations, la recherche et les filtres viennent des fiches Formations et des Textes récurrents (Catalogue de formations). Le lien vers le catalogue PDF se règle dans Réglages du site, Documents téléchargeables (page française seulement)."
            fields:
              - { label: Titre, name: titre, widget: string, required: true, hint: "60 caractères maximum. Mettez un mot entre *astérisques* pour l'afficher en rouge." }
              - { label: Sous-titre, name: sous_titre, widget: text, required: false, hint: 30 mots maximum. }
          - label: Agenda des prochaines sessions
            name: agenda
            widget: object
            required: true
            collapsed: true
            summary: "{{fields.titre}}"
            fields:
              - { label: Titre, name: titre, widget: string, required: true, hint: "60 caractères maximum. Mettez un mot entre *astérisques* pour l'afficher en rouge." }
              - { label: Sous-titre, name: sous_titre, widget: text, required: false, hint: 30 mots maximum. }
              - label: Mois
                name: mois
                widget: list
                required: false
                label_singular: Mois
                summary: "{{fields.mois}}"
                collapsed: true
                hint: Un groupe par mois, dans l'ordre chronologique.
                fields:
                  - { label: Mois, name: mois, widget: string, required: true, hint: "Tel qu'affiché, par exemple : Septembre 2026." }
                  - label: Sessions
                    name: sessions
                    widget: list
                    required: true
                    label_singular: Session
                    summary: "{{fields.jour}} {{fields.mois_court}} : {{fields.titre}}"
                    collapsed: true
                    fields:
                      - { label: Jour, name: jour, widget: string, required: true, hint: "Par exemple : 15." }
                      - { label: Mois abrégé, name: mois_court, widget: string, required: true, hint: "Par exemple : Sept." }
                      - { label: Durée, name: duree, widget: string, required: true, hint: "Par exemple : 2 jours." }
                      - { label: Logo de la technologie, name: logo, widget: image, required: false, choose_url: true, hint: "Son texte alternatif est le titre de la formation, ajouté automatiquement." }
                      - { label: Titre de la formation, name: titre, widget: string, required: true, hint: "Par exemple : Angular - Fondamental." }
                      - { label: Catégorie (pastille), name: categorie, widget: string, required: true, hint: "Catégorie du catalogue : Develop, Design, DevOps, Outils ou IA (Tools en anglais)." }
                      - { label: Lieu, name: lieu, widget: string, required: true, hint: "Par exemple : Bordeaux, Paris ou À distance." }
                      - { label: Modalité, name: modalite, widget: string, required: true, hint: "Présentiel, Distanciel ou Présentiel & distanciel." }
                      - { label: Lien d'inscription, name: url, widget: string, required: true, hint: "Bouton « S'inscrire », en général la fiche de la formation (par exemple /formations/angular-fondamental/)." }
              - label: Bouton sous l'agenda
                name: bouton
                widget: object
                required: true
                summary: "{{fields.texte}} ({{fields.lien}})"
                fields:
                  - { label: Texte du bouton, name: texte, widget: string, required: true, hint: 35 caractères maximum. }
                  - { label: "Destination (adresse ou #ancre)", name: lien, widget: string, required: true, default: "#contact" }
          - label: Certification Qualiopi
            name: qualiopi
            widget: object
            required: true
            collapsed: true
            summary: "{{fields.titre}}"
            hint: "Encadré avec le logo Qualiopi. Les liens (certificat, politique d'accessibilité, CGV) se règlent dans Réglages du site, Documents téléchargeables (page française seulement)."
            fields:
              - { label: Titre, name: titre, widget: string, required: true, hint: "70 caractères maximum. Mettez un mot entre *astérisques* pour l'afficher en rouge." }
              - { label: Texte, name: texte, widget: text, required: true, hint: 50 mots maximum. }
          - label: Témoignages de stagiaires
            name: temoignages
            widget: object
            required: true
            collapsed: true
            summary: "{{fields.titre}}"
            fields:
              - { label: Titre, name: titre, widget: string, required: true, hint: "60 caractères maximum. Mettez un mot entre *astérisques* pour l'afficher en rouge." }
              - label: Témoignages
                name: liste
                widget: list
                required: false
                label_singular: Témoignage
                summary: "{{fields.nom}}"
                hint: "Ne publiez que des témoignages réels et autorisés. Les textes entre crochets sont provisoires."
                fields:
                  - { label: Citation, name: citation, widget: text, required: true, hint: 40 mots maximum. }
                  - { label: Initiales (pastille), name: initiales, widget: string, required: true, hint: "Deux lettres, par exemple : CM." }
                  - { label: Nom, name: nom, widget: string, required: true }
                  - { label: Détail, name: detail, widget: string, required: false, hint: "Société et formation suivie, par exemple : Acme · Formation Angular." }

      - name: page_references
        label: Références (liste des réalisations)
        file: src/_data/page_references.json
        format: json
        preview_path: references/
        fields:
          - *f_seo_page
          - label: Haut de page
            name: hero
            widget: object
            required: true
