          - label: Technologies
            name: technologies
            widget: object
            summary: 'Technologies : {{fields.titre}}{{fields.masquer | ternary('' (masqué)'', '''')}}'
            fields:
              - label: Masquer ce bloc (il reste enregistré)
                name: masquer
                widget: boolean
                required: false
                default: false
                hint: Le bloc n'apparaît plus sur le site, mais son contenu est conservé.
              - label: Surtitre
                name: surtitre
                widget: string
                required: false
              - label: Titre
                name: titre
                widget: string
                required: true
                hint: Mettez un mot entre *astérisques* pour l'afficher en rouge.
              - label: Sous-titre
                name: sous_titre
                widget: text
                required: false
              - label: Affichage
                name: affichage
                widget: select
