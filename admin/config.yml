                            name: cle
                            widget: string
                            required: false
                            i18n: true
                          - label: Texte
                            name: valeur
                            widget: string
                            required: false
                            i18n: true
                        i18n: true
                      - label: Badge
                        name: badge
                        widget: string
                        required: false
                        i18n: true
                      - label: Note du badge
                        name: badge_note
                        widget: string
                        required: false
                        i18n: true
                    hint: Variante expressive uniquement.
                    i18n: true
              - label: Logos clients (Ils nous confient leur métier)
                name: logos_clients
                widget: object
                summary: Logos clients{{fields.masquer | ternary(' (masqué)', '')}}
                fields:
                  - label: Masquer ce bloc (il reste enregistré)
