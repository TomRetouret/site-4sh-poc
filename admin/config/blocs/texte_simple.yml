# Bloc « texte_simple » : Texte simple
# Composant du site : src/_includes/composants/blocs/texte_simple.njk
# Mode d'emploi : docs/back-office/schema-blocs.md (« Ajouter un bloc »).
# Après modification : node scripts/generer-blocs.js puis node scripts/assembler-config.js

# Profils où le bloc est proposé, avec son rang dans le menu « Ajouter un bloc » (10, 20, 30...).
profils:
  demo: 120
  offre: 30

# Définition du type de bloc pour le CMS (sans i18n : le générateur l'ajoute pour l'accueil).
type:
  label: Texte simple
  name: texte_simple
  widget: object
  summary: 'Texte simple : {{fields.titre}}{{fields.masquer | ternary('' (masqué)'', '''')}}'
  fields:
    - label: Masquer ce bloc (il reste enregistré)
      name: masquer
      widget: boolean
      required: false
      default: false
      hint: Le bloc n'apparaît plus sur le site, mais son contenu est conservé.
    - label: Surtitre
      name: surtitre
      widget: string
      required: false
      hint: Petit texte au-dessus du titre. 30 caractères maximum.
    - label: Titre
      name: titre
      widget: string
      required: true
      hint: 60 caractères maximum. Mettez un mot entre *astérisques* pour l'afficher en rouge.
    - label: Texte
      name: texte
      widget: markdown
      required: true
      hint: Gras, liens et listes uniquement. Laissez une ligne vide entre deux paragraphes. 300 mots maximum.
      buttons:
        - bold
        - link
        - bulleted-list
        - numbered-list
      editor_components: []
      modes:
        - rich_text
